<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f8">
<title>Training Register · Football PA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/core-context.js"></script>
<script src="/core-nav.js"></script>
<link rel="stylesheet" href="/core-ui.css">
<style>
.training-page{display:grid;gap:12px}.training-head{padding:17px}.training-head h1{margin:0;font-size:25px}.training-head .sub{margin-top:5px;color:var(--muted);font-size:12px}.new-session{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:14px}.new-session input{min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;font:inherit}.register-card{padding:0;overflow:hidden}.review{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px;border-bottom:1px solid #e8eef4}.review-left{min-width:0}.review-title{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.review select{margin-top:6px;width:min(100%,360px);border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font:inherit}.review-actions{display:flex;gap:8px}.register{width:100%;border-collapse:collapse}.register th,.register td{padding:12px 14px;border-bottom:1px solid #edf1f5;font-size:13px}.register th{background:#f8fafc;color:#657587;font-size:10px;text-transform:uppercase;letter-spacing:.05em}.register th:first-child,.register td:first-child{text-align:left}.register th:last-child,.register td:last-child{text-align:center;width:120px}.player-line{display:flex;align-items:center;gap:10px}.shirt-no{width:34px;height:34px;border-radius:10px;background:#eef4fb;color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:12px;flex:0 0 34px}.player-name{font-weight:900}.attendanceCheck{display:inline-flex;align-items:center;justify-content:center;position:relative;width:42px;height:42px;cursor:pointer}.attendanceCheck input{position:absolute;inset:0;width:42px;height:42px;opacity:0;z-index:2;cursor:pointer}.attendanceCheck span{display:flex;align-items:center;justify-content:center;width:35px;height:35px;border:2px solid #9aabba;border-radius:9px;background:#fff;color:transparent;font-size:20px;font-weight:900}.attendanceCheck input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}.attendanceCheck input:disabled+span{opacity:.55}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px;background:#fbfcfd;border-bottom:1px solid #edf1f5}.summary div{text-align:center}.summary b{display:block;font-size:20px}.summary span{display:block;margin-top:3px;font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.06em}.empty{padding:28px;text-align:center;color:var(--muted)}.status{padding:0 2px;font-size:12px}.status.ok{color:#187747}.status.bad{color:#b42318}.hidden{display:none!important}
@media(max-width:620px){.new-session{grid-template-columns:1fr 1fr}.new-session button{grid-column:1/-1}.review{align-items:stretch;flex-direction:column}.review select{width:100%;max-width:none}.review-actions{width:100%}.review-actions .btn{flex:1}.register th,.register td{padding:12px 10px}.register th:last-child,.register td:last-child{width:92px}.training-head{padding:15px}.training-head h1{font-size:23px}}
</style>
</head>
<body>
<main class="fpa-page">
<div id="loading" class="fpa-card" style="padding:28px;text-align:center">Loading training register…</div>
<div id="app" class="training-page hidden">
  <section class="fpa-card training-head">
    <h1>Training Register</h1>
    <div id="teamLabel" class="sub"></div>
    <div id="newSession" class="new-session">
      <input id="sessionDate" type="date" aria-label="Training date">
      <input id="sessionTitle" value="Training" aria-label="Session title">
      <button id="addSession" class="btn primary">+ Add session</button>
    </div>
  </section>

  <div id="status" class="status"></div>

  <section class="fpa-card register-card">
    <div class="review">
      <div class="review-left"><div class="review-title">Session</div><select id="reviewSession"></select></div>
      <div id="reviewActions" class="review-actions"><button id="selectAll" class="btn primary">Select all</button><button id="deleteSession" class="btn">Delete session</button></div>
    </div>
    <div id="summary" class="summary"></div>
    <div id="empty" class="empty hidden"></div>
    <table id="registerTable" class="register"><thead><tr><th>Player</th><th>Attended</th></tr></thead><tbody id="regBody"></tbody></table>
  </section>
</div>
</main>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ctx,players=[],sessions=[],attendance=[];
const fmt=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
function byShirt(a,b){const an=a?.shirt_number,bn=b?.shirt_number;if(an==null&&bn==null)return String(a?.display_name||'').localeCompare(String(b?.display_name||''),'en-GB',{sensitivity:'base'});if(an==null)return 1;if(bn==null)return-1;return an-bn||String(a?.display_name||'').localeCompare(String(b?.display_name||''),'en-GB',{sensitivity:'base'})}
function setStatus(t,type=''){const e=$('status');e.textContent=t;e.className='status '+type}
function render(){
 if(!sessions.length){
   $('reviewSession').innerHTML='';$('summary').innerHTML='';$('registerTable').classList.add('hidden');$('empty').textContent='No training sessions yet. Add a session above to start taking attendance.';$('empty').classList.remove('hidden');$('reviewActions').classList.add('hidden');return;
 }
 $('reviewActions').classList.toggle('hidden',!ctx.canManage);$('empty').classList.add('hidden');$('registerTable').classList.remove('hidden');
 const prev=$('reviewSession').value;$('reviewSession').innerHTML=sessions.map(s=>'<option value="'+s.id+'">'+fmt(s.session_date)+' · '+esc(s.title||'Training')+'</option>').join('');if(prev&&sessions.some(s=>s.id===prev))$('reviewSession').value=prev;
 const session=sessions.find(s=>s.id===$('reviewSession').value)||sessions[0];$('reviewSession').value=session.id;
 const rows=[...players].sort(byShirt),present=new Set(attendance.filter(a=>a.session_id===session.id&&a.status==='present').map(a=>a.player_id));
 $('summary').innerHTML='<div><b>'+rows.length+'</b><span>SQUAD</span></div><div><b>'+present.size+'</b><span>PRESENT</span></div><div><b>'+Math.max(0,rows.length-present.size)+'</b><span>NOT MARKED</span></div>';const allBtn=$('selectAll');if(allBtn){allBtn.disabled=present.size===rows.length&&rows.length>0;allBtn.textContent=allBtn.disabled?'All selected ✓':'Select all'};
 $('regBody').innerHTML=rows.map(p=>'<tr><td><div class="player-line"><div class="shirt-no">#'+esc(p.shirt_number??'–')+'</div><div class="player-name">'+esc(p.display_name)+'</div></div></td><td><label class="attendanceCheck"><input type="checkbox" data-session="'+session.id+'" data-player="'+p.id+'" '+(present.has(p.id)?'checked':'')+' '+(!ctx.canManage?'disabled':'')+'><span>✓</span></label></td></tr>').join('');
}
async function boot(){try{
 ctx=await FootballPAContext.resolve();FootballPANav.mount({teamId:ctx.team.id});if(ctx.club.primary_colour)document.documentElement.style.setProperty('--blue',ctx.club.primary_colour);
 if(ctx.features?.training===false)throw new Error('Training Register is disabled for this team.');
 $('teamLabel').textContent=ctx.club.name+' · '+ctx.team.name+' · '+(ctx.season?.label||ctx.team.season_label||'Current season');
 if(!ctx.canManage)$('newSession').classList.add('hidden');
 let pq=sb.from('team_players').select('players(id,display_name,shirt_number)').eq('team_id',ctx.team.id).eq('active',true);if(ctx.season?.id)pq=pq.eq('season_id',ctx.season.id);
 const [pr,sr]=await Promise.all([pq,sb.from('training_sessions').select('*').eq('team_id',ctx.team.id).order('session_date',{ascending:false})]);if(pr.error)throw pr.error;if(sr.error)throw sr.error;
 players=(pr.data||[]).map(x=>x.players).filter(Boolean);sessions=sr.data||[];
 const ids=sessions.map(s=>s.id);if(ids.length){const ar=await sb.from('training_attendance').select('*').in('session_id',ids);if(ar.error)throw ar.error;attendance=ar.data||[]}
 render();$('loading').classList.add('hidden');$('app').classList.remove('hidden');
}catch(e){$('loading').innerHTML='<b>Could not load Training Register.</b><br><span class="fpa-muted">'+esc(e.message)+'</span>'}}
$('reviewSession').onchange=render;
$('addSession').onclick=async()=>{const d=$('sessionDate').value,t=$('sessionTitle').value.trim()||'Training';if(!d){setStatus('Choose a training date first.','bad');return}const {data:{user}}=await sb.auth.getUser(),b=$('addSession');b.disabled=true;b.textContent='Adding…';const {data,error}=await sb.from('training_sessions').insert({team_id:ctx.team.id,session_date:d,title:t,created_by:user.id}).select().single();b.disabled=false;b.textContent='+ Add session';if(error){setStatus(error.message,'bad');return}sessions.unshift(data);setStatus('Training session added.','ok');render()};
$('selectAll').onclick=async()=>{if(!ctx.canManage)return;const sessionId=$('reviewSession').value;if(!sessionId||!players.length)return;const b=$('selectAll');b.disabled=true;b.textContent='Saving…';const {data:{user}}=await sb.auth.getUser();const payload=players.map(p=>({session_id:sessionId,player_id:p.id,status:'present',updated_by:user.id}));const {data,error}=await sb.from('training_attendance').upsert(payload).select();if(error){setStatus(error.message,'bad');b.disabled=false;b.textContent='Select all';return}attendance=attendance.filter(a=>a.session_id!==sessionId).concat(data||payload);setStatus('Everyone marked present.','ok');render()};
$('deleteSession').onclick=async()=>{const id=$('reviewSession').value,s=sessions.find(x=>x.id===id);if(!s||!confirm('Delete '+fmt(s.session_date)+' · '+(s.title||'Training')+'? This will also remove its attendance records.'))return;const b=$('deleteSession');b.disabled=true;let r=await sb.from('training_attendance').delete().eq('session_id',id);if(!r.error)r=await sb.from('training_sessions').delete().eq('id',id).eq('team_id',ctx.team.id);b.disabled=false;if(r.error){setStatus(r.error.message,'bad');return}sessions=sessions.filter(x=>x.id!==id);attendance=attendance.filter(x=>x.session_id!==id);setStatus('Training session deleted.','ok');render()};
$('regBody').onchange=async e=>{if(e.target.type!=='checkbox'||!ctx.canManage)return;const s=e.target.dataset.session,p=e.target.dataset.player,checked=e.target.checked;e.target.disabled=true;if(checked){const {data:{user}}=await sb.auth.getUser();const {data,error}=await sb.from('training_attendance').upsert({session_id:s,player_id:p,status:'present',updated_by:user.id}).select().single();if(error){e.target.checked=false;setStatus(error.message,'bad')}else{attendance=attendance.filter(a=>!(a.session_id===s&&a.player_id===p));attendance.push(data)}}else{const {error}=await sb.from('training_attendance').delete().eq('session_id',s).eq('player_id',p);if(error){e.target.checked=true;setStatus(error.message,'bad')}else attendance=attendance.filter(a=>!(a.session_id===s&&a.player_id===p))}e.target.disabled=false;render()};
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('/login.html')});boot();
</script>
</body></html>

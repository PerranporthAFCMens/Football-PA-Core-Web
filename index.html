<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f8">
<title>Football PA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/core-context.js"></script>
<script src="/core-nav.js"></script>
<link rel="stylesheet" href="/core-ui.css">
<style>
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 12px}.home-stat{padding:18px 12px;text-align:center}.home-stat b{display:block;font-size:30px;line-height:1}.home-stat span{display:block;margin-top:8px;font-size:11px;color:var(--muted);font-weight:800}
.home-content{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr);gap:12px}.home-panel{padding:18px}.home-panel h2{margin:0 0 10px;font-size:22px}.fixture-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 0;border-top:1px solid #e8eef4}.fixture-row:first-child{border-top:0}.fixture-row strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fixture-row small{display:block;color:var(--muted);margin-top:3px}.fixture-venue{padding:8px 7px;border-radius:10px;background:#eef4fb;color:#1357A6;text-align:center;font-size:10px;font-weight:900}.fixture-score{text-align:right;font-weight:900}.fixture-score small{font-weight:700}.squad-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #e8eef4}.squad-row:first-child{border-top:0}.shirt{width:38px;height:38px;border-radius:10px;background:#eef4fb;display:grid;place-items:center;font-weight:900;color:#1357A6}.preview-row{margin-bottom:14px}.empty{padding:18px 0;color:var(--muted)}
@media(max-width:720px){.home-content{grid-template-columns:1fr}.home-grid{grid-template-columns:repeat(3,1fr)}.home-panel{padding:15px}.fixture-row{grid-template-columns:58px minmax(0,1fr) auto}}
</style>
</head>
<body>
<main class="fpa-page">
<div id="preview" class="fpa-preview preview-row hidden"><span>DEV PREVIEW · Viewing this team as a customer</span> <button id="exitPreview" class="btn" style="float:right;min-height:0;padding:2px 6px;background:transparent;color:#1357A6">Exit preview</button></div>
<div id="loading" class="fpa-card" style="padding:28px;text-align:center">Loading your Football PA club…</div>
<div id="app" class="hidden"><div id="fixtureNotice" class="fpa-preview hidden" style="background:#eef4fb;border-color:#bfd4ea;color:#102033"></div>
<section class="home-grid" id="stats"></section>
<section class="home-content">
<article class="fpa-card home-panel"><h2>Recent &amp; upcoming</h2><div id="fixtures"></div></article>
<article class="fpa-card home-panel"><h2>Squad snapshot</h2><div id="squad"></div></article>
</section>
</div>
</main>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const final=f=>['ft','full_time','completed','complete','finished'].includes(String(f.status||'').toLowerCase());
const fmtDate=v=>v?new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
function ourScore(f){const v=String(f.venue||'').toLowerCase();if(v==='away'||v==='a')return Number(f.away_score??0);return Number(f.home_score??0)}
function theirScore(f){const v=String(f.venue||'').toLowerCase();if(v==='away'||v==='a')return Number(f.home_score??0);return Number(f.away_score??0)}
function venueLabel(v){v=String(v||'').toLowerCase();return v==='home'||v==='h'?'HOME':v==='away'||v==='a'?'AWAY':'NEUTRAL'}
function sideInfo(row,team,club){const stop=/\b(u\d+|girls|boys|women|men|mixed|youth|afc|fc|first|team|reserves?|seconds?|thirds?)\b/g,norm=s=>String(s||'').toLowerCase().replace(stop,' ').replace(/[^a-z0-9]+/g,' ').trim(),tt=norm(team.name).split(' ').filter(Boolean),ct=norm(club.name).split(' ').filter(Boolean),score=s=>{const n=' '+norm(s)+' ';let z=0;for(const t of tt)if(n.includes(' '+t+' '))z+=4;for(const t of ct)if(n.includes(' '+t+' '))z+=1;return z},hs=score(row.home),as=score(row.away);return hs>as&&hs>0?{venue:'home',opponent:row.away}:as>hs&&as>0?{venue:'away',opponent:row.home}:{venue:'neutral',opponent:null}}
async function checkFixtureUpdates(ctx){const s=ctx.settings||{};if(!s.fixture_sync_on_login||!s.fixture_source_url)return;try{const resp=await fetch('https://hennzggqaquevqgiucqn.supabase.co/functions/v1/fa-fulltime-preview',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ctx.session.access_token,'apikey':'sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW'},body:JSON.stringify({url:s.fixture_source_url,teamId:ctx.team.id})});const data=await resp.json();if(!data.ok)return;const {data:existing}=await sb.from('fixtures').select('external_id,opponent,venue,kick_off,status').eq('team_id',ctx.team.id).eq('external_source','fa_full_time'),map=new Map((existing||[]).map(x=>[String(x.external_id),x]));let changes=0;for(const r of data.rows||[]){const old=map.get(String(r.externalId||r.id));if(!old){changes++;continue}const side=sideInfo(r,ctx.team,ctx.club);const d=r.date?new Date(r.date+'T'+(r.time||'12:00')+':00'):null;if(side.opponent&&(old.opponent!==side.opponent||old.venue!==side.venue))changes++;else if(d&&!Number.isNaN(d.getTime())&&Math.abs(new Date(old.kick_off).getTime()-d.getTime())>60000)changes++;else if(/cancel/i.test(r.status||'')&&old.status!=='cancelled')changes++}await sb.from('team_settings').update({fixture_last_checked_at:new Date().toISOString()}).eq('team_id',ctx.team.id);if(changes){const n=$('fixtureNotice');n.innerHTML='<b>'+changes+' fixture update'+(changes===1?'':'s')+' found.</b> <a href="'+ctx.href('/fixture-sync.html')+'">Review changes</a>';n.classList.remove('hidden')}}catch(e){}}

async function boot(){try{
 const ctx=await FootballPAContext.resolve();const {team,club}=ctx;
 FootballPANav.mount({teamId:team.id});
 if(club.primary_colour)document.documentElement.style.setProperty('--blue',club.primary_colour);
 if(ctx.preview){$('preview').classList.remove('hidden');$('exitPreview').onclick=()=>location.href='/dev-team.html?id='+encodeURIComponent(team.id)}
 const [fr,pr]=await Promise.all([
   sb.from('fixtures').select('id,opponent,venue,competition,status,home_score,away_score,kick_off').eq('team_id',team.id).order('kick_off'),
   sb.from('team_players').select('players(id,display_name,preferred_position,shirt_number)').eq('team_id',team.id).eq('active',true)
 ]);
 if(fr.error)throw fr.error;if(pr.error)throw pr.error;
 const fixtures=fr.data||[],players=(pr.data||[]).map(x=>x.players).filter(Boolean),done=fixtures.filter(final);
 let w=0,d=0,gf=0,ga=0;for(const f of done){const a=ourScore(f),b=theirScore(f);gf+=a;ga+=b;if(a>b)w++;else if(a===b)d++}
 const vals=[[done.length,'P'],[w,'W'],[d,'D'],[gf,'GF'],[ga,'GA'],[(gf-ga>0?'+':'')+(gf-ga),'GD']];
 $('stats').innerHTML=vals.map(v=>'<div class="fpa-card home-stat"><b>'+v[0]+'</b><span>'+v[1]+'</span></div>').join('');
 const now=Date.now(),ordered=[...fixtures].sort((a,b)=>new Date(a.kick_off)-new Date(b.kick_off));let display=ordered.filter(f=>final(f)||new Date(f.kick_off).getTime()>=now-86400000).slice(0,8);if(!display.length)display=ordered.slice(-8);
 $('fixtures').innerHTML=display.length?display.map(f=>{const fin=final(f),score=fin?ourScore(f)+'–'+theirScore(f):'—';return '<div class="fixture-row" data-fixture="'+f.id+'"><div class="fixture-venue">'+venueLabel(f.venue)+'</div><div><strong>'+esc(f.opponent)+'</strong><small>'+esc(f.competition||'Fixture')+'</small></div><div class="fixture-score">'+score+'<small>'+(fin?'FT':fmtDate(f.kick_off))+'</small></div></div>'}).join(''):'<div class="empty">No fixtures yet.</div>';
 document.querySelectorAll('[data-fixture]').forEach(r=>r.onclick=()=>location.href=ctx.href('/match-centre.html','fixture='+encodeURIComponent(r.dataset.fixture)));
 $('squad').innerHTML=players.length?players.slice(0,8).map(p=>'<div class="squad-row"><div class="shirt">'+esc(p.shirt_number??'–')+'</div><div><strong>'+esc(p.display_name)+'</strong><small>'+esc(p.preferred_position||'')+'</small></div></div>').join(''):'<div class="empty">No players in this squad yet.</div>';
 $('loading').classList.add('hidden');$('app').classList.remove('hidden');checkFixtureUpdates(ctx);
}catch(e){$('loading').innerHTML='<b>Could not load Football PA.</b><br><span class="fpa-muted">'+esc(e.message)+'</span>'}}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('/login.html')});boot();
</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f8">
<title>Football PA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/core-context.js"></script>
<script src="/core-nav.js"></script>
<link rel="stylesheet" href="/core-ui.css">
<style>
.home-shell{display:grid;gap:12px}.hero-match{padding:20px;overflow:hidden;position:relative}.hero-match:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-75px;top:-75px;background:color-mix(in srgb,var(--blue) 12%,transparent);pointer-events:none}.hero-kicker{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.hero-date{margin-top:7px;font-size:14px;color:var(--muted);font-weight:700}.hero-opponent{margin:7px 0 3px;font-size:30px;line-height:1.05;font-weight:900;letter-spacing:-.02em}.hero-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.hero-pill{font-size:11px;font-weight:900;border-radius:999px;padding:7px 10px;background:#eef4fb;color:var(--blue)}.hero-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.hero-actions .btn{min-width:130px}.record-card{padding:11px 8px}.record-strip{display:grid;grid-template-columns:repeat(6,1fr)}.record-item{text-align:center;padding:7px 4px;border-left:1px solid #e7edf3}.record-item:first-child{border-left:0}.record-item b{display:block;font-size:20px;line-height:1}.record-item span{display:block;margin-top:5px;font-size:9px;font-weight:900;color:var(--muted);letter-spacing:.08em}.home-lower{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(230px,.7fr);gap:12px}.home-panel{padding:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.panel-head h2{margin:0;font-size:18px}.panel-head a{font-size:12px;font-weight:800;text-decoration:none;color:var(--blue)}.match-list{display:grid}.match-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #e9eef3}.match-row:first-child{border-top:0}.match-result{font-size:18px;font-weight:900;text-align:center}.match-result small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.match-row strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.match-row small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.mini-date{text-align:right;font-size:11px;color:var(--muted);font-weight:800}.team-card{display:grid;gap:12px}.team-big{font-size:34px;font-weight:900;line-height:1}.team-label{font-size:11px;color:var(--muted);font-weight:800;margin-top:4px}.team-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.team-actions .btn{text-align:center;text-decoration:none}.empty{padding:12px 0;color:var(--muted);font-size:13px}.preview-row{margin-bottom:12px}
@media(max-width:720px){html,body{max-width:100%;overflow-x:hidden}.fpa-page,#app,.home-shell,.home-lower,.home-panel,.record-card,.record-strip,.match-list,.match-row,.team-card{min-width:0;max-width:100%}.hero-match{padding:17px}.hero-opponent{font-size:25px;overflow-wrap:anywhere}.hero-actions{display:grid;grid-template-columns:1fr}.hero-actions .btn{width:100%;min-width:0}.home-lower{grid-template-columns:minmax(0,1fr)}.record-strip{grid-template-columns:repeat(3,minmax(0,1fr))}.record-item{border-top:1px solid #e7edf3}.record-item:nth-child(-n+3){border-top:0}.record-item:nth-child(4){border-left:0}.record-item b{font-size:18px}.record-item span{font-size:8px}.home-panel{padding:14px;overflow:hidden}.match-row{grid-template-columns:42px minmax(0,1fr) auto;gap:8px}.match-row>div{min-width:0}.match-row strong{font-size:13px}.mini-date{font-size:10px;white-space:nowrap}.team-actions{grid-template-columns:1fr}.team-actions .btn{width:100%;min-width:0}.fpa-preview{overflow-wrap:anywhere}}
</style>
</head>
<body>
<main class="fpa-page">
<div id="preview" class="fpa-preview preview-row hidden"><span>DEV PREVIEW · Viewing this team as a customer</span> <button id="exitPreview" class="btn" style="float:right;min-height:0;padding:2px 6px;background:transparent;color:#1357A6">Exit preview</button></div>
<div id="loading" class="fpa-card" style="padding:28px;text-align:center">Loading your Football PA club…</div>
<div id="app" class="hidden"><div id="fixtureNotice" class="fpa-preview hidden" style="background:#eef4fb;border-color:#bfd4ea;color:#102033"></div>
<div class="home-shell">
  <section id="nextMatch" class="fpa-card hero-match"></section>
  <section class="fpa-card record-card"><div id="stats" class="record-strip"></div></section>
  <section class="home-lower">
    <article class="fpa-card home-panel"><div class="panel-head"><h2>Recent results</h2></div><div id="recent"></div></article>
    <article class="fpa-card home-panel"><div class="panel-head"><h2>Team</h2></div><div id="teamSummary" class="team-card"></div></article>
  </section>
</div>
</div>
</main>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const final=f=>['ft','full_time','completed','complete','finished'].includes(String(f.status||'').toLowerCase());
const fmtDate=v=>v?new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
function ourScore(f){const v=String(f.venue||'').toLowerCase();if(v==='away'||v==='a')return Number(f.away_score??0);return Number(f.home_score??0)}
function theirScore(f){const v=String(f.venue||'').toLowerCase();if(v==='away'||v==='a')return Number(f.home_score??0);return Number(f.away_score??0)}
function venueLabel(v){v=String(v||'').toLowerCase();return v==='home'||v==='h'?'HOME':v==='away'||v==='a'?'AWAY':'NEUTRAL'}
function sideInfo(row,team,club){const stop=/\b(u\d+|girls|boys|women|men|mixed|youth|afc|fc|first|team|reserves?|seconds?|thirds?)\b/g,norm=s=>String(s||'').toLowerCase().replace(stop,' ').replace(/[^a-z0-9]+/g,' ').trim(),tt=norm(team.name).split(' ').filter(Boolean),ct=norm(club.name).split(' ').filter(Boolean),score=s=>{const n=' '+norm(s)+' ';let z=0;for(const t of tt)if(n.includes(' '+t+' '))z+=4;for(const t of ct)if(n.includes(' '+t+' '))z+=1;return z},hs=score(row.home),as=score(row.away);return hs>as&&hs>0?{venue:'home',opponent:row.away}:as>hs&&as>0?{venue:'away',opponent:row.home}:{venue:'neutral',opponent:null}}
async function checkFixtureUpdates(ctx){
 const s=ctx.settings||{};if(!s.fixture_sync_on_login||!s.fixture_source_url)return;
 try{
  const resp=await fetch('https://hennzggqaquevqgiucqn.supabase.co/functions/v1/fa-fulltime-preview',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ctx.session.access_token,'apikey':'sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW'},body:JSON.stringify({url:s.fixture_source_url,teamId:ctx.team.id})});
  const data=await resp.json();if(!data.ok)return;
  const {data:existing}=await sb.from('fixtures').select('external_id,opponent,venue,kick_off,status').eq('team_id',ctx.team.id).eq('external_source','fa_full_time');
  const map=new Map((existing||[]).map(x=>[String(x.external_id),x])),seen=new Set();let changes=0;
  for(const r of data.rows||[]){
   const id=String(r.externalId||r.id||'');if(!id)continue;seen.add(id);
   const old=map.get(id);if(!old){changes++;continue}
   const side=(r.ourVenue&&r.opponent)?{venue:r.ourVenue,opponent:r.opponent}:sideInfo(r,ctx.team,ctx.club);
   const d=r.date?new Date(r.date+'T'+(r.time||'12:00')+':00'):null;
   let changed=false;
   if(side.opponent&&(old.opponent!==side.opponent||old.venue!==side.venue))changed=true;
   if(d&&!Number.isNaN(d.getTime())&&Math.abs(new Date(old.kick_off).getTime()-d.getTime())>60000)changed=true;
   const extStatus=/cancel/i.test(r.status||'')?'cancelled':/postpon/i.test(r.status||'')?'postponed':'scheduled';
   if(old.status!==extStatus)changed=true;
   if(changed)changes++;
  }
  for(const old of existing||[])if(old.external_id&&!seen.has(String(old.external_id))&&old.status!=='cancelled')changes++;
  await sb.from('team_settings').update({fixture_last_checked_at:new Date().toISOString()}).eq('team_id',ctx.team.id);
  if(changes){const n=$('fixtureNotice');n.innerHTML='<b>'+changes+' fixture update'+(changes===1?'':'s')+' found.</b> <a href="'+ctx.href('/fixture-sync.html')+'">Review changes</a>';n.classList.remove('hidden')}
 }catch(e){}
}

async function boot(){try{
 const ctx=await FootballPAContext.resolve();const {team,club}=ctx;
 FootballPANav.mount({teamId:team.id});
 if(club.primary_colour)document.documentElement.style.setProperty('--blue',club.primary_colour);
 if(ctx.preview){$('preview').classList.remove('hidden');$('exitPreview').onclick=()=>location.href='/dev-team.html?id='+encodeURIComponent(team.id)}
 let fixtureQuery=sb.from('fixtures').select('id,opponent,venue,competition,status,home_score,away_score,kick_off').eq('team_id',team.id).order('kick_off');if(ctx.season?.id)fixtureQuery=fixtureQuery.eq('season_id',ctx.season.id);
 let playerQuery=sb.from('team_players').select('players(id,display_name,preferred_position,shirt_number)').eq('team_id',team.id).eq('active',true);if(ctx.season?.id)playerQuery=playerQuery.eq('season_id',ctx.season.id);
 const [fr,pr]=await Promise.all([fixtureQuery,playerQuery]);
 if(fr.error)throw fr.error;if(pr.error)throw pr.error;
 const fixtures=fr.data||[],players=(pr.data||[]).map(x=>x.players).filter(Boolean),done=fixtures.filter(final);
 let w=0,d=0,gf=0,ga=0;for(const f of done){const a=ourScore(f),b=theirScore(f);gf+=a;ga+=b;if(a>b)w++;else if(a===b)d++}
 const vals=[[done.length,'P'],[w,'W'],[d,'D'],[gf,'GF'],[ga,'GA'],[(gf-ga>0?'+':'')+(gf-ga),'GD']];
 $('stats').innerHTML=vals.map(v=>'<div class="record-item"><b>'+v[0]+'</b><span>'+v[1]+'</span></div>').join('');
 const now=Date.now(),ordered=[...fixtures].sort((a,b)=>new Date(a.kick_off)-new Date(b.kick_off));
 const upcoming=ordered.filter(f=>!final(f)&&new Date(f.kick_off).getTime()>=now-21600000);
 const next=upcoming[0];
 if(next){
   $('nextMatch').innerHTML='<div class="hero-kicker">Next match</div><div class="hero-date">'+esc(new Date(next.kick_off).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}))+'</div><div class="hero-opponent">'+esc(next.opponent)+'</div><div class="hero-meta"><span class="hero-pill">'+venueLabel(next.venue)+'</span><span class="hero-pill">'+esc(next.competition||'Fixture')+'</span></div><div class="hero-actions"><button class="btn primary" id="openNextMatch">Open Match Centre</button></div>';
   $('openNextMatch').onclick=()=>location.href=ctx.href('/match-centre.html','fixture='+encodeURIComponent(next.id));
 }else{
   $('nextMatch').innerHTML='<div class="hero-kicker">Next match</div><div class="hero-opponent" style="font-size:23px">No upcoming fixture</div><div class="hero-date">Add or sync fixtures to show the next game here.</div>';
 }
 const recent=[...done].sort((a,b)=>new Date(b.kick_off)-new Date(a.kick_off)).slice(0,3);
 $('recent').innerHTML=recent.length?recent.map(f=>'<div class="match-row" data-fixture="'+f.id+'"><div class="match-result">'+ourScore(f)+'–'+theirScore(f)+'<small>FT</small></div><div><strong>'+esc(f.opponent)+'</strong><small>'+esc(f.competition||'Fixture')+' · '+venueLabel(f.venue)+'</small></div><div class="mini-date">'+fmtDate(f.kick_off)+'</div></div>').join(''):'<div class="empty">No completed matches yet.</div>';
 document.querySelectorAll('[data-fixture]').forEach(r=>r.onclick=()=>location.href=ctx.href('/match-centre.html','fixture='+encodeURIComponent(r.dataset.fixture)));
 $('teamSummary').innerHTML='<div><div class="team-big">'+players.length+'</div><div class="team-label">ACTIVE PLAYERS</div></div><div class="team-actions"><a class="btn" href="'+ctx.href('/players.html')+'">Players</a><a class="btn" href="'+ctx.href('/fixtures.html')+'">Fixtures</a></div>';
 $('loading').classList.add('hidden');$('app').classList.remove('hidden');checkFixtureUpdates(ctx);
}catch(e){$('loading').innerHTML='<b>Could not load Football PA.</b><br><span class="fpa-muted">'+esc(e.message)+'</span>'}}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('/login.html')});boot();
</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football PA Voting</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1357A6;--ink:#102033;--muted:#6d7b8a;--line:#d9e3ec;--bg:#eef3f8;--ok:#1f8f54;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#e7eef6,#f8fafc 45%,#edf2f7);color:var(--ink)}button,select,textarea{font:inherit}.wrap{width:min(100% - 28px,760px);margin:auto;padding:16px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;object-fit:contain}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1px}.muted{font-size:12px;color:var(--muted)}.back{border:0;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}.hero,.card,.status{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px #173d6812}.hero{padding:18px;margin-bottom:12px}.hero h1{margin:3px 0 6px;font-size:24px}.status{padding:13px 14px;margin-bottom:12px;font-size:12px}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.card{padding:16px;margin-bottom:12px}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.qhead h2{font-size:18px;margin:0}.pill{font-size:10px;font-weight:900;background:#edf4fb;color:var(--blue);border-radius:999px;padding:5px 8px;white-space:nowrap}.rank{display:grid;grid-template-columns:46px minmax(0,1fr);gap:9px;align-items:center;margin:8px 0}.rank b{text-align:center;font-size:12px;background:#f4f7fa;border-radius:10px;padding:10px 4px}.select{width:100%;border:1px solid #cfd9e3;border-radius:12px;background:#fff;padding:12px}.select option:disabled{color:#a8b0ba}.reason{width:100%;min-height:86px;border:1px solid #cfd9e3;border-radius:12px;padding:11px;margin-top:8px;resize:vertical}.submit{width:100%;border:0;border-radius:13px;padding:14px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.submit:disabled{opacity:.5;cursor:not-allowed}.done{padding:28px 18px;text-align:center}.done .tick{font-size:44px}.hidden{display:none!important}.note{font-size:11px;line-height:1.5;color:var(--muted);margin-top:8px}@media(max-width:600px){.wrap{width:100%;padding:12px 12px 40px}.hero h1{font-size:21px}.card{padding:14px}.qhead{flex-direction:column}.rank{grid-template-columns:40px minmax(0,1fr)}}
</style>
<style id="fp-shell-style">.fpMenuBtn{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:50;width:46px;height:46px;border:1px solid #d9e3ec;border-radius:14px;background:#fff;color:#102033;font-size:25px;font-weight:900;box-shadow:0 4px 14px #10203318}.fpMenuShade{position:fixed;inset:0;background:#0b172666;z-index:60;display:none}.fpMenuShade.open{display:block}.fpMenu{position:fixed;inset:0 auto 0 0;width:min(78vw,290px);background:#fff;z-index:61;transform:translateX(-102%);transition:.2s;box-shadow:18px 0 45px #1020332b;padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.fpMenu.open{transform:none}.fpMenuHead{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #d9e3ec;font-weight:900;font-size:18px}.fpMenuClose{border:0;background:none;font-size:26px}.fpMenuNav{display:grid;gap:2px;padding:8px 0}.fpMenuNav a{padding:11px 8px;border-radius:10px;text-decoration:none;color:#102033;font-weight:900;font-size:16px}.fpMenuNav a:active{background:#eef4fb}.fpTopBack{position:fixed;top:calc(16px + env(safe-area-inset-top));left:14px;z-index:49;color:#1762ae;text-decoration:none;font-weight:900;background:#fff;border:1px solid #d9e3ec;border-radius:12px;padding:9px 11px;box-shadow:0 3px 12px #10203312}</style><style id="fp-shell-uniform">
.fpMenuBtn{position:fixed!important;top:calc(14px + env(safe-area-inset-top))!important;right:14px!important;z-index:50!important;width:48px!important;height:48px!important;border:1px solid #cbd6e2!important;border-radius:15px!important;background:#fff!important;color:#102033!important;box-shadow:0 5px 16px #10203320!important;font-size:0!important;padding:0!important}
.fpMenuBtn:after{content:"☰";font-size:25px;font-weight:900;line-height:46px}
.fpMenuShade{position:fixed!important;inset:0!important;background:#0b172666!important;z-index:60!important;opacity:0!important;pointer-events:none!important;transition:opacity .2s!important}.fpMenuShade.open{opacity:1!important;pointer-events:auto!important}
.fpMenu{position:fixed!important;inset:0 auto 0 0!important;width:min(72vw,270px)!important;background:#fff!important;z-index:61!important;transform:translateX(-102%)!important;transition:transform .22s ease!important;box-shadow:18px 0 45px #1020332b!important;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))!important;display:flex!important;flex-direction:column!important}.fpMenu.open{transform:translateX(0)!important}
.fpMenuHead{display:flex!important;align-items:center!important;justify-content:space-between!important;padding:2px 3px 10px!important;border-bottom:1px solid #d9e3ec!important;font-size:17px!important;font-weight:900!important}.fpMenuClose{border:0!important;background:transparent!important;color:#1762ae!important;font-size:27px!important;padding:7px!important}
.fpMenuNav{display:grid!important;gap:1px!important;padding:6px 0!important}.fpMenuNav a{border-radius:10px!important;padding:9px 10px!important;display:flex!important;align-items:center!important;gap:10px!important;text-decoration:none!important;text-align:left!important;font-size:17px!important;font-weight:900!important;color:#102033!important}.fpMenuNav a:active{background:#eef4fb!important;color:#1357A6!important}
.fpMenuFoot{margin-top:auto!important;border-top:1px solid #d9e3ec!important;padding-top:10px!important}.fpMenuFoot button{width:100%!important;border:0!important;background:transparent!important;border-radius:10px!important;padding:12px!important;text-align:left!important;font-weight:800!important}
</style><style>.fpMenuBtn,.fpMenu,.fpMenuShade{display:none!important}</style><script src="/core-nav.js"></script></head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="https://raw.githubusercontent.com/PerranporthAFCMens/Football-PA/main/football-pa-logo-dark.svg" alt="Football PA"><div><div class="eyebrow">FOOTBALL PA</div><div class="muted">Flexible voting</div></div></div>
    <button class="back" onclick="location.href='/'">← Core</button>
  </div>

  <div id="loading" class="status">Loading your open vote…</div>
  <div id="app" class="hidden">
    <section class="hero"><div class="eyebrow muted">OPEN VOTE</div><h1 id="eventTitle">Match Awards</h1><div id="eventMeta" class="muted"></div></section>
    <div id="form"></div>
    <button id="submitBtn" class="submit">Submit vote</button>
    <div class="note">Core test: voting is tied to your signed-in Football PA account and stored securely in Supabase.</div>
  </div>
  <div id="done" class="card done hidden"><div class="tick">✅</div><h2>Vote submitted</h2><p class="muted">Your ballot has been saved.</p><button class="back" onclick="location.href='/'">Back to Core</button></div>
</div>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id);let eventRow,questions=[],players=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(t,bad=false){$('loading').textContent=t;$('loading').className='status '+(bad?'bad':'')}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html');return}try{
  let r=await sb.from('voting_events').select('id,title,status,opens_at,closes_at,template_id,team_id,fixture_id').eq('status','open').order('created_at',{ascending:false}).limit(1);if(r.error)throw r.error;eventRow=r.data?.[0];if(!eventRow){status('No open voting event is available.');return}
  r=await sb.from('voting_questions').select('id,title,description,question_type,sort_order,required,min_selections,max_selections,point_scheme,reason_mode').eq('template_id',eventRow.template_id).order('sort_order');if(r.error)throw r.error;questions=r.data||[];
  r=await sb.from('team_players').select('player_id,players(id,display_name,shirt_number,preferred_position)').eq('team_id',eventRow.team_id).eq('active',true);if(r.error)throw r.error;players=(r.data||[]).map(x=>x.players).filter(Boolean).sort((a,b)=>(a.shirt_number??999)-(b.shirt_number??999));
  $('eventTitle').textContent=eventRow.title;$('eventMeta').textContent=questions.length+' question'+(questions.length===1?'':'s')+' · '+players.length+' players available';render();$('loading').classList.add('hidden');$('app').classList.remove('hidden');
}catch(e){status(e.message,true)}}
function playerOptions(){return '<option value="">Select player…</option>'+players.map(p=>`<option value="${p.id}">#${esc(p.shirt_number??'–')} ${esc(p.display_name)}</option>`).join('')}
function render(){
  $('form').innerHTML=questions.map(q=>{let body='';if(q.question_type==='ranked'){
    body=Array.from({length:q.max_selections},(_,i)=>`<div class="rank"><b>${i+1}${i===0?'st':i===1?'nd':i===2?'rd':'th'}</b><select class="select vote-select" data-q="${q.id}" data-rank="${i+1}">${playerOptions()}</select></div>`).join('');
  }else{
    body=`<select class="select vote-select" data-q="${q.id}" data-rank="1">${playerOptions()}</select>`;
  }
  if(q.reason_mode!=='none')body+=`<textarea class="reason" data-reason="${q.id}" placeholder="${q.reason_mode==='required'?'Reason required…':'Add a reason…'}"></textarea>`;
  return `<section class="card"><div class="qhead"><div><h2>${esc(q.title)}</h2>${q.description?`<div class="muted">${esc(q.description)}</div>`:''}</div><span class="pill">${esc(q.question_type.toUpperCase())}</span></div>${body}</section>`
  }).join('');
  updateDisabledOptions();
}
function updateDisabledOptions(questionId){
  const questionIds=questionId?[questionId]:questions.map(q=>q.id);
  questionIds.forEach(qid=>{
    const selects=[...document.querySelectorAll(`.vote-select[data-q="${qid}"]`)];
    const chosen=selects.map(s=>s.value).filter(Boolean);
    selects.forEach(select=>{
      [...select.options].forEach(option=>{
        if(!option.value){option.disabled=false;return}
        option.disabled=option.value!==select.value&&chosen.includes(option.value);
      });
    });
  });
}
$('form').addEventListener('change',e=>{
  const select=e.target.closest('.vote-select');
  if(!select)return;
  updateDisabledOptions(select.dataset.q);
});
function collect(){const answers=[];for(const q of questions){const selects=[...document.querySelectorAll(`.vote-select[data-q="${q.id}"]`)];const chosen=selects.map(s=>({player_id:s.value,rank:Number(s.dataset.rank)})).filter(x=>x.player_id);const ids=chosen.map(x=>x.player_id);if(new Set(ids).size!==ids.length)throw new Error('Choose different players for each ranked position.');if(q.required&&chosen.length<q.min_selections)throw new Error('Please complete '+q.title+'.');const reason=document.querySelector(`[data-reason="${q.id}"]`)?.value.trim()||'';if(q.reason_mode==='required'&&!reason)throw new Error('Please add a reason for '+q.title+'.');if(reason)chosen.forEach(x=>x.reason=reason);answers.push({question_id:q.id,selections:chosen})}return answers}
$('submitBtn').onclick=async()=>{let answers;try{answers=collect()}catch(e){status(e.message,true);$('loading').classList.remove('hidden');return}$('submitBtn').disabled=true;$('submitBtn').textContent='Submitting…';const {error}=await sb.rpc('submit_voting_ballot',{p_event_id:eventRow.id,p_answers:answers});if(error){status(error.message,true);$('loading').classList.remove('hidden');$('submitBtn').disabled=false;$('submitBtn').textContent='Submit vote';return}$('app').classList.add('hidden');$('loading').classList.add('hidden');$('done').classList.remove('hidden')};
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('/login.html')});boot();
</script>
<script id="fp-shell-script">(async()=>{const q=new URLSearchParams(location.search),tid=q.get('team')||q.get('id');if(!tid)return;const preview=q.get('dev_preview')==='1'?'&dev_preview=1':'';let features={};try{const r=await sb.from('team_features').select('*').eq('team_id',tid).maybeSingle();features=r.data||{}}catch(e){}const items=[['Home','/index.html?team='+tid+preview,null],['Match Centre','/match-centre.html?team='+tid+preview,'match_centre'],['Players','/players.html?team='+tid+preview,'players'],['Voting','/voting.html?team='+tid+preview,'voting'],['Subs Admin','/subs.html?team='+tid+preview,'subs_finance'],['Settings','/team-settings.html?team='+tid+preview,null]].filter(x=>!x[2]||features[x[2]]!==false);const shade=document.createElement('div');shade.className='fpMenuShade';const menu=document.createElement('aside');menu.className='fpMenu';menu.innerHTML='<div class="fpMenuHead"><span>Football PA</span><button class="fpMenuClose">×</button></div><nav class="fpMenuNav">'+items.map(x=>'<a href="'+x[1]+'">'+x[0]+'</a>').join('')+'</nav><div class="fpMenuFoot"><button id="fpMenuSignOut">↪ Sign out</button></div>';const btn=document.createElement('button');btn.className='fpMenuBtn';btn.setAttribute('aria-label','Open menu');btn.textContent='☰';document.body.append(shade,menu,btn);const close=()=>{shade.classList.remove('open');menu.classList.remove('open')};btn.onclick=()=>{shade.classList.add('open');menu.classList.add('open')};shade.onclick=close;menu.querySelector('.fpMenuClose').onclick=close;const so=menu.querySelector('#fpMenuSignOut');if(so)so.onclick=async()=>{await sb.auth.signOut();location.href='/login.html'};document.querySelectorAll('a.back,.back,[id="back"]').forEach(x=>x.classList.add('fpTopBack'))})();</script><script>window.addEventListener('DOMContentLoaded',()=>FootballPANav.mount());</script></body></html>

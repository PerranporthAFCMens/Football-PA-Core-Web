<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3f8">
<title>Voting Centre · Football PA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./core-client.js"></script>
<script src="./core-context.js"></script>
<script src="./core-nav.js"></script>
<link rel="stylesheet" href="./core-ui.css">
<style>
.voting-page{display:grid;gap:12px}
.voting-card{padding:18px}
.voting-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.voting-head h1{margin:0!important;font-size:30px!important}
.voting-head .fpa-muted{margin-top:5px;font-size:12px}
.seasonLink{display:inline-flex;align-items:center;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--blue);font-size:12px;font-weight:900;text-decoration:none;white-space:nowrap}
.section-title{margin:0 0 11px;font-size:20px;font-weight:900}
.match-select{width:100%;min-height:48px;padding:10px 12px}
.vote-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:11px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);border-radius:11px;min-height:44px;padding:10px 13px;background:#fff;color:var(--ink);font-weight:850;cursor:pointer}
.btn.full{width:100%}.btn.secondary{background:#edf2f7}.btn.green{background:#218b22;color:#fff;border-color:#218b22}.btn.red{background:#c62828;color:#fff;border-color:#c62828}.btn:disabled{opacity:.5}
.vote-link{width:100%;padding:11px 12px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;margin:2px;font-size:11px;font-weight:850;background:#edf2f6;color:#425466}
.pill.open{background:#e5f6ea;color:#17682a;border:1px solid #c6e8d0}.pill.closed{background:#fdeaea;color:#9e2020;border:1px solid #f2c7c7}
.result-block{margin-top:14px}.result-block h3{font-size:16px;margin:18px 0 8px}
.result-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f4}
.result-row:last-child{border-bottom:0}.result-row .score{font-weight:900;text-align:right}.result-row .breakdown{font-size:12px;color:var(--muted);font-weight:600}
.dotd{border:1px solid #e1e8ee;border-radius:13px;padding:12px;margin:8px 0;background:#fbfcfd}.dotd b{font-size:14px}.reason{font-size:12px;color:var(--muted);padding-top:5px;line-height:1.4}
.voter-list{display:flex;flex-wrap:wrap;gap:4px}
.hidden{display:none!important}.bad{color:#b42318}
@media(max-width:650px){
  .voting-card{padding:14px}.voting-head h1{font-size:27px!important}.grid2{grid-template-columns:1fr}.result-row{align-items:flex-start}.result-row .score{max-width:145px}.seasonLink{width:100%;justify-content:center}
}
</style>
</head>
<body>
<main class="fpa-page">
  <div id="loading" class="fpa-card voting-card">Loading Voting Centre…</div>
  <div id="app" class="voting-page hidden">
    <section class="fpa-card voting-card">
      <div class="voting-head">
        <div>
          <h1>Voting Centre</h1>
          <div id="teamLabel" class="fpa-muted"></div>
        </div>
        <a id="seasonLink" class="seasonLink hidden" href="#">Season Voting Table ›</a>
      </div>
    </section>

    <section class="fpa-card voting-card">
      <h2 class="section-title">Voting match</h2>
      <select id="match" class="match-select"></select>
      <div id="status" class="vote-status"></div>
      <div class="grid2">
        <button id="openBtn" class="btn green">Open voting</button>
        <button id="closeBtn" class="btn red">Close voting</button>
      </div>
    </section>

    <section class="fpa-card voting-card">
      <h2 class="section-title">Player voting link</h2>
      <input id="link" class="vote-link" readonly>
      <button id="copyBtn" class="btn secondary full" style="margin-top:8px">Copy voting link</button>
    </section>

    <section class="fpa-card voting-card">
      <h2 class="section-title" style="margin-bottom:3px">Voting information</h2>
      <div id="ballots" class="fpa-muted">Loading…</div>
      <div id="results" class="result-block"></div>
    </section>
  </div>
</main>
<script>
const sb=FootballPAClient;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ctx=null,C={events:[]},fixtures=[],selected='',busy=false;

const complete=f=>['ft','full_time','completed','complete','finished'].includes(String(f?.status||'').toLowerCase());
const fmt=v=>v?new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
function venueLabel(v){const s=String(v||'').toLowerCase();return s==='home'?'Home':s==='away'?'Away':s==='neutral'?'Neutral':v||''}
function openFixtureId(){const e=(C.events||[]).find(x=>x.event_id===C.open_event_id);return e?.fixture_id||''}
function defaultMatch(){
  const open=openFixtureId();if(open&&fixtures.some(f=>f.id===open))return open;
  const done=fixtures.filter(complete).sort((a,b)=>new Date(b.kick_off)-new Date(a.kick_off));
  return done[0]?.id||fixtures[0]?.id||'';
}
function matchLabel(f){return fmt(f.kick_off)+' — '+f.opponent+' ('+venueLabel(f.venue)+')'+(complete(f)?' — FT':String(f.status||'').toLowerCase()==='live'?' — LIVE':'')}
function renderStatus(){
  const openId=openFixtureId(),same=openId&&openId===selected;
  if(openId){
    const f=fixtures.find(x=>x.id===openId),name=f?.opponent||'current match';
    $('status').innerHTML=same?'<span class="pill open">Voting OPEN</span> <span class="fpa-muted">This is the current voting match.</span>':'<span class="pill open">Voting OPEN</span> <span class="fpa-muted">Currently open for '+esc(name)+'. The dropdown is showing a different match.</span>';
  }else $('status').innerHTML='<span class="pill closed">Voting CLOSED</span>';
  $('closeBtn').disabled=!openId;
}
async function loadCentre(){
  let r=await sb.rpc('get_voting_centre',{p_team_id:ctx.team.id,p_season_id:ctx.season.id});if(r.error)throw r.error;C=r.data||{events:[]};
  r=await sb.from('fixtures').select('id,opponent,kick_off,status,venue,competition').eq('team_id',ctx.team.id).eq('season_id',ctx.season.id).neq('status','cancelled').order('kick_off',{ascending:true});if(r.error)throw r.error;fixtures=r.data||[];
  if(!selected||!fixtures.some(f=>f.id===selected))selected=defaultMatch();
  $('match').innerHTML=fixtures.map(f=>'<option value="'+f.id+'">'+esc(matchLabel(f))+'</option>').join('');
  if(selected)$('match').value=selected;
  if(C.can_view_private_report){$('seasonLink').href=ctx.href('/voting-season.html');$('seasonLink').classList.remove('hidden')}else $('seasonLink').classList.add('hidden');
  renderStatus();
}
async function results(){
  if(!selected){$('ballots').textContent='No match selected';$('results').innerHTML='';return}
  $('ballots').textContent='Loading…';
  const r=await sb.rpc('get_voting_match_snapshot',{p_team_id:ctx.team.id,p_season_id:ctx.season.id,p_fixture_id:selected});
  if(r.error){$('ballots').textContent='Could not load voting information';$('results').innerHTML='<div class="fpa-muted">'+esc(r.error.message)+'</div>';return}
  const s=r.data||{},medals={1:'🥇',2:'🥈',3:'🥉'};
  const f=fixtures.find(x=>x.id===selected);
  $('ballots').textContent=(s.ballots||0)+' ballot'+((s.ballots||0)===1?'':'s')+' · '+(s.event_title||((f?.opponent||'')+' ('+((venueLabel(f?.venue)||'').charAt(0)||'')+')'));
  $('results').innerHTML=
    '<h3>Top 3</h3>'+
    (s.top3?.length?s.top3.map(x=>'<div class="result-row"><span>'+medals[x.rank]+' '+(x.joint?'Joint ':'')+x.rank+' — <b>'+esc(x.player)+'</b></span><span class="score">'+esc(x.score)+' <span class="breakdown">('+esc(x.three)+'×3, '+esc(x.two)+'×2, '+esc(x.one)+'×1)</span></span></div>').join(''):'<div class="fpa-muted">No votes yet.</div>')+
    '<h3>Dick of the Day</h3>'+
    (s.dotd?.length?s.dotd.map(x=>'<div class="dotd"><b>'+esc(x.player)+' — '+esc(x.votes)+'</b>'+(x.reasons||[]).map(reason=>'<div class="reason">'+esc(reason)+'</div>').join('')+'</div>').join(''):'<div class="fpa-muted">No votes yet.</div>')+
    '<h3>Who\'s voted</h3><div class="voter-list">'+(s.voters?.length?s.voters.map(x=>'<span class="pill">'+esc(x)+'</span>').join(''):'<span class="fpa-muted">None yet</span>')+'</div>'+
    '<h3>Still to vote</h3><div class="voter-list">'+(s.still_to_vote?.length?s.still_to_vote.map(x=>'<span class="pill">'+esc(x)+'</span>').join(''):'<span class="fpa-muted">Everyone has voted</span>')+'</div>';
}
async function setOpen(open){
  if(!selected||busy)return;busy=true;
  const btn=open?$('openBtn'):$('closeBtn'),old=btn.textContent;btn.disabled=true;btn.textContent=open?'Opening…':'Closing…';
  const r=await sb.rpc('set_voting_open_event',{p_team_id:ctx.team.id,p_season_id:ctx.season.id,p_fixture_id:selected,p_open:open});
  busy=false;btn.textContent=old;if(r.error){btn.disabled=false;alert(r.error.message);return}
  await loadCentre();await results();
}
async function boot(){
  try{
    ctx=await FootballPAContext.resolve();
    FootballPANav.mount({teamId:ctx.team.id});
    $('teamLabel').textContent=(ctx.club.name||'Football PA')+' · '+(ctx.team.name||'')+' · '+(ctx.season?.label||ctx.team.season_label||'');
    $('link').value=location.origin+ctx.href('/player-portal.html','pin=1&tab=vote');
    await loadCentre();await results();
    $('loading').classList.add('hidden');$('app').classList.remove('hidden');
  }catch(e){$('loading').textContent=e.message;$('loading').classList.add('bad')}
}
$('match').onchange=async()=>{selected=$('match').value;renderStatus();await results()};
$('openBtn').onclick=()=>setOpen(true);$('closeBtn').onclick=()=>setOpen(false);
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('link').value);alert('Voting link copied')}catch(e){$('link').select();document.execCommand('copy');alert('Voting link copied')}};
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('./login.html')});
boot();
</script>
</body>
</html>

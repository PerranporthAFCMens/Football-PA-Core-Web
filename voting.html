<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d5cab">
<title>Football PA Voting Centre</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0d5cab;--dark:#17212b;--muted:#6f7e8b;--line:#dce5ec;--bg:#f2f5f7;--green:#218b22;--red:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--dark)}.wrap{max-width:760px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:11px;box-shadow:0 4px 14px #173a5010}
.hero{display:flex;align-items:center;gap:11px}.badge{width:56px;height:56px;border-radius:50%;object-fit:contain}.actions{margin-left:auto;display:flex;gap:7px}
.iconBtn{border:1px solid var(--line);background:#e8eef3;color:var(--dark);border-radius:11px;padding:10px 12px;text-decoration:none;font-weight:800;cursor:pointer}.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}h1{font-size:22px;margin:0 0 3px}h2{font-size:18px;margin:0 0 11px}h3{font-size:15px;margin:16px 0 7px}
input,select{width:100%;min-height:46px;border:1px solid #ccd8e2;border-radius:10px;background:#fff;padding:10px;font-size:15px}
.btn{border:0;border-radius:10px;min-height:46px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.btn.full{width:100%}.btn.secondary{background:#e6edf3;color:var(--dark)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #edf1f4}.row:last-child{border:0}
.pill{display:inline-block;background:#edf2f6;border-radius:999px;padding:5px 8px;margin:2px;font-size:12px}.pill.open{background:#e6f6e9;color:#17682a}.pill.closed{background:#fdeaea;color:#9e2020}
.dotd{border:1px solid #eceff2;border-radius:10px;padding:10px;margin:7px 0}.reason{font-size:13px;color:var(--muted);padding-top:5px}.topline{display:flex;align-items:center;gap:10px}.topline .seasonLink{margin-left:auto;text-decoration:none;font-size:12px;font-weight:800;color:var(--blue)}
.statusCard{max-width:760px;margin:12px auto;padding:13px 16px}.bad{color:#b42318}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.actions{gap:4px}.iconBtn{padding:9px}.topline{align-items:flex-start}.topline .seasonLink{white-space:nowrap}}
</style>
<script src="/core-context.js"></script>
</head>
<body>
<div class="wrap">
  <div id="loading" class="card">Loading Voting Centre…</div>
  <div id="app" class="hidden">
    <div class="card hero">
      <img id="badge" class="badge" alt="Club badge">
      <div><h1>Voting Centre</h1><div id="teamLabel" class="muted"></div></div>
      <div class="actions"><a id="homeBtn" class="iconBtn" href="#">Home</a><button class="iconBtn" onclick="location.reload()">↻</button></div>
    </div>

    <div class="card">
      <h2>Voting match</h2>
      <select id="match"></select>
      <div id="status" style="margin:11px 0"></div>
      <div class="grid2">
        <button id="openBtn" class="btn green">Open voting</button>
        <button id="closeBtn" class="btn red">Close voting</button>
      </div>
    </div>

    <div class="card">
      <h2>Player voting link</h2>
      <input id="link" readonly>
      <button id="copyBtn" class="btn secondary full" style="margin-top:8px">Copy voting link</button>
    </div>

    <div class="card">
      <div class="topline">
        <div><h2 style="margin-bottom:3px">Voting information</h2><div id="ballots" class="muted">Loading…</div></div>
        <a id="seasonLink" class="seasonLink hidden" href="#">Season Voting Table ›</a>
      </div>
      <div id="results"></div>
    </div>
  </div>
</div>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ctx=null,C={events:[]},fixtures=[],selected='',busy=false;

const complete=f=>['ft','full_time','completed','complete','finished'].includes(String(f?.status||'').toLowerCase());
const fmt=v=>v?new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
function venueLabel(v){const s=String(v||'').toLowerCase();return s==='home'?'Home':s==='away'?'Away':s==='neutral'?'Neutral':v||''}
function openFixtureId(){const e=(C.events||[]).find(x=>x.event_id===C.open_event_id);return e?.fixture_id||''}
function defaultMatch(){
  const open=openFixtureId();if(open&&fixtures.some(f=>f.id===open))return open;
  const done=fixtures.filter(complete).sort((a,b)=>new Date(b.kick_off)-new Date(a.kick_off));
  return done[0]?.id||fixtures[0]?.id||'';
}
function matchLabel(f){return fmt(f.kick_off)+' — '+f.opponent+' ('+venueLabel(f.venue)+')'+(complete(f)?' — FT':String(f.status||'').toLowerCase()==='live'?' — LIVE':'')}
function renderStatus(){
  const openId=openFixtureId(),same=openId&&openId===selected;
  if(openId){
    const f=fixtures.find(x=>x.id===openId),name=f?.opponent||'current match';
    $('status').innerHTML=same?'<span class="pill open">Voting OPEN</span> <span class="muted">This is the current voting match.</span>':'<span class="pill open">Voting OPEN</span> <span class="muted">Currently open for '+esc(name)+'. The dropdown is showing a different match.</span>';
  }else $('status').innerHTML='<span class="pill closed">Voting CLOSED</span>';
  $('closeBtn').disabled=!openId;
}
async function loadCentre(){
  let r=await sb.rpc('get_voting_centre',{p_team_id:ctx.team.id,p_season_id:ctx.season.id});if(r.error)throw r.error;C=r.data||{events:[]};
  r=await sb.from('fixtures').select('id,opponent,kick_off,status,venue,competition').eq('team_id',ctx.team.id).eq('season_id',ctx.season.id).neq('status','cancelled').order('kick_off',{ascending:false});if(r.error)throw r.error;fixtures=r.data||[];
  if(!selected||!fixtures.some(f=>f.id===selected))selected=defaultMatch();
  $('match').innerHTML=fixtures.map(f=>'<option value="'+f.id+'">'+esc(matchLabel(f))+'</option>').join('');
  if(selected)$('match').value=selected;
  if(C.can_view_private_report){$('seasonLink').href=ctx.href('/voting-season.html');$('seasonLink').classList.remove('hidden')}else $('seasonLink').classList.add('hidden');
  renderStatus();
}
async function results(){
  if(!selected){$('ballots').textContent='No match selected';$('results').innerHTML='';return}
  $('ballots').textContent='Loading…';
  const r=await sb.rpc('get_voting_match_snapshot',{p_team_id:ctx.team.id,p_season_id:ctx.season.id,p_fixture_id:selected});
  if(r.error){$('ballots').textContent='Could not load voting information';$('results').innerHTML='<div class="muted">'+esc(r.error.message)+'</div>';return}
  const s=r.data||{},medals={1:'🥇',2:'🥈',3:'🥉'};
  const f=fixtures.find(x=>x.id===selected);
  $('ballots').textContent=(s.ballots||0)+' ballot'+((s.ballots||0)===1?'':'s')+' · '+(s.event_title||((f?.opponent||'')+' ('+((venueLabel(f?.venue)||'').charAt(0)||'')+')'));
  $('results').innerHTML='<h3>Top 3</h3>'+
    (s.top3?.length?s.top3.map(x=>'<div class="row"><span>'+medals[x.rank]+' '+(x.joint?'Joint ':'')+x.rank+' — '+esc(x.player)+'</span><span><b>'+esc(x.score)+'</b> <span class="muted">('+esc(x.three)+'×3, '+esc(x.two)+'×2, '+esc(x.one)+'×1)</span></span></div>').join(''):'<div class="muted">No votes yet.</div>')+
    '<h3>Dick of the Day</h3>'+
    (s.dotd?.length?s.dotd.map(x=>'<div class="dotd"><b>'+esc(x.player)+' — '+esc(x.votes)+'</b>'+(x.reasons||[]).map(reason=>'<div class="reason">'+esc(reason)+'</div>').join('')+'</div>').join(''):'<div class="muted">No votes yet.</div>')+
    '<h3>Who\'s voted</h3><div>'+(s.voters?.length?s.voters.map(x=>'<span class="pill">'+esc(x)+'</span>').join(''):'<span class="muted">None yet</span>')+'</div>'+
    '<h3>Still to vote</h3><div>'+(s.still_to_vote?.length?s.still_to_vote.map(x=>'<span class="pill">'+esc(x)+'</span>').join(''):'<span class="muted">Everyone has voted</span>')+'</div>';
}
async function setOpen(open){
  if(!selected||busy)return;busy=true;
  const btn=open?$('openBtn'):$('closeBtn'),old=btn.textContent;btn.disabled=true;btn.textContent=open?'Opening…':'Closing…';
  const r=await sb.rpc('set_voting_open_event',{p_team_id:ctx.team.id,p_season_id:ctx.season.id,p_fixture_id:selected,p_open:open});
  busy=false;btn.textContent=old;if(r.error){btn.disabled=false;alert(r.error.message);return}
  await loadCentre();await results();
}
async function boot(){
  try{
    ctx=await FootballPAContext.resolve();
    const badge=ctx.team.badge_url||ctx.club.badge_url||'';
    if(badge)$('badge').src=badge;else $('badge').style.visibility='hidden';
    $('teamLabel').textContent=(ctx.club.name||'Football PA')+' · '+(ctx.season?.label||ctx.team.season_label||'');
    $('homeBtn').href=ctx.href('/');
    $('link').value=location.origin+ctx.href('/player-portal.html','pin=1&tab=vote');
    await loadCentre();await results();
    $('loading').classList.add('hidden');$('app').classList.remove('hidden');
  }catch(e){$('loading').textContent=e.message;$('loading').classList.add('bad')}
}
$('match').onchange=async()=>{selected=$('match').value;renderStatus();await results()};
$('openBtn').onclick=()=>setOpen(true);$('closeBtn').onclick=()=>setOpen(false);
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('link').value);alert('Voting link copied')}catch(e){$('link').select();document.execCommand('copy');alert('Voting link copied')}};
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('/login.html')});
boot();
</script>
</body>
</html>

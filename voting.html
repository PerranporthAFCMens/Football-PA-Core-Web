<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football PA Voting Centre</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1357A6;--ink:#102033;--muted:#6d7b8a;--line:#d9e3ec;--bg:#eef3f8;--ok:#1f8f54;--bad:#b42318;--purple:#7142cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button,select,textarea{font:inherit}.wrap{width:min(100% - 24px,820px);margin:auto;padding:14px 0 60px}.hidden{display:none!important}
.card,.status{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px #173d6810}.card{padding:16px;margin-bottom:12px}.status{padding:13px 14px;margin-bottom:12px;font-size:12px}.status.bad{color:var(--bad)}
.hero{padding:18px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.hero h1{margin:4px 0 5px;font-size:26px}.muted{font-size:12px;color:var(--muted);line-height:1.45}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.summaryBox{padding:13px 8px;text-align:center;border:1px solid var(--line);border-radius:14px;background:#f6f9fb}.summaryBox b{display:block;font-size:24px}.summaryBox span{font-size:9px;color:var(--muted);font-weight:850;text-transform:uppercase}
.privateLink{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink);padding:13px;border:1px solid #d9cbf5;border-radius:14px;background:linear-gradient(145deg,#fff,#f7f2ff);margin-top:12px}.privateLink b{display:block}.privateLink span{font-size:12px;color:var(--muted);display:block;margin-top:3px}.privateArrow{font-size:24px;color:var(--purple)}
.sectionTitle{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:9px}.sectionTitle h2{font-size:19px;margin:0}.sectionTitle span{font-size:11px;color:var(--muted)}
.event{border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden;background:#fff}.eventHead{padding:14px}.eventTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.event h3{font-size:18px;margin:0 0 4px}.ballots{font-size:11px;font-weight:850;padding:5px 8px;border-radius:999px;background:#eef4fb;color:var(--blue);white-space:nowrap}
.winners{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.winner{padding:11px;border-radius:13px;border:1px solid var(--line);background:#f8fafc}.winner small{display:block;font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.winner b{display:block;font-size:15px;margin-top:4px}.winner span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.viewBtn{width:100%;border:0;border-top:1px solid var(--line);background:#f8fafc;padding:11px 13px;font-weight:850;color:var(--blue);cursor:pointer;text-align:left}.details{padding:0 13px 13px}.resultTitle{font-size:12px;font-weight:900;margin:13px 0 5px}.resultRow{display:grid;grid-template-columns:minmax(0,1fr) 52px 36px 36px 36px;gap:5px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1f4}.resultRow.dotd{grid-template-columns:minmax(0,1fr) 65px}.resultRow:last-child{border-bottom:0}.resultRow b{font-size:13px}.resultRow span{text-align:center;font-size:11px}.resultHead{font-size:9px!important;color:var(--muted);font-weight:850;text-transform:uppercase}
.openVote{border-color:#b9d8c2;background:linear-gradient(145deg,#fff,#f1fbf4)}.voteForm{margin-top:12px}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin:12px 0 7px}.qhead h3{font-size:15px;margin:0}.pill{font-size:9px;font-weight:900;background:#edf4fb;color:var(--blue);border-radius:999px;padding:5px 8px}.rank{display:grid;grid-template-columns:42px minmax(0,1fr);gap:7px;align-items:center;margin:7px 0}.rank b{text-align:center;background:#f1f5f8;border-radius:9px;padding:10px 3px;font-size:11px}.select,.reason{width:100%;border:1px solid #ccd8e1;border-radius:11px;background:#fff;padding:11px}.reason{min-height:75px;resize:vertical;margin-top:7px}.submit{width:100%;border:0;border-radius:12px;padding:13px;background:var(--blue);color:#fff;font-weight:900;margin-top:10px}.submit:disabled{opacity:.55}
.success{padding:12px;border:1px solid #b9dfc3;border-radius:12px;background:#ebf8ef;color:#176338}.empty{padding:13px;border:1px solid var(--line);border-radius:12px;background:#f7f9fb;color:var(--muted);font-size:12px}
@media(max-width:560px){.wrap{width:100%;padding:9px 7px 36px}.card{padding:13px;border-radius:15px}.summary{gap:5px}.summaryBox{padding:11px 5px}.summaryBox b{font-size:21px}.winners{grid-template-columns:1fr 1fr}.resultRow{grid-template-columns:minmax(0,1fr) 45px 30px 30px 30px}.hero h1{font-size:22px}}
</style>
<script src="/core-context.js"></script>
<script src="/core-nav.js"></script>
<link rel="stylesheet" href="/core-ui.css">
</head>
<body>
<div class="wrap fpa-page">
  <div id="loading" class="status">Loading Voting Centre…</div>
  <div id="app" class="hidden">
    <section class="card hero">
      <div class="eyebrow">Voting Centre</div>
      <h1>Match voting</h1>
      <div class="muted">Review previous results and manage the current season.</div>
      <div id="summary" class="summary"></div>
      <a id="seasonReportLink" class="privateLink hidden" href="#">
        <div><b>Season Voting Table</b><span>Private season totals, MOTM and DOD awards</span></div>
        <div class="privateArrow">›</div>
      </a>
    </section>

    <section id="openVoteCard" class="card openVote hidden">
      <div class="sectionTitle"><h2>Voting is open</h2><span id="openVoteMeta"></span></div>
      <div id="openVoteForm" class="voteForm"></div>
      <button id="submitBtn" class="submit">Submit my vote</button>
      <div id="voteStatus" class="muted" style="margin-top:8px"></div>
    </section>

    <section class="card">
      <div class="sectionTitle"><h2>Previous matches</h2><span>Newest first</span></div>
      <div id="history"></div>
    </section>
  </div>
</div>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(v).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'';
let ctx,C={events:[]},openEvent=null,questions=[],players=[];

function status(t,bad){$('loading').textContent=t;$('loading').className='status'+(bad?' bad':'')}
function dotdName(e){const a=e.dotd_winners||[];return a.length?a.map(x=>x.name).join(' / '):'—'}
function historyHtml(){
  const events=C.events||[];
  if(!events.length)return '<div class="empty">No previous voting results yet.</div>';
  return events.map(function(e,i){
    const m=e.motm_winner||{};
    const points=e.player_points||[],dotd=e.dotd_results||[];
    const pointRows=points.length?points.map(function(p){
      return '<div class="resultRow"><b>'+esc(p.name)+'</b><span><strong>'+esc(p.points)+'</strong></span><span>'+esc(p.first_votes)+'</span><span>'+esc(p.second_votes)+'</span><span>'+esc(p.third_votes)+'</span></div>';
    }).join(''):'<div class="empty">No Player of the Match votes recorded.</div>';
    const dotdRows=dotd.length?dotd.map(function(p){
      return '<div class="resultRow dotd"><b>'+esc(p.name)+'</b><span><strong>'+esc(p.votes)+'</strong></span></div>';
    }).join(''):'<div class="empty">No Dick of the Day votes recorded.</div>';
    return '<article class="event">'+
      '<div class="eventHead"><div class="eventTop"><div><h3>'+esc(e.opponent||e.title)+'</h3><div class="muted">'+esc(fmt(e.kick_off))+' · '+esc(e.competition||'Fixture')+' · '+esc(String(e.venue||'').toUpperCase())+'</div></div><span class="ballots">'+esc(e.ballots)+' ballots</span></div>'+
      '<div class="winners"><div class="winner"><small>Man of the Match</small><b>'+esc(m.name||'—')+'</b><span>'+(m.name?esc(m.points)+' pts':'No result')+'</span></div><div class="winner"><small>Dick of the Day</small><b>'+esc(dotdName(e))+'</b><span>'+(e.dotd_winners&&e.dotd_winners[0]?esc(e.dotd_winners[0].votes)+' votes':'No result')+'</span></div></div></div>'+
      '<button class="viewBtn" data-toggle="'+i+'">View full result</button>'+
      '<div class="details hidden" data-details="'+i+'">'+
        '<div class="resultTitle">Player of the Match</div>'+
        '<div class="resultRow"><span class="resultHead" style="text-align:left">Player</span><span class="resultHead">Pts</span><span class="resultHead">3</span><span class="resultHead">2</span><span class="resultHead">1</span></div>'+
        pointRows+
        '<div class="resultTitle">Dick of the Day</div>'+
        '<div class="resultRow dotd"><span class="resultHead" style="text-align:left">Player</span><span class="resultHead">Votes</span></div>'+
        dotdRows+
      '</div></article>';
  }).join('');
}
async function loadOpenVote(){
  if(!C.open_event_id)return;
  const er=await sb.from('voting_events').select('id,title,template_id').eq('id',C.open_event_id).single();
  if(er.error)throw er.error;openEvent=er.data;
  let r=await sb.from('voting_questions').select('id,title,description,question_type,sort_order,required,min_selections,max_selections,point_scheme,reason_mode').eq('template_id',openEvent.template_id).order('sort_order');
  if(r.error)throw r.error;questions=r.data||[];
  r=await sb.from('team_players').select('player_id,players(id,display_name,shirt_number)').eq('team_id',ctx.team.id).eq('season_id',ctx.season.id).eq('active',true);
  if(r.error)throw r.error;players=(r.data||[]).map(x=>x.players).filter(Boolean).sort((a,b)=>(a.shirt_number??999)-(b.shirt_number??999));
  $('openVoteMeta').textContent=openEvent.title;
  $('openVoteForm').innerHTML=questions.map(function(q){
    let body='';
    if(q.question_type==='ranked'){
      body=Array.from({length:q.max_selections},function(_,i){return '<div class="rank"><b>'+(i+1)+'</b><select class="select vote-select" data-q="'+q.id+'" data-rank="'+(i+1)+'">'+playerOptions()+'</select></div>';}).join('');
    }else{
      body='<select class="select vote-select" data-q="'+q.id+'" data-rank="1">'+playerOptions()+'</select>';
    }
    if(q.reason_mode!=='none')body+='<textarea class="reason" data-reason="'+q.id+'" placeholder="'+(q.reason_mode==='required'?'Reason required…':'Add a reason…')+'"></textarea>';
    return '<div class="qhead"><div><h3>'+esc(q.title)+'</h3>'+(q.description?'<div class="muted">'+esc(q.description)+'</div>':'')+'</div><span class="pill">'+esc(q.question_type.toUpperCase())+'</span></div>'+body;
  }).join('');
  $('openVoteCard').classList.remove('hidden');updateDisabledOptions();
}
function playerOptions(){return '<option value="">Select player…</option>'+players.map(p=>'<option value="'+p.id+'">#'+esc(p.shirt_number??'–')+' '+esc(p.display_name)+'</option>').join('')}
function updateDisabledOptions(qid){
  const ids=qid?[qid]:questions.map(q=>q.id);
  ids.forEach(function(id){const selects=[...document.querySelectorAll('.vote-select[data-q="'+id+'"]')],chosen=selects.map(s=>s.value).filter(Boolean);selects.forEach(function(s){[...s.options].forEach(function(o){o.disabled=!!o.value&&o.value!==s.value&&chosen.includes(o.value)})})});
}
function collect(){
  const answers=[];
  for(const q of questions){
    const selects=[...document.querySelectorAll('.vote-select[data-q="'+q.id+'"]')];
    const chosen=selects.map(s=>({player_id:s.value,rank:Number(s.dataset.rank)})).filter(x=>x.player_id);
    const ids=chosen.map(x=>x.player_id);
    if(new Set(ids).size!==ids.length)throw new Error('Choose different players for each ranked position.');
    if(q.required&&chosen.length<q.min_selections)throw new Error('Please complete '+q.title+'.');
    const reason=document.querySelector('[data-reason="'+q.id+'"]')?.value.trim()||'';
    if(q.reason_mode==='required'&&!reason)throw new Error('Please add a reason for '+q.title+'.');
    if(reason)chosen.forEach(x=>x.reason=reason);
    answers.push({question_id:q.id,selections:chosen});
  }
  return answers;
}
async function boot(){
  try{
    ctx=await FootballPAContext.resolve();FootballPANav.mount({teamId:ctx.team.id});
    const r=await sb.rpc('get_voting_centre',{p_team_id:ctx.team.id,p_season_id:ctx.season.id});
    if(r.error)throw r.error;C=r.data||{events:[]};
    $('summary').innerHTML='<div class="summaryBox"><b>'+esc(C.total_events||0)+'</b><span>Matches</span></div><div class="summaryBox"><b>'+esc(C.total_ballots||0)+'</b><span>Ballots</span></div><div class="summaryBox"><b>'+((C.open_event_id)?'1':'0')+'</b><span>Open vote</span></div>';
    $('history').innerHTML=historyHtml();
    if(C.can_view_private_report){$('seasonReportLink').href=ctx.href('/voting-season.html');$('seasonReportLink').classList.remove('hidden')}
    await loadOpenVote();
    $('loading').classList.add('hidden');$('app').classList.remove('hidden');
  }catch(e){status(e.message,true)}
}
document.addEventListener('click',function(e){
  const b=e.target.closest('[data-toggle]');if(!b)return;const d=document.querySelector('[data-details="'+b.dataset.toggle+'"]');if(!d)return;const opening=d.classList.contains('hidden');d.classList.toggle('hidden');b.textContent=opening?'Hide full result':'View full result';
});
$('openVoteForm').addEventListener('change',function(e){const s=e.target.closest('.vote-select');if(s)updateDisabledOptions(s.dataset.q)});
$('submitBtn').onclick=async function(){
  let answers;try{answers=collect()}catch(e){$('voteStatus').textContent=e.message;return}
  const b=$('submitBtn');b.disabled=true;b.textContent='Submitting…';
  const r=await sb.rpc('submit_voting_ballot',{p_event_id:openEvent.id,p_answers:answers});
  if(r.error){$('voteStatus').textContent=r.error.message;b.disabled=false;b.textContent='Submit my vote';return}
  $('openVoteForm').innerHTML='<div class="success"><b>Vote submitted</b><div class="muted" style="margin-top:4px">Your ballot has been saved.</div></div>';$('submitBtn').classList.add('hidden');
};
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('/login.html')});
boot();
</script>
</body>
</html>

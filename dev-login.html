<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1726"><title>Football PA Dev Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;background:#0b1726;color:#102033}.wrap{width:min(92vw,430px)}.brand{text-align:center;color:#fff;margin-bottom:20px}.brand img{width:74px;height:74px}.brand h1{margin:10px 0 4px;font-size:27px}.brand p{margin:0;color:#aebdce}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 22px 55px #0005}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #ccd6e0;border-radius:12px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:#1357A6;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.btn:disabled{opacity:.55}.msg{min-height:22px;margin-top:12px;font-size:13px}.bad{color:#b42318}.muted{font-size:11px;color:#6d7b8a;text-align:center;margin-top:15px;line-height:1.45}</style></head>
<body><main class="wrap"><div class="brand"><img src="https://raw.githubusercontent.com/PerranporthAFCMens/Football-PA/main/football-pa-logo-dark.svg" alt="Football PA"><h1>Football PA Dev</h1><p>Platform administration</p></div><section class="card"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="login" class="btn">Secure Dev Login</button><div id="msg" class="msg"></div><div class="muted">Platform administrator access only. Club and team permissions do not grant access to this portal.</div></section></main>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');const $=id=>document.getElementById(id);
async function isPlatformAdmin(uid){const {data,error}=await sb.from('platform_admins').select('user_id').eq('user_id',uid).eq('active',true).maybeSingle();return !error&&!!data}
async function existing(){const {data:{session}}=await sb.auth.getSession();if(session&&await isPlatformAdmin(session.user.id))location.replace('./dev.html')}
$('login').onclick=async()=>{const b=$('login'),m=$('msg');m.textContent='';m.className='msg';b.disabled=true;b.textContent='Checking…';const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){m.textContent='Login failed. Check your email and password.';m.className='msg bad';b.disabled=false;b.textContent='Secure Dev Login';return}if(!await isPlatformAdmin(data.user.id)){await sb.auth.signOut();m.textContent='This account does not have Football PA Dev access.';m.className='msg bad';b.disabled=false;b.textContent='Secure Dev Login';return}location.replace('./dev.html')};existing();
</script></body></html>

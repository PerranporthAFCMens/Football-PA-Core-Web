<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f8">
<title>Match hub · Football PA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./core-client.js"></script>
<script src="./core-context.js"></script>
<script src="./core-nav.js"></script>
<link rel="stylesheet" href="./core-ui.css">
<style>
.hubhead{padding:16px;display:grid;gap:6px}
.hubhead .back{font-weight:800;font-size:13px;text-decoration:none;color:var(--fpa-blue,#1357A6)}
.hubhead h1{margin:0!important;font-size:24px!important}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .sc{font-size:34px;font-weight:900;letter-spacing:-.02em}
.pill{display:inline-block;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:800;background:#e6edf3;color:#35506a}
.pill.w{background:#e1f5e8;color:#176338}.pill.l{background:#fde7e5;color:#a02a1f}.pill.d{background:#fff1d6;color:#8a5a00}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}.tabs button{flex:1 1 0;min-width:0;min-height:42px;border:0;border-radius:10px;font-weight:800;font-size:14px;background:#e8eef5;cursor:pointer;padding:0 4px}.tabs button.active{background:var(--fpa-blue,#1357A6);color:#fff}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fact{background:#f4f7fa;border-radius:12px;padding:10px 12px}.fact b{display:block;font-size:22px}.fact span{font-size:12px;color:#6d7d8d;font-weight:700}
.ev{display:flex;gap:10px;padding:9px 0;border-top:1px solid #e8eef3;align-items:baseline}.ev:first-child{border-top:0}.ev .min{min-width:38px;font-weight:900;color:#35506a}
.ev.opp .txt{color:#a02a1f}
.go{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
iframe.pane{width:100%;border:0;display:block;min-height:480px;background:transparent}
.muted2{color:#6d7d8d;font-size:13px}
</style>
</head>
<body>
<main class="fpa-page">
<div id="loading" class="fpa-card" style="padding:26px;text-align:center">Loading match…</div>
<div id="app" class="hidden">
  <section class="fpa-card hubhead">
    <a class="back" id="back" href="./matches.html">‹ All matches</a>
    <h1 id="title"></h1>
    <div class="big"><span class="sc" id="score"></span><span id="result"></span></div>
    <div class="muted2" id="meta"></div>
  </section>
  <div class="tabs" id="tabs">
    <button data-t="overview" class="active">Overview</button><button data-t="squad">Squad</button><button data-t="match">Match</button><button data-t="votes">Votes</button><button data-t="subs">Subs</button>
  </div>
  <section id="overview" class="fpa-card" style="padding:16px"></section>
  <section id="frameWrap" class="hidden"><iframe id="pane" class="pane" title="Match tab"></iframe></section>
</div>
</main>
<script>
const sb=FootballPAClient;const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FID=new URLSearchParams(location.search).get('fixture')||'';
const PAGES={squad:'availability.html',match:'match-centre.html',votes:'voting.html',subs:'subs.html'};
let ctx,fx,tab='overview',timer=null;
const DONE=['ft','full_time','completed','complete','finished'];
const away=()=>String(fx.venue||'').toLowerCase()==='away';
const our=()=>away()?fx.away_score:fx.home_score, their=()=>away()?fx.home_score:fx.away_score;
async function safe(p){try{const r=await p;return r.error?{data:null}:r}catch(e){return {data:null}}}
function paneUrl(t){return './'+PAGES[t]+'?fixture='+encodeURIComponent(FID)+'&team='+encodeURIComponent(ctx.team.id)+'&embed=1'}
function autosize(){
  const f=$('pane');clearInterval(timer);
  timer=setInterval(()=>{try{const d=f.contentDocument;if(!d||!d.body)return;const h=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight);if(Math.abs(h-f.offsetHeight)>4)f.style.height=h+'px'}catch(e){}},400);
}
function setTab(t){
  tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  $('overview').classList.toggle('hidden',t!=='overview');$('frameWrap').classList.toggle('hidden',t==='overview');
  try{history.replaceState(null,'',location.pathname+'?fixture='+encodeURIComponent(FID)+'&team='+encodeURIComponent(ctx.team.id)+'&tab='+t)}catch(e){}
  if(t==='overview'){clearInterval(timer);renderOverview();return}
  const f=$('pane');f.style.height='480px';f.src=paneUrl(t);autosize();window.scrollTo({top:0});
}
async function renderOverview(){
  const [ev,av,sq,lu,sub,vt]=await Promise.all([
    safe(sb.from('match_events').select('id,event_type,minute,team_side,player_id,details').eq('fixture_id',FID).order('minute')),
    safe(sb.from('fixture_availability_responses').select('player_id,available').eq('fixture_id',FID)),
    safe(sb.from('match_squads').select('player_id').eq('fixture_id',FID).eq('selected',true)),
    safe(sb.from('match_lineups').select('player_id').eq('fixture_id',FID).eq('starter',true)),
    safe(sb.from('substitutions').select('id').eq('fixture_id',FID)),
    safe(sb.from('voting_events').select('id,status').eq('fixture_id',FID).limit(1))]);
  const events=(ev.data||[]).filter(e=>['goal','yellow','yellow_card','red','red_card'].includes(String(e.event_type||'').toLowerCase()));
  const ids=[...new Set(events.map(e=>e.player_id).filter(Boolean))];
  const names={};if(ids.length){const p=await safe(sb.from('players').select('id,display_name').in('id',ids));(p.data||[]).forEach(x=>names[x.id]=x.display_name)}
  const yes=(av.data||[]).filter(a=>a.available).length,no=(av.data||[]).filter(a=>!a.available).length;
  const vote=(vt.data||[])[0];
  const evHtml=events.length?events.map(e=>{
    const t=String(e.event_type).toLowerCase(),opp=e.team_side==='opponent',own=e.details?.own_goal;
    const icon=t==='goal'?'⚽':t.startsWith('yellow')?'🟨':'🟥';
    const who=own?'Own goal (opposition)':opp?'Opposition '+(t==='goal'?'goal':'card'):(names[e.player_id]||'Player');
    return '<div class="ev'+(opp&&t==='goal'?' opp':'')+'"><span class="min">'+esc(e.minute??'')+'′</span><span class="txt">'+icon+' '+esc(who)+'</span></div>'}).join(''):'<div class="muted2">No goals or cards recorded yet.</div>';
  $('overview').innerHTML='<div class="facts"><div class="fact"><b>'+yes+'</b><span>Available</span></div><div class="fact"><b>'+no+'</b><span>Unavailable</span></div><div class="fact"><b>'+(sq.data||[]).length+'</b><span>In squad</span></div><div class="fact"><b>'+(lu.data||[]).length+'</b><span>Starting XI</span></div><div class="fact"><b>'+(sub.data||[]).length+'</b><span>Subs made</span></div><div class="fact"><b>'+(vote?(vote.status==='open'?'Open':String(vote.status)):'None')+'</b><span>Voting</span></div></div>'
   +'<h2 style="margin:18px 0 6px">Goals and cards</h2>'+evHtml
   +'<div class="go"><button class="btn primary" data-go="squad">Pick squad</button><button class="btn" data-go="match">Open Match Centre</button><button class="btn" data-go="votes">Voting and guest link</button><button class="btn" data-go="subs">Subs</button></div>';
  $('overview').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
(async()=>{try{
  ctx=await FootballPAContext.resolve();FootballPANav.mount({teamId:ctx.team.id});
  $('back').href='./matches.html?team='+encodeURIComponent(ctx.team.id);
  if(!FID)throw new Error('No match selected. Go back to Matches and pick one.');
  const r=await sb.from('fixtures').select('id,opponent,venue,competition,kick_off,status,home_score,away_score,ground_name').eq('id',FID).eq('team_id',ctx.team.id).maybeSingle();
  if(r.error||!r.data)throw new Error('Match not found for this team.');
  fx=r.data;
  $('title').textContent=fx.opponent||'Opponent';
  const d=new Date(fx.kick_off);
  $('meta').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+(away()?' · Away':' · Home')+(fx.competition?' · '+fx.competition:'')+(fx.ground_name?' · '+fx.ground_name:'');
  const done=DONE.includes(String(fx.status||'').toLowerCase()),o=our(),t=their();
  if(o!=null&&t!=null&&(done||o+t>0)){$('score').textContent=o+'–'+t;$('result').innerHTML=done?'<span class="pill '+(o>t?'w':o<t?'l':'d')+'">'+(o>t?'Won':o<t?'Lost':'Draw')+'</span>':'<span class="pill">'+esc(String(fx.status||'').replace(/_/g,' '))+'</span>'}
  else{$('score').textContent='v';$('result').innerHTML='<span class="pill">'+esc(String(fx.status||'Upcoming').replace(/_/g,' '))+'</span>'}
  $('loading').classList.add('hidden');$('app').classList.remove('hidden');
  const want=new URLSearchParams(location.search).get('tab');
  setTab(PAGES[want]?want:'overview');
}catch(e){$('loading').textContent=e.message}})();
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1357A6">
<title>Football PA Dev · Create Team</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--blue:#1357A6;--ink:#102033;--muted:#6d7b8a;--line:#d9e3ec;--ok:#1f8f54;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#e7eef6,#f8fafc 45%,#edf2f7);color:var(--ink)}button,input,select{font:inherit}.wrap{width:min(100% - 28px,680px);margin:auto;padding:16px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1px}.muted{font-size:12px;color:var(--muted)}.card,.status{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px #173d6812}.card{padding:18px}.status{padding:13px 14px;margin-bottom:12px}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}h1{font-size:24px;margin:4px 0 6px}.field{margin-top:15px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #cfd9e3;border-radius:12px;background:#fff;padding:13px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.save{width:100%;margin-top:18px}.btn:disabled{opacity:.55}.result{margin-top:14px;background:#f1f8f4;border:1px solid #cce8d7;border-radius:14px;padding:14px}.hidden{display:none}.note{font-size:11px;line-height:1.5;color:var(--muted);margin-top:10px}@media(max-width:560px){.wrap{width:100%;padding:12px}.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="top"><div class="brand"><img src="https://raw.githubusercontent.com/PerranporthAFCMens/Football-PA/main/football-pa-logo-dark.svg" alt="Football PA"><div><div class="eyebrow">FOOTBALL PA DEV</div><div class="muted">Customer & team provisioning</div></div></div><button class="btn secondary" onclick="location.href='./dev.html'">← Dev Admin</button></div>
<div id="status" class="status">Checking developer access…</div>
<section id="app" class="card hidden"><div class="eyebrow muted">CREATE TEAM</div><h1>New Football PA team</h1><div class="muted">Create the club/customer and its first team from one setup.</div>
<div class="field"><label>Club / customer</label><input id="clubName" placeholder="e.g. St Agnes"></div>
<div class="field"><label>Team name</label><input id="teamName" placeholder="e.g. Dynamos Girls U10"></div><div class="field"><label>Football PA subdomain</label><div style="display:flex;align-items:center;gap:7px"><input id="subdomain" placeholder="e.g. stagnes"><span class="muted">.footballpa.com</span></div></div>
<div class="grid"><div class="field"><label>Season</label><input id="season" value="2026/27"></div><div class="field"><label>Age group</label><select id="ageGroup"><option>Open Age</option><option>U6</option><option>U7</option><option>U8</option><option>U9</option><option>U10</option><option>U11</option><option>U12</option><option>U13</option><option>U14</option><option>U15</option><option>U16</option><option>U17</option><option>U18</option></select></div></div>
<div class="grid"><div class="field"><label>Category</label><select id="gender"><option>Mixed</option><option>Girls</option><option>Boys</option><option>Women</option><option>Men</option></select></div><div class="field"><label>Match format</label><select id="matchFormat"><option>5-a-side</option><option selected>7-a-side</option><option>9-a-side</option><option>11-a-side</option></select></div></div>
<button id="create" class="btn primary save">Create team</button><div class="note">The match format is stored once on the team and is used by Football PA throughout the app.</div>
<div id="result" class="result hidden"></div></section></div>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');const $=id=>document.getElementById(id);
function status(t,type=''){ $('status').textContent=t;$('status').className='status '+type }
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('./dev-login.html');return}const {data,error}=await sb.from('platform_admins').select('user_id').eq('user_id',session.user.id).eq('active',true).maybeSingle();if(error||!data){location.replace('./dev-login.html');return}$('app').classList.remove('hidden');status('Developer access confirmed.','ok')}
$('create').onclick=async()=>{const club=$('clubName').value.trim(),team=$('teamName').value.trim(),season=$('season').value.trim(),sub=$('subdomain').value.trim().toLowerCase();if(!club||!team||!season||!sub){status('Club, team, season and subdomain are required.','bad');return}if(!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(sub)){status('Subdomain can use lowercase letters, numbers and hyphens only.','bad');return}const hostname=sub+'.footballpa.com';const existing=await sb.from('team_domains').select('team_id').eq('hostname',hostname).maybeSingle();if(existing.data){status('That Football PA subdomain is already in use.','bad');return}const b=$('create');b.disabled=true;b.textContent='Creating…';$('result').classList.add('hidden');const {data,error}=await sb.rpc('dev_create_team',{p_club_name:club,p_team_name:team,p_season_label:season,p_age_group:$('ageGroup').value,p_gender:$('gender').value,p_match_format:$('matchFormat').value});if(error){b.disabled=false;b.textContent='Create team';status(error.message,'bad');return}const d=await sb.from('team_domains').insert({team_id:data.team_id,hostname,primary_domain:true,active:true,team_name:data.team_name,club_name:data.club_name,primary_colour:'#1357A6',secondary_colour:'#FFFFFF'});b.disabled=false;b.textContent='Create team';if(d.error){status('Team created, but subdomain failed: '+d.error.message,'bad');return}status('Team created successfully.','ok');$('result').innerHTML='<strong>'+data.club_name+' → '+data.team_name+'</strong><br><span class="muted">'+$('ageGroup').value+' · '+$('gender').value+' · '+data.match_format+' · '+season+'<br>'+hostname+'</span>';$('result').classList.remove('hidden')}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('./dev-login.html')});boot();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f8"><title>Football PA invitation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./core-client.js"></script><link rel="stylesheet" href="./core-ui.css">
<style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#102033;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(440px,calc(100% - 24px));margin:7vh auto}.card{background:#fff;border:1px solid #dbe4ed;border-radius:18px;padding:24px;box-shadow:0 10px 30px #173d6814;text-align:center}.logo{width:76px;height:76px;object-fit:contain;margin:0 auto 12px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;color:#1357A6;text-transform:uppercase}h1{margin:7px 0;font-size:26px}.muted{color:#6d7b8a;font-size:13px;line-height:1.45}.field{text-align:left;margin-top:14px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input{width:100%;border:1px solid #cfd9e3;border-radius:11px;padding:12px;font-size:16px}.btn{width:100%;border:0;border-radius:11px;padding:12px 14px;background:#1357A6;color:#fff;font-weight:900;margin-top:14px;cursor:pointer}.btn:disabled{opacity:.55}.status{margin-top:12px;font-size:12px}.bad{color:#b42318}.good{color:#187747}</style></head>
<body><main class="wrap"><section class="card"><img id="badge" class="logo" alt="Football PA"><div class="eyebrow">Football PA invitation</div><h1 id="heading">Finish setting up your access</h1><div id="sub" class="muted">Loading your invitation…</div>
<div id="form" class="hidden"><div class="field"><label>Email</label><input id="email" readonly></div><div class="field"><label>Create password</label><input id="password" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"></div><button id="finish" class="btn">Activate Football PA access</button></div>
<div id="status" class="status"></div></section></main>
<script>
const sb=FootballPAClient,$=id=>document.getElementById(id),q=new URLSearchParams(location.search),teamId=q.get('team')||'';
async function brand(){if(!teamId)return;const {data:t}=await sb.from('teams').select('id,name,club_id,badge_url').eq('id',teamId).maybeSingle();if(!t)return;const {data:c}=await sb.from('clubs').select('name,badge_url,primary_colour').eq('id',t.club_id).maybeSingle();$('heading').textContent='Join '+t.name;$('sub').textContent='Create a password to activate your '+t.name+' Football PA access.';const badge=t.badge_url||c?.badge_url||'https://footballpa.com/FootballPALogo%20-%20PNG.png';$('badge').src=badge;if(c?.primary_colour){document.documentElement.style.setProperty('--blue',c.primary_colour);$('finish').style.background=c.primary_colour}}
async function session(){await new Promise(r=>setTimeout(r,120));const {data:{session}}=await sb.auth.getSession();if(!session){$('sub').textContent='This invitation needs to be opened from the secure link in your email.';$('status').textContent='If the link has expired, ask your team administrator to send a new invitation.';$('status').className='status bad';return}$('email').value=session.user.email||'';$('form').classList.remove('hidden')}
$('finish').onclick=async()=>{const p=$('password').value,c=$('confirmPassword').value;if(p.length<8)return void($('status').textContent='Use a password of at least 8 characters.');if(p!==c)return void($('status').textContent='The passwords do not match.');const b=$('finish');b.disabled=true;b.textContent='Activating…';const {error}=await sb.auth.updateUser({password:p});if(error){b.disabled=false;b.textContent='Activate Football PA access';$('status').textContent=error.message;$('status').className='status bad';return}$('status').textContent='Access activated. Opening Football PA…';$('status').className='status good';setTimeout(()=>location.replace('./index.html?team='+encodeURIComponent(teamId)),500)};
brand();session();
</script></body></html>

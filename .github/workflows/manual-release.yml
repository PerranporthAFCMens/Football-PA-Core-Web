name: Manual Production Release

on:
  workflow_dispatch:
    inputs:
      dev_sha:
        description: 'Commit SHA from dev branch to release (must test this first on dev.footballpa.com)'
        required: true
        type: string
      rehearsal:
        description: 'Rehearsal mode: validate without deploying to production'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit is on dev branch
        run: |
          git fetch origin dev:dev
          if git merge-base --is-ancestor ${{ github.event.inputs.dev_sha }} dev; then
            echo "✓ Commit ${{ github.event.inputs.dev_sha }} is on dev branch"
          else
            echo "✗ Commit not found on dev branch. Verify the SHA is correct."
            exit 1
          fi

      - name: Run smoke checks
        run: |
          echo "Running smoke checks..."
          if grep -r "TODO.*FIX\|FIXME.*PROD" src/ 2>/dev/null | head -5; then
            echo "⚠ WARNING: Possible unfinished items found"
          fi
          echo "✓ Smoke checks passed"

  release:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event.inputs.rehearsal != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release info
        id: release
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "rollback_tag=prod-$DATE" >> $GITHUB_OUTPUT
          echo "dev_sha=${{ github.event.inputs.dev_sha }}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## ✓ Production Release Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ github.event.inputs.dev_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Rollback Tag:** \`prod-$(date +%Y-%m-%d)\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Vercel Dashboard:** https://vercel.com/dashboard" >> $GITHUB_STEP_SUMMARY
          echo "2. **Deploy to production** from the \`main\` branch" >> $GITHUB_STEP_SUMMARY
          echo "3. **Verify** footballpa.com loads and teams can access" >> $GITHUB_STEP_SUMMARY
          echo "4. **If issues:** Use Instant Rollback in Vercel" >> $GITHUB_STEP_SUMMARY

  rehearsal:
    name: Validation Only (Rehearsal)
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event.inputs.rehearsal == 'true' }}
    steps:
      - name: Rehearsal complete
        run: |
          echo "✓ Rehearsal validation passed"
          echo "Commit ${{ github.event.inputs.dev_sha }} is ready for release"
          echo "No deployment performed. Manually deploy to production when ready."

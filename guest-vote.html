<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1357A6">
<title>Match voting · Football PA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./core-client.js"></script>
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#15314a;--muted:#6d7d8d;--line:#dce5ed;--blue:#1357A6;--purple:#7142cf;--green:#218b22;--red:#b42318}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}
.wrap{max-width:560px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px calc(60px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:11px;box-shadow:0 4px 14px #173a5010}
.hero{display:flex;align-items:center;gap:11px}
.badge{width:58px;height:58px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--line);padding:4px}
.badge.none{display:none}
h1{font-size:22px;margin:0 0 3px}
h2{font-size:18px;margin:0 0 11px}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.field{margin-top:12px}
.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}
.field select,.field input,.field textarea{width:100%;min-height:47px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink)}
.field textarea{min-height:84px;resize:vertical}
.btn{border:0;border-radius:11px;min-height:47px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.btn.full{width:100%}.btn.secondary{background:#e6edf3;color:var(--ink)}.btn.purple{background:var(--purple)}.btn:disabled{opacity:.55}
.good{background:#e8f8ee;border:1px solid #b7e3c6;color:#176338;border-radius:10px;padding:11px}
.empty{background:#f4f6f7;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:11px}
.bad{color:var(--red)}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 0;font-size:13px}
.linkBtn{background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer;padding:8px 0;min-height:40px}
.overlay{position:fixed;inset:0;background:#0d2236d9;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.overlayCard{background:#fff;border-radius:20px;padding:26px 20px;max-width:380px;width:100%;text-align:center}
.tick{width:64px;height:64px;border-radius:50%;background:#e8f8ee;color:var(--green);font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card hero">
    <img id="badge" class="badge none" alt="">
    <div><h1 id="club">Match voting</h1><div id="sub" class="muted"></div></div>
  </div>

  <div id="loading" class="card"><div class="muted">Loading…</div></div>

  <div id="message" class="card hidden"><h2 id="messageTitle"></h2><div id="messageBody" class="empty"></div></div>

  <section id="nameStep" class="card hidden">
    <h2>Guest voting</h2>
    <div id="nameMatch" class="good"></div>
    <div class="field"><label for="guestName">Your name</label><input id="guestName" type="text" autocomplete="name" maxlength="60" placeholder="First name and surname"></div>
    <button id="nameNext" class="btn full" style="margin-top:12px">Continue</button>
    <div id="nameStatus" class="muted" style="margin-top:9px"></div>
  </section>

  <section id="voteStep" class="card hidden">
    <h2>Match voting</h2>
    <div class="good"><b id="voteTitle"></b><div class="muted" style="margin-top:4px">Choose three different players, then your Dick of the Day.</div></div>
    <div class="who"><span>Voting as <b id="whoName"></b></span><button id="changeName" class="linkBtn" type="button">Change name</button></div>
    <div class="field"><label for="v3">3 Points</label><select id="v3"></select></div>
    <div class="field"><label for="v2">2 Points</label><select id="v2"></select></div>
    <div class="field"><label for="v1">1 Point</label><select id="v1"></select></div>
    <div class="field"><label for="vFun">Dick of the Day</label><select id="vFun"></select></div>
    <div class="field"><label for="vReason">Reason</label><textarea id="vReason" placeholder="Reason…"></textarea></div>
    <button id="submitVote" class="btn purple full" style="margin-top:12px">Submit vote</button>
    <div id="voteStatus" class="muted" style="margin-top:9px"></div>
  </section>
</div>

<div id="thanks" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="overlayCard">
    <div class="tick">✓</div>
    <h2 style="font-size:24px;margin-bottom:8px">Your vote has been submitted</h2>
    <div>Thanks <b id="thanksName"></b>. Your vote has been received.</div>
    <button id="changeVote" class="btn secondary full" style="margin-top:20px">Change my vote</button>
  </div>
</div>

<script>
const sb=FootballPAClient;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN=new URLSearchParams(location.search).get('t')||'';
const NAME_KEY='fpa_guest_name';
let D=null,guestName='';

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function show(id){['loading','message','nameStep','voteStep'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function say(title,body){$('messageTitle').textContent=title;$('messageBody').textContent=body;show('message')}
function opts(){return '<option value="">Select player…</option>'+(D.candidates||[]).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')}
function fillVoteForm(){['v3','v2','v1','vFun'].forEach(id=>{$(id).innerHTML=opts()});$('vReason').value='';$('voteStatus').textContent=''}

function goVote(){
  $('whoName').textContent=guestName;$('voteTitle').textContent=D.title||'Match voting';
  fillVoteForm();show('voteStep');
}

async function boot(){
  if(!TOKEN){say('Voting link not valid','This link is missing its code. Ask for the voting link again.');return}
  const {data,error}=await sb.rpc('guest_vote_data',{p_token:TOKEN});
  if(error){say('Could not load voting',error.message);return}
  D=data||{};
  if(D.club?.primary_colour)document.documentElement.style.setProperty('--blue',D.club.primary_colour);
  if(D.team?.badge_url){$('badge').src=D.team.badge_url;$('badge').classList.remove('none')}
  $('club').textContent=D.club?.name||'Match voting';$('sub').textContent=D.team?.name||'';
  if(D.status==='invalid'){say('Voting link not valid','This link does not match a vote. Ask for the voting link again.');return}
  if(D.status==='closed'){say('Voting has closed','Voting for '+(D.title||'this match')+' is no longer open.');return}
  $('nameMatch').textContent=D.title||'Match voting';
  $('guestName').value=store(NAME_KEY)||'';
  show('nameStep');
}

$('nameNext').onclick=()=>{
  const n=$('guestName').value.replace(/\s+/g,' ').trim();
  if(n.length<2){$('nameStatus').textContent='Enter your name to continue.';$('nameStatus').classList.add('bad');return}
  guestName=n;store(NAME_KEY,n);goVote();
};
$('guestName').addEventListener('keydown',e=>{if(e.key==='Enter')$('nameNext').click()});
$('changeName').onclick=()=>{$('guestName').value=guestName;show('nameStep')};

$('submitVote').onclick=async()=>{
  const ids=[$('v3').value,$('v2').value,$('v1').value];
  const st=$('voteStatus');st.classList.remove('bad');
  if(ids.some(x=>!x)||new Set(ids).size!==3){st.textContent='Choose three different players for 3, 2 and 1 points.';st.classList.add('bad');return}
  const b=$('submitVote');b.disabled=true;const old=b.textContent;b.textContent='Submitting…';
  const {error}=await sb.rpc('guest_vote_submit',{p_token:TOKEN,p_guest_name:guestName,p_rank1:ids[0],p_rank2:ids[1],p_rank3:ids[2],p_fun:$('vFun').value||null,p_reason:$('vReason').value.trim()||null});
  b.disabled=false;b.textContent=old;
  if(error){st.textContent=error.message;st.classList.add('bad');return}
  $('thanksName').textContent=guestName;$('thanks').classList.remove('hidden');
};
$('changeVote').onclick=()=>{$('thanks').classList.add('hidden');fillVoteForm()};

boot().catch(e=>say('Could not load voting',e.message));
</script>
</body>
</html>

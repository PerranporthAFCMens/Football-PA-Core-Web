<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1726"><title>Football PA Dev · Teams</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f8;color:#102033}.top{background:#0b1726;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.brand img{width:40px;height:40px}.brand b{display:block}.brand small{color:#aebdce}.top a{color:#fff;text-decoration:none;border:1px solid #53657a;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:800}.wrap{width:min(1120px,calc(100% - 28px));margin:22px auto}.head{display:flex;align-items:end;justify-content:space-between;gap:15px}.head h1{margin:0 0 5px}.muted{color:#6d7b8a}.primary{background:#1357A6;color:#fff;text-decoration:none;border-radius:11px;padding:11px 14px;font-weight:800;font-size:13px}.tools{display:flex;gap:10px;margin:18px 0}.search{flex:1;background:#fff;border:1px solid #d5e0ea;border-radius:12px;padding:12px 14px;font-size:15px}.count{display:flex;align-items:center;background:#fff;border:1px solid #d5e0ea;border-radius:12px;padding:0 14px;font-size:13px;font-weight:800}.list{display:grid;gap:12px}.team{background:#fff;border:1px solid #dbe4ed;border-radius:16px;padding:17px;box-shadow:0 6px 18px #173d680d;display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.club{font-size:11px;font-weight:900;letter-spacing:.7px;color:#1357A6;text-transform:uppercase}.team h2{font-size:18px;margin:4px 0 8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;background:#eef3f8;border-radius:20px;padding:5px 8px;color:#526477}.active{background:#e9f7ef;color:#187747}.inactive{background:#fcebea;color:#a32921}.id{font-size:10px;color:#94a0ac;margin-top:10px}.open{border:1px solid #d6e0e9;background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;color:#21344a;cursor:pointer}.empty{background:#fff;border:1px solid #dbe4ed;border-radius:16px;padding:30px;text-align:center;color:#6d7b8a}@media(max-width:650px){.wrap{width:calc(100% - 22px);margin:15px auto}.head{align-items:flex-start}.team{grid-template-columns:1fr}.open{width:100%}.tools{flex-direction:column}.count{padding:11px 14px}.head .primary{white-space:nowrap}}</style></head>
<body><div id="guard" class="empty" style="margin:25px">Checking secure Dev access…</div><div id="app" hidden><header class="top"><div class="brand"><img src="https://raw.githubusercontent.com/PerranporthAFCMens/Football-PA/main/football-pa-logo-dark.svg" alt=""><div><b>Football PA Dev</b><small>Teams</small></div></div><a href="/dev.html">← Dev Admin</a></header><main class="wrap"><div class="head"><div><h1>Teams</h1><div class="muted">Every team currently configured in Football PA Core.</div></div><a class="primary" href="/dev-create-team.html">+ Create Team</a></div><div class="tools"><input id="search" class="search" placeholder="Search team or club…"><div id="count" class="count">0 teams</div></div><div id="list" class="list"></div></main></div>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');const $=x=>document.getElementById(x);let teams=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function admin(uid){const {data}=await sb.from('platform_admins').select('user_id').eq('user_id',uid).eq('active',true).maybeSingle();return !!data}
function render(){const q=$('search').value.trim().toLowerCase();const rows=teams.filter(t=>!q||t.name.toLowerCase().includes(q)||(t.clubs?.name||'').toLowerCase().includes(q));$('count').textContent=rows.length+' team'+(rows.length===1?'':'s');$('list').innerHTML=rows.length?rows.map(t=>`<article class="team"><div><div class="club">${esc(t.clubs?.name||'Unknown club')}</div><h2>${esc(t.name)}</h2><div class="chips"><span class="chip">${esc(t.season_label||'No season')}</span>${t.age_group?'<span class="chip">'+esc(t.age_group)+'</span>':''}${t.gender?'<span class="chip">'+esc(t.gender)+'</span>':''}${t.match_format?'<span class="chip">'+esc(t.match_format)+'</span>':''}<span class="chip ${t.active?'active':'inactive'}">${t.active?'Active':'Inactive'}</span></div><div class="id">Team ID: ${esc(t.id)}</div></div><button class="open" data-id="${esc(t.id)}">Open team</button></article>`).join(''):'<div class="empty">No teams found.</div>'}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session||!await admin(session.user.id)){location.replace('/dev-login.html');return}const {data,error}=await sb.from('teams').select('id,name,slug,season_label,age_group,gender,match_format,active,clubs(name,short_name)').order('name');if(error){$('guard').textContent=error.message;return}teams=data||[];$('guard').hidden=true;$('app').hidden=false;render()}
$('search').addEventListener('input',render);$('list').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)location.href='/dev-team.html?id='+encodeURIComponent(b.dataset.id)});boot();
</script></body></html>

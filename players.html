<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3f8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Players & Training · Football PA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/core-context.js"></script>
<script src="/core-nav.js"></script>
<link rel="stylesheet" href="/core-ui.css">
<style>
.page{display:grid;gap:12px}.hero{padding:17px}.hero h1{margin:0;font-size:25px}.sub{margin-top:5px;color:var(--muted);font-size:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:14px;padding:4px;border-radius:12px;background:#e8eef4}
.tabs button{border:0;border-radius:9px;padding:10px;background:transparent;color:#657587;font-weight:900;cursor:pointer}
.tabs button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #10203314}
.card{padding:15px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionHead h2{margin:0;font-size:18px}
.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#fff;font-weight:800;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:#b42318}.btn:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}.status{min-height:0;font-size:12px}.status.ok{color:#187747}.status.bad{color:#b42318}
.formGrid{display:grid;grid-template-columns:1fr 1fr 1fr 90px auto;gap:8px;margin-top:12px}.formGrid input,.sessionGrid input,.sessionSelect{min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;font:inherit}
.roster{margin-top:12px;border-top:1px solid #edf1f5;min-width:0}.playerRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f5;min-width:0}
.playerName{font-size:19px;line-height:1.18;font-weight:900}.playerMeta{margin-top:4px;color:var(--muted);font-size:13px}.rowActions{display:flex;gap:6px}.manageActions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.sortSelect{min-width:150px}
.sessionCreate{margin-top:12px;padding:12px;border:1px solid #e2e9f0;border-radius:14px;background:#f8fafc}.sessionSetup{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(150px,.6fr);gap:8px}.sessionSetup label,.sessionGrid label{display:grid;gap:6px;min-width:0}.sessionSetup label>span,.sessionGrid label>span{font-size:10px;font-weight:900;letter-spacing:.06em;color:var(--muted)}.sessionSetup input,.sessionSetup select{width:100%;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;font:inherit}.sessionGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-top:8px;align-items:end}.recurrenceHint{margin-top:8px}.review{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:14px}
.review label{display:grid;gap:6px;min-width:0;flex:1;color:var(--muted);font-size:11px;font-weight:900}.reviewActions{display:flex;gap:7px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px -15px 0;padding:12px 15px;background:#f8fafc;border-top:1px solid #edf1f5;border-bottom:1px solid #edf1f5}
.summary div{text-align:center}.summary b{display:block;font-size:20px}.summary span{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.06em}
.register{width:100%;max-width:100%;table-layout:fixed;border-collapse:collapse}.register th,.register td{padding:12px 7px;border-bottom:1px solid #edf1f5}.register th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase}
.register th:first-child,.register td:first-child{min-width:0;overflow-wrap:anywhere}.register th:last-child,.register td:last-child{width:90px;text-align:center}.shirt{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:9px;border-radius:10px;background:#eef4fb;color:var(--blue);font-weight:900}
.att{display:inline-flex;position:relative;width:40px;height:40px;align-items:center;justify-content:center}.att input{position:absolute;inset:0;width:40px;height:40px;opacity:0;z-index:2;cursor:pointer}
.att span{display:flex;width:34px;height:34px;align-items:center;justify-content:center;border:2px solid #9aabba;border-radius:9px;background:#fff;color:transparent;font-size:20px;font-weight:900}
.att input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}.att input:disabled+span{opacity:.55}.empty{padding:22px 0;text-align:center;color:var(--muted)}
@media(max-width:680px){.page,.card,.hero,.roster,.sessionCreate,#sessionContent{min-width:0;max-width:100%}.sectionHead{align-items:flex-start;flex-direction:column}.manageActions{width:100%;display:grid;grid-template-columns:1fr}.manageActions .btn,.manageActions select{width:100%;min-width:0}.sortSelect{min-width:0}.formGrid{grid-template-columns:1fr}.formGrid button{grid-column:auto;width:100%}.sessionSetup,.sessionGrid{grid-template-columns:1fr}.sessionGrid button{grid-column:auto;width:100%}.review{align-items:stretch;flex-direction:column}.reviewActions{width:100%;display:grid;grid-template-columns:1fr}.reviewActions .btn{width:100%}.roster{display:grid;gap:8px;border-top:0}.playerRow{grid-template-columns:1fr;padding:12px;border:1px solid #e2e9f0;border-radius:13px;background:#fff}.playerName{font-size:17px;white-space:normal;overflow-wrap:anywhere}.rowActions{display:grid;grid-template-columns:1fr 1fr;width:100%}.rowActions .btn{width:100%;min-width:0}.register th,.register td{padding:10px 4px}.register th:last-child,.register td:last-child{width:72px}.register td:first-child b{font-size:13px}.shirt{width:30px;height:30px;margin-right:6px;font-size:11px}.hero h1{font-size:23px}.tabs button{padding:10px 6px}}
</style>
</head>
<body>
<main class="fpa-page">
<div id="loading" class="fpa-card" style="padding:28px;text-align:center">Loading players & training…</div>
<div id="app" class="page hidden">
  <section class="fpa-card hero">
    <h1>Players & Training</h1>
    <div id="teamLabel" class="sub"></div>
    <div class="tabs">
      <button id="trainingTab" class="active" type="button">Training log</button>
      <button id="playersTab" type="button">Players</button>
    </div>
  </section>

  <div id="status" class="status"></div>

  <section id="playersPanel" class="fpa-card card hidden">
    <div class="sectionHead">
      <div><h2>Manage squad</h2><div class="muted">Add, edit or remove players from this team.</div></div>
      <div class="manageActions"><select id="playerSort" class="btn sortSelect" aria-label="Sort players"><option value="surname">Surname A–Z</option><option value="shirt">Shirt number</option><option value="first">First name A–Z</option></select><button id="toggleAdd" class="btn primary">+ Add player</button></div>
    </div>
    <div id="playerForm" class="formGrid hidden">
      <input id="firstName" placeholder="First name" autocomplete="off">
      <input id="lastName" placeholder="Surname" autocomplete="off">
      <input id="position" placeholder="Position" autocomplete="off">
      <input id="shirtNumber" type="number" min="0" max="99" placeholder="No.">
      <button id="savePlayer" class="btn primary">Add to squad</button>
    </div>
    <div id="roster" class="roster"></div>
  </section>

  <section id="trainingPanel" class="fpa-card card">
    <div class="sectionHead"><div><h2>Training log</h2><div class="muted">Create a session and mark attendance.</div></div></div>
    <div id="sessionCreate" class="sessionCreate">
      <div class="sessionSetup">
        <label><span>SESSION</span><input id="sessionTitle" value="Training" aria-label="Session title"></label>
        <label><span>REPEAT</span><select id="sessionRepeat" class="sessionSelect" aria-label="Repeat training"><option value="single">One-off</option><option value="weekly">Weekly</option></select></label>
      </div>
      <div class="sessionGrid">
        <label><span id="sessionStartLabel">DATE</span><input id="sessionDate" type="date" aria-label="Training date"></label>
        <label id="sessionEndWrap" class="hidden"><span>END DATE</span><input id="sessionEndDate" type="date" aria-label="Training end date"></label>
        <button id="addSession" class="btn primary">+ Add session</button>
      </div>
      <div id="recurrenceHint" class="muted recurrenceHint">Add a single training session.</div>
    </div>
    <div id="noSessions" class="empty hidden"></div>
    <div id="sessionContent" class="hidden">
      <div class="review">
        <label>SESSION<select id="reviewSession" class="sessionSelect"></select></label>
        <div id="reviewActions" class="reviewActions">
          <button id="lockSession" class="btn primary">Save & lock session</button>
          <button id="selectAll" class="btn">Select all</button>
          <button id="deleteSession" class="btn danger">Delete session</button>
        </div>
      </div>
      <div id="sessionLockNote" class="muted" style="margin-top:10px"></div><div id="summary" class="summary"></div>
      <table class="register"><thead><tr><th>Player</th><th>Attended</th></tr></thead><tbody id="regBody"></tbody></table>
    </div>
  </section>
</div>
</main>

<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const byShirt=(a,b)=>a.shirt_number==null?(b.shirt_number==null?a.display_name.localeCompare(b.display_name):1):b.shirt_number==null?-1:(a.shirt_number-b.shirt_number)||a.display_name.localeCompare(b.display_name);
const surnameKey=p=>String(p.last_name||p.display_name||'').trim().toLocaleLowerCase('en-GB');
const firstKey=p=>String(p.first_name||p.display_name||'').trim().toLocaleLowerCase('en-GB');

let ctx=null,players=[],sessions=[],attendance=[],editingPlayerId=null,playerSort='surname';

function showStatus(message,type=''){const el=$('status');el.textContent=message;el.className='status '+type}
function activeSession(){return sessions.find(s=>s.id===$('reviewSession').value)||sessions[0]||null}
function setTab(tab,{replaceUrl=true}={}){
  const training=tab==='training';
  $('playersTab').classList.toggle('active',!training);
  $('trainingTab').classList.toggle('active',training);
  $('playersPanel').classList.toggle('hidden',training);
  $('trainingPanel').classList.toggle('hidden',!training);
  if(training)renderTraining();
  if(replaceUrl){const q=new URLSearchParams(location.search);if(training)q.delete('view');else q.set('view','players');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():''))}
}
function resetPlayerForm(){
  editingPlayerId=null;
  $('firstName').value='';$('lastName').value='';$('position').value='';$('shirtNumber').value='';
  $('savePlayer').textContent='Add to squad';$('playerForm').classList.add('hidden');
}
function renderRoster(){
  const comparator=playerSort==='shirt'?byShirt:playerSort==='first'?(a,b)=>firstKey(a).localeCompare(firstKey(b),'en-GB',{sensitivity:'base'})||surnameKey(a).localeCompare(surnameKey(b),'en-GB',{sensitivity:'base'}):(a,b)=>surnameKey(a).localeCompare(surnameKey(b),'en-GB',{sensitivity:'base'})||firstKey(a).localeCompare(firstKey(b),'en-GB',{sensitivity:'base'});
  const rows=[...players].sort(comparator);
  $('roster').innerHTML=rows.length?rows.map(p=>'<div class="playerRow"><div><div class="playerName">'+esc(p.display_name)+'</div><div class="playerMeta">#'+esc(p.shirt_number??'–')+(p.preferred_position?' · '+esc(p.preferred_position):'')+'</div></div><div class="rowActions">'+(ctx.canManage?'<button class="btn" data-edit="'+p.id+'">Edit</button><button class="btn danger" data-remove="'+p.id+'">Remove</button>':'')+'</div></div>').join(''):'<div class="empty">No players in this squad yet.</div>';
}
function renderTraining(){
  if(!sessions.length){
    $('sessionContent').classList.add('hidden');$('noSessions').classList.remove('hidden');
    $('noSessions').textContent='No training sessions yet. Add one above to start the attendance log.';return;
  }
  $('noSessions').classList.add('hidden');$('sessionContent').classList.remove('hidden');
  const previous=$('reviewSession').value;
  $('reviewSession').innerHTML=sessions.map(s=>'<option value="'+s.id+'">'+fmt(s.session_date)+' · '+esc(s.title||'Training')+'</option>').join('');
  if(previous&&sessions.some(s=>s.id===previous))$('reviewSession').value=previous;
  const session=activeSession();$('reviewSession').value=session.id;
  const locked=!!session.locked_at;
  const rows=[...players].sort(byShirt);
  const present=new Set(attendance.filter(a=>a.session_id===session.id&&a.status==='present').map(a=>a.player_id));
  $('summary').innerHTML='<div><b>'+rows.length+'</b><span>SQUAD</span></div><div><b>'+present.size+'</b><span>PRESENT</span></div><div><b>'+Math.max(0,rows.length-present.size)+'</b><span>NOT MARKED</span></div>';
  $('regBody').innerHTML=rows.map(p=>'<tr><td><span class="shirt">#'+esc(p.shirt_number??'–')+'</span><b>'+esc(p.display_name)+'</b></td><td><label class="att"><input type="checkbox" data-session="'+session.id+'" data-player="'+p.id+'" '+(present.has(p.id)?'checked':'')+' '+((!ctx.canManage||locked)?'disabled':'')+'><span>✓</span></label></td></tr>').join('');
  $('reviewActions').classList.toggle('hidden',!ctx.canManage);
  $('sessionLockNote').textContent=locked?'Session locked. Attendance is protected from accidental changes.':'Session open. Save & lock it when attendance is complete.';
  $('lockSession').textContent=locked?'Unlock session':'Save & lock session';
  $('lockSession').classList.toggle('primary',!locked);
  const all=rows.length>0&&present.size===rows.length;$('selectAll').disabled=locked||all;$('selectAll').textContent=all?'All selected ✓':'Select all';$('deleteSession').disabled=locked;
}
async function load(){
  ctx=await FootballPAContext.resolve();
  FootballPANav.mount({teamId:ctx.team.id});
  $('teamLabel').textContent=ctx.club.name+' · '+ctx.team.name+' · '+(ctx.season?.label||ctx.team.season_label||'Current season');
  $('toggleAdd').classList.toggle('hidden',!ctx.canManage);$('sessionCreate').classList.toggle('hidden',!ctx.canManage);

  let pq=sb.from('team_players').select('players(id,display_name,first_name,last_name,preferred_position,shirt_number)').eq('team_id',ctx.team.id).eq('active',true);
  if(ctx.season?.id)pq=pq.eq('season_id',ctx.season.id);
  const [pr,sr]=await Promise.all([pq,sb.from('training_sessions').select('*').eq('team_id',ctx.team.id).order('session_date',{ascending:false})]);
  if(pr.error)throw pr.error;if(sr.error)throw sr.error;
  players=(pr.data||[]).map(x=>x.players).filter(Boolean);sessions=sr.data||[];

  const sessionIds=sessions.map(s=>s.id);
  if(sessionIds.length){const ar=await sb.from('training_attendance').select('*').in('session_id',sessionIds);if(ar.error)throw ar.error;attendance=ar.data||[]}

  renderRoster();renderTraining();
  $('loading').classList.add('hidden');$('app').classList.remove('hidden');
  setTab(new URLSearchParams(location.search).get('view')==='players'?'players':'training',{replaceUrl:false});
  syncTrainingRepeat();
}

$('playersTab').onclick=()=>setTab('players');$('playerSort').onchange=e=>{playerSort=e.target.value;renderRoster()};
$('trainingTab').onclick=()=>setTab('training');
$('toggleAdd').onclick=()=>{$('playerForm').classList.toggle('hidden');if(!$('playerForm').classList.contains('hidden'))$('firstName').focus()};
$('savePlayer').onclick=async()=>{
  if(!ctx.canManage)return;
  const first=$('firstName').value.trim(),last=$('lastName').value.trim();
  if(!first||!last){showStatus('Enter the player’s first name and surname.','bad');return}
  const btn=$('savePlayer'),name=(first+' '+last).trim(),position=$('position').value.trim()||null,number=$('shirtNumber').value===''?null:Number($('shirtNumber').value);
  btn.disabled=true;btn.textContent='Saving…';
  try{
    if(editingPlayerId){
      const {data,error}=await sb.from('players').update({first_name:first,last_name:last,display_name:name,preferred_position:position,shirt_number:number,updated_at:new Date().toISOString()}).eq('id',editingPlayerId).select('id,display_name,first_name,last_name,preferred_position,shirt_number').single();
      if(error)throw error;players=players.map(p=>p.id===data.id?data:p);showStatus(data.display_name+' updated.','ok');
    }else{
      let existing=await sb.from('players').select('id,display_name,first_name,last_name,preferred_position,shirt_number,active').eq('club_id',ctx.team.club_id).ilike('first_name',first).ilike('last_name',last).limit(1).maybeSingle();
      if(existing.error)throw existing.error;let p=existing.data;
      if(!p){const r=await sb.from('players').insert({club_id:ctx.team.club_id,first_name:first,last_name:last,display_name:name,preferred_position:position,shirt_number:number,active:true}).select('id,display_name,first_name,last_name,preferred_position,shirt_number,active').single();if(r.error)throw r.error;p=r.data}
      let mq=sb.from('team_players').select('id,active').eq('team_id',ctx.team.id).eq('player_id',p.id);if(ctx.season?.id)mq=mq.eq('season_id',ctx.season.id);
      const membership=await mq.maybeSingle();if(membership.error)throw membership.error;
      if(membership.data){if(membership.data.active)throw new Error(p.display_name+' is already in this squad.');const r=await sb.from('team_players').update({active:true,updated_at:new Date().toISOString()}).eq('id',membership.data.id);if(r.error)throw r.error}
      else{const r=await sb.from('team_players').insert({team_id:ctx.team.id,player_id:p.id,season_id:ctx.season?.id||null,active:true});if(r.error)throw r.error}
      if(!players.some(x=>x.id===p.id))players.push(p);showStatus(p.display_name+' added to the squad.','ok');
    }
    resetPlayerForm();renderRoster();renderTraining();
  }catch(e){showStatus('Could not save player: '+e.message,'bad')}
  finally{btn.disabled=false;if(!editingPlayerId)btn.textContent='Add to squad'}
};
$('roster').onclick=async e=>{
  const edit=e.target.closest('[data-edit]'),remove=e.target.closest('[data-remove]');
  if(edit){const p=players.find(x=>x.id===edit.dataset.edit);if(!p)return;editingPlayerId=p.id;$('firstName').value=p.first_name||'';$('lastName').value=p.last_name||'';$('position').value=p.preferred_position||'';$('shirtNumber').value=p.shirt_number??'';$('savePlayer').textContent='Save changes';$('playerForm').classList.remove('hidden');$('firstName').focus();return}
  if(remove){const p=players.find(x=>x.id===remove.dataset.remove);if(!p||!confirm('Remove '+p.display_name+' from this squad?'))return;remove.disabled=true;let q=sb.from('team_players').update({active:false,updated_at:new Date().toISOString()}).eq('team_id',ctx.team.id).eq('player_id',p.id);if(ctx.season?.id)q=q.eq('season_id',ctx.season.id);const {error}=await q;if(error){showStatus(error.message,'bad');remove.disabled=false;return}players=players.filter(x=>x.id!==p.id);showStatus(p.display_name+' removed from this squad.','ok');renderRoster();renderTraining()}
};
function syncTrainingRepeat(){
  const weekly=$('sessionRepeat').value==='weekly';
  $('sessionEndWrap').classList.toggle('hidden',!weekly);
  $('sessionStartLabel').textContent=weekly?'START DATE':'DATE';
  $('addSession').textContent=weekly?'+ Add recurring sessions':'+ Add session';
  const d=$('sessionDate').value;
  $('recurrenceHint').textContent=weekly?(d?'Repeats every '+new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'long'})+' until the end date.':'Choose the first training date and an end date.'):'Add a single training session.';
}
function weeklyDates(start,end){
  const a=new Date(start+'T12:00:00Z'),b=new Date(end+'T12:00:00Z'),out=[];
  if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime())||b<a)return out;
  for(let d=new Date(a);d<=b;d.setUTCDate(d.getUTCDate()+7)){out.push(d.toISOString().slice(0,10));if(out.length>=104)break}
  return out;
}
$('sessionRepeat').onchange=syncTrainingRepeat;
$('sessionDate').onchange=syncTrainingRepeat;
$('addSession').onclick=async()=>{
  if(!ctx.canManage)return;
  const start=$('sessionDate').value,t=$('sessionTitle').value.trim()||'Training',weekly=$('sessionRepeat').value==='weekly',end=$('sessionEndDate').value;
  if(!start){showStatus('Choose a training date first.','bad');return}
  if(weekly&&!end){showStatus('Choose when the recurring training should stop.','bad');return}
  const dates=weekly?weeklyDates(start,end):[start];
  if(!dates.length){showStatus('The end date must be on or after the start date.','bad');return}
  const existing=new Set(sessions.filter(s=>(s.title||'Training').trim().toLowerCase()===t.toLowerCase()).map(s=>s.session_date));
  const createDates=dates.filter(d=>!existing.has(d));
  if(!createDates.length){showStatus('Those training sessions already exist.','bad');return}
  const {data:{user}}=await sb.auth.getUser(),b=$('addSession');b.disabled=true;b.textContent='Adding…';
  const payload=createDates.map(d=>({team_id:ctx.team.id,session_date:d,title:t,created_by:user.id}));
  const {data,error}=await sb.from('training_sessions').insert(payload).select();
  b.disabled=false;syncTrainingRepeat();
  if(error){showStatus(error.message,'bad');return}
  sessions=[...(data||[]),...sessions].sort((a,b)=>String(b.session_date).localeCompare(String(a.session_date)));
  const skipped=dates.length-createDates.length;
  showStatus((data?.length||0)+' training session'+((data?.length||0)===1?'':'s')+' added'+(skipped?' · '+skipped+' already existed':'')+'.','ok');
  renderTraining();
};
$('reviewSession').onchange=renderTraining;
$('lockSession').onclick=async()=>{if(!ctx.canManage)return;const s=activeSession();if(!s)return;const locked=!!s.locked_at,b=$('lockSession');b.disabled=true;b.textContent=locked?'Unlocking…':'Locking…';const {data:{user}}=await sb.auth.getUser();const patch=locked?{locked_at:null,locked_by:null,updated_at:new Date().toISOString()}:{locked_at:new Date().toISOString(),locked_by:user.id,updated_at:new Date().toISOString()};const {data,error}=await sb.from('training_sessions').update(patch).eq('id',s.id).eq('team_id',ctx.team.id).select().single();b.disabled=false;if(error){showStatus(error.message,'bad');renderTraining();return}sessions=sessions.map(x=>x.id===data.id?data:x);showStatus(locked?'Training session unlocked.':'Training session saved and locked.','ok');renderTraining()};
$('selectAll').onclick=async()=>{
  if(!ctx.canManage)return;const s=activeSession();if(!s||!players.length)return;
  const b=$('selectAll');b.disabled=true;b.textContent='Saving…';const {data:{user}}=await sb.auth.getUser();
  const payload=players.map(p=>({session_id:s.id,player_id:p.id,status:'present',updated_by:user.id}));
  const {data,error}=await sb.from('training_attendance').upsert(payload).select();
  if(error){showStatus(error.message,'bad');b.disabled=false;b.textContent='Select all';return}
  attendance=attendance.filter(a=>a.session_id!==s.id).concat(data||payload);showStatus('Everyone marked present.','ok');renderTraining();
};
$('deleteSession').onclick=async()=>{
  if(!ctx.canManage)return;const s=activeSession();if(!s||!confirm('Delete '+fmt(s.session_date)+' · '+(s.title||'Training')+'? This also removes its attendance records.'))return;
  const b=$('deleteSession');b.disabled=true;let r=await sb.from('training_attendance').delete().eq('session_id',s.id);if(!r.error)r=await sb.from('training_sessions').delete().eq('id',s.id).eq('team_id',ctx.team.id);b.disabled=false;
  if(r.error){showStatus(r.error.message,'bad');return}sessions=sessions.filter(x=>x.id!==s.id);attendance=attendance.filter(x=>x.session_id!==s.id);showStatus('Training session deleted.','ok');renderTraining();
};
$('regBody').onchange=async e=>{
  if(e.target.type!=='checkbox'||!ctx.canManage)return;
  const s=e.target.dataset.session,p=e.target.dataset.player,checked=e.target.checked;e.target.disabled=true;
  if(checked){const {data:{user}}=await sb.auth.getUser();const {data,error}=await sb.from('training_attendance').upsert({session_id:s,player_id:p,status:'present',updated_by:user.id}).select().single();if(error){e.target.checked=false;showStatus(error.message,'bad')}else{attendance=attendance.filter(a=>!(a.session_id===s&&a.player_id===p));attendance.push(data)}}
  else{const {error}=await sb.from('training_attendance').delete().eq('session_id',s).eq('player_id',p);if(error){e.target.checked=true;showStatus(error.message,'bad')}else attendance=attendance.filter(a=>!(a.session_id===s&&a.player_id===p))}
  e.target.disabled=false;renderTraining();
};

sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session)location.replace('/login.html')});
load().catch(e=>{$('loading').innerHTML='<b>Could not load Players & Training.</b><br><span class="fpa-muted">'+esc(e.message)+'</span>'});
</script>
</body>

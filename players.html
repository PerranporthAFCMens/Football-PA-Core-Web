1fr;gap:8px;padding:0 14px;width:100%}#sessionReviewTools label{display:grid;grid-template-columns:1fr;gap:6px}#reviewSession{margin-left:0!important;width:100%;max-width:100%;min-width:0}#deleteSession{width:100%}.scroll{width:100%;max-width:100%;overflow-x:hidden}.register{width:100%!important;min-width:0!important;max-width:100%!important}.register th,.register td{padding:12px 10px!important;white-space:normal!important}.register th:first-child,.register td:first-child{width:68%!important}.register th:nth-child(2),.register td:nth-child(2){width:32%!important}}</style><script src="/core-context.js"></script><script src="/core-nav.js"></script><link rel="stylesheet" href="/core-ui.css"></head><body>
<main class="wrap fpa-page"><div id="preview" class="preview fpa-preview hidden">DEV PREVIEW · Viewing this team's player dashboard</div><div class="head fpa-pagehead"><div><div class="muted" id="clubName">Loading…</div><h1 class="fpa-title">Players</h1><div class="muted">Compare playing time, performance and training across the squad.</div></div></div>
<section class="manage"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>Manage squad</b><div class="muted">Add a player directly to this team.</div></div><button id="toggleAddPlayer" class="btn primary">+ Add player</button></div><div id="addPlayerForm" class="managegrid hidden" style="margin-top:12px"><input id="playerName" placeholder="Player name"><input id="playerPosition" placeholder="Position"><input id="playerNumber" type="number" min="0" max="99" placeholder="No."><button id="savePlayer" class="btn primary">Add to squad</button></div><div id="manageMsg" class="manageMsg"></div></section><div class="tabs"><button type="button" class="active" data-tab="squad">Squad Dashboard</button><button type="button" data-tab="training">Training Register</button></div><div id="status" class="status"></div>
<section id="squad"><div class="tools"><select id="preset" class="btn"><option value="overview">Overview</option><option value="minutes">Playing Time</option><option value="performance">Performance</option><option value="training">Training</option><option value="custom">Custom</option></select><div class="picker"><button id="choose" class="btn">Choose data ▾</button><div id="picker" class="pickerbox hidden"></div></div><select id="range" class="btn"><option value="season">Season</option><option value="8">Last 8 weeks</option><option value="4">Last 4 weeks</option></select></div><div class="card scroll"><table class="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section>
<section id="training" class="hidden"><div class="card"><div class="reghead"><div><h2>Training Register</h2><div class="muted">Add a session, then tick the players who attended.</div></div><div class="tools" style="margin:0"><input id="sessionDate" type="date" class="btn"><input id="sessionTitle" value="Training" class="btn" style="width:130px"><button id="addSession" class="btn primary">+ Add session</button></div></div><div id="trainingEmpty" class="empty hidden"></div><div class="tools" id="sessionReviewTools" style="margin:12px 0"><label style="font-size:12px;font-weight:900">Review session <select id="reviewSession" class="btn" style="margin-left:6px"></select></label><button type="button" id="deleteSession" class="btn danger">Delete session</button></div><div class="scroll"><table class="table register"><thead id="regHead"></thead><tbody id="regBody"></tbody></table></div></div></section>
<section id="detail" class="card detail hidden"></section></main><script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');const $=x=>document.getElementById(x);let team,club,teamSettings={},teamFeatures={training:true},players=[],fixtures=[],lineups=[],events=[],subs=[],sessions=[],attendance=[],sortKey='minutes',sortDir=1;
const cols={apps:'Apps',starts:'Starts',minutes:'Minutes',avg:'Avg mins',goals:'Goals',assists:'Assists',ga:'G+A',yellow:'Yellow',red:'Red',trained:'Trained',trainingPct:'Training %',position:'Position'};
const presets={overview:['apps','starts','minutes','goals','assists','trained','trainingPct'],minutes:['apps','starts','minutes','avg'],performance:['apps','minutes','goals','assists','ga','yellow','red'],training:['trained','trainingPct'],custom:[]};let visible=JSON.parse(localStorage.getItem('fpa_player_cols')||'null')||presets.overview;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function monday(d){let x=new Date(d+'T12:00:00Z'),day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()-day+1);return x.toISOString().slice(0,10)}function fmt(d){return new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}function final(f){return ['completed','complete','finished','ft','full_time'].includes(String(f.status).toLowerCase())}
function filteredSessions(){if($('range').value==='season')return sessions;let n=+$('range').value,cut=new Date();cut.setDate(cut.getDate()-n*7);return sessions.filter(s=>new Date(s.session_date+'T12:00:00')>=cut)}
function stats(p){const fx=new Map(fixtures.map(f=>[f.id,f]));const pl=lineups.filter(x=>x.player_id===p.id&&fx.has(x.fixture_id)&&final(fx.get(x.fixture_id)));const apps=new Set(pl.map(x=>x.fixture_id)).size;const starts=new Set(pl.filter(x=>x.starter).map(x=>x.fixture_id)).size;let mins=0;pl.forEach(l=>{const f=fx.get(l.fixture_id);if(!final(f))return;let start=l.starter?0:null,end=(Number(teamSettings.period_count)||2)*(Number(teamSettings.period_minutes)||45);const on=subs.filter(s=>s.fixture_id===l.fixture_id&&s.player_on_id===p.id).sort((a,b)=>a.minute-b.minute)[0];const off=subs.filter(s=>s.fixture_id===l.fixture_id&&s.player_off_id===p.id).sort((a,b)=>a.minute-b.minute)[0];if(start===null&&on)start=on.minute;if(off)end=off.minute;if(start!==null)mins+=Math.max(0,end-start)});const pe=events.filter(e=>e.player_id===p.id);const goals=pe.filter(e=>e.event_type==='goal').length,assists=events.filter(e=>e.related_player_id===p.id&&e.event_type==='goal').length,yellow=pe.filter(e=>e.event_type==='yellow').length,red=pe.filter(e=>e.event_type==='red').length;const ss=filteredSessions(),ids=new Set(ss.map(s=>s.id)),aa=attendance.filter(a=>a.player_id===p.id&&ids.has(a.session_id)),trained=aa.filter(a=>a.status==='present').length,total=ss.length;return{apps,starts,minutes:mins,avg:apps?Math.round(mins/apps):0,goals,assists,ga:goals+assists,yellow,red,trained:trained+'/'+total,trainingPct:total?Math.round(trained/total*100):0,position:p.preferred_position||''}}
function renderPicker(){$('picker').innerHTML=Object.entries(cols).map(([k,v])=>'<label><input type="checkbox" data-col="'+k+'" '+(visible.includes(k)?'checked':'')+'> '+v+'</label>').join('')}
function render(){let rows=players.map(p=>({p,s:stats(p)}));rows.sort((a,b)=>{let av=a.s[sortKey],bv=b.s[sortKey];if(typeof av==='string')return String(av).localeCompare(String(bv))*sortDir;return ((av||0)-(bv||0))*sortDir});$('thead').innerHTML='<tr><th data-sort="name">Player</th>'+visible.map(k=>'<th data-sort="'+k+'">'+cols[k]+'</th>').join('')+'</tr>';$('tbody').innerHTML=rows.map(({p,s})=>'<tr><td><span class="pname" data-player="'+p.id+'">'+esc(p.display_name)+'</span><span class="sub">#'+esc(p.shirt_number??'–')+(p.preferred_position?' · '+esc(p.preferred_position):'')+'</span></td>'+visible.map(k=>'<td>'+esc(k==='trainingPct'?s[k]+'%':s[k])+'</td>').join('')+'</tr>').join('')||'<tr><td class="empty" colspan="20">No players in this team yet.</td></tr>';renderPicker()}
function renderRegister(){const ss=filteredSessions();const empty=$('trainingEmpty'),picker=$('reviewSession'),tools=$('sessionReviewTools');if(!players.length){empty.textContent='No players are in this squad yet. Add players above first, then they will appear here for attendance.';empty.classList.remove('hidden');tools.classList.add('hidden');$('regHead').innerHTML='';$('regBody').innerHTML='';return}if(!ss.length){empty.textContent='No training sessions yet. Add a session above to start taking attendance.';empty.classList.remove('hidden');tools.classList.add('hidden');$('regHead').innerHTML='';$('regBody').innerHTML='';return}empty.classList.add('hidden');tools.classList.remove('hidden');const previous=picker.value;picker.innerHTML=ss.map(s=>'<option value="'+s.id+'">'+fmt(s.session_date)+' · '+esc(s.title||'Training')+'</option>').join('');if(previous&&ss.some(s=>s.id===previous))picker.value=previous;const session=ss.find(s=>s.id===picker.value)||ss[0];picker.value=session.id;$('regHead').innerHTML='<tr><th>Player</th><th style="text-align:center">Attended</th></tr>';$('regBody').innerHTML=players.map(p=>{const a=attendance.find(x=>x.session_id===session.id&&x.player_id===p.id),checked=a?.status==='present';return '<tr><td><b>'+esc(p.display_name)+'</b></td><td style="text-align:center"><label class="attendanceCheck" title="'+esc(p.display_name)+' · '+fmt(session.session_date)+'"><input type="checkbox" data-session="'+session.id+'" data-player="'+p.id+'" '+(checked?'checked':'')+'><span>✓</span></label></td></tr>'}).join('')}
async function boot(){try{const ctx=await FootballPAContext.resolve();team=ctx.team;club=ctx.club;teamFeatures=ctx.features||teamFeatures;teamSettings=ctx.settings||{};if(ctx.preview)$('preview').classList.remove('hidden');$('clubName').textContent=club.name+' · '+(team.season_label||'');if(teamFeatures.training===false){document.querySelector('[data-tab="training"]')?.classList.add('hidden')}const calls=await Promise.all([sb.from('team_players').select('players(id,display_name,preferred_position,shirt_number)').eq('team_id',team.id).eq('active',true),sb.from('fixtures').select('*').eq('team_id',team.id),sb.from('training_sessions').select('*').eq('team_id',team.id).order('session_date',{ascending:false})]);for(const q of calls)if(q.error)throw q.error;players=(calls[0].data||[]).map(x=>x.players).filter(Boolean);fixtures=calls[1].data||[];sessions=calls[2].data||[];const ids=fixtures.map(x=>x.id),sids=sessions.map(x=>x.id);if(ids.length){const x=await Promise.all([sb.from('match_lineups').select('*').in('fixture_id',ids),sb.from('match_events').select('*').in('fixture_id',ids),sb.from('substitutions').select('*').in('fixture_id',ids)]);lineups=x[0].error?[]:(x[0].data||[]);events=x[1].error?[]:(x[1].data||[]);subs=x[2].error?[]:(x[2].data||[])}if(sids.length){const r=await sb.from('training_attendance').select('*').in('session_id',sids);attendance=r.error?[]:(r.data||[])}FootballPANav.mount({teamId:team.id});render();renderRegister()}catch(e){$('status').textContent='Could not load the squad: '+e.message;$('status').className='status bad'}}
$('toggleAddPlayer').onclick=()=>{$('addPlayerForm').classList.toggle('hidden');if(!$('addPlayerForm').classList.contains('hidden'))$('playerName').focus()};
$('savePlayer').onclick=async()=>{const name=$('playerName').value.trim();if(!name){$('manageMsg').textContent='Enter the player’s name.';return}const btn=$('savePlayer');btn.disabled=true;btn.textContent='Adding…';$('manageMsg').textContent='';try{const payload={club_id:team.club_id,display_name:name,preferred_position:$('playerPosition').value.trim()||null,shirt_number:$('playerNumber').value===''?null:Number($('playerNumber').value),active:true};let r=await sb.from('players').insert(payload).select('id,display_name,preferred_position,shirt_number').single();if(r.error)throw r.error;const p=r.data;r=await sb.from('team_players').insert({team_id:team.id,player_id:p.id,active:true}).select('id').single();if(r.error){await sb.from('players').update({active:false}).eq('id',p.id);throw r.error}players.push(p);$('playerName').value='';$('playerPosition').value='';$('playerNumber').value='';$('addPlayerForm').classList.add('hidden');$('manageMsg').textContent=p.display_name+' added to the squad.';render();renderRegister()}catch(e){$('manageMsg').textContent='Could not add player: '+e.message}finally{btn.disabled=false;btn.textContent='Add to squad'}};
$('choose').onclick=()=> $('picker').classList.toggle('hidden');$('picker').onchange=e=>{if(!e.target.dataset.col)return;visible=[...$('picker').querySelectorAll('input:checked')].map(x=>x.dataset.col);localStorage.setItem('fpa_player_cols',JSON.stringify(visible));$('preset').value='custom';render()};$('preset').onchange=e=>{if(e.target.value==='custom')return;visible=[...presets[e.target.value]];localStorage.setItem('fpa_player_cols',JSON.stringify(visible));render()};$('range').onchange=()=>{render();renderRegister()};$('thead').onclick=e=>{const k=e.target.closest('[data-sort]')?.dataset.sort;if(!k||k==='name')return;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}render()};function showPlayerTab(tab){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('squad').classList.toggle('hidden',tab!=='squad');$('training').classList.toggle('hidden',tab!=='training');$('detail').classList.add('hidden');if(tab==='squad')render();else renderRegister()}
document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.addEventListener('click',()=>showPlayerTab(b.dataset.tab)));
$('tbody').onclick=e=>{const id=e.target.closest('[data-player]')?.dataset.player;if(!id)return;const p=players.find(x=>x.id===id),s=stats(p);$('squad').classList.add('hidden');$('detail').classList.remove('hidden');$('detail').innerHTML='<button class="btn" id="backSquad">← Squad Dashboard</button><h2>'+esc(p.display_name)+'</h2><div class="muted">'+esc(p.preferred_position||'Player')+' · #'+esc(p.shirt_number??'–')+'</div><div class="stats">'+[['Apps',s.apps],['Starts',s.starts],['Minutes',s.minutes],['Goals',s.goals],['Assists',s.assists],['Training',s.trained+' · '+s.trainingPct+'%']].map(x=>'<div class="stat"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('')+'</div><div class="muted">This dashboard is fed from the team’s match and training records.</div>';$('backSquad').onclick=()=>{$('detail').classList.add('hidden');$('squad').classList.remove('hidden')}};
$('addSession').onclick=async()=>{const d=$('sessionDate').value,t=$('sessionTitle').value.trim()||'Training';if(!d){$('status').textContent='Choose a training date first.';$('status').className='status bad';return}const {data:{user}}=await sb.auth.getUser();const {data,error}=await sb.from('training_sessions').insert({team_id:team.id,session_date:d,title:t,created_by:user.id}).select().single();if(error){$('status').textContent=error.message;$('status').className='status bad';return}sessions.unshift(data);$('status').textContent='Training session added. Mark each player’s attendance below.';$('status').className='status ok';render();renderRegister();showPlayerTab('training')};
$('reviewSession').onchange=()=>renderRegister();
$('deleteSession').onclick=async()=>{const id=$('reviewSession').value,s=sessions.find(x=>x.id===id);if(!s)return;if(!confirm('Delete '+fmt(s.session_date)+' · '+(s.title||'Training')+'? This will also remove its attendance records.'))return;$('deleteSession').disabled=true;const {error:aerr}=await sb.from('training_attendance').delete().eq('session_id',id);if(aerr){$('status').textContent=aerr.message;$('status').className='status bad';$('deleteSession').disabled=false;return}const {error}=await sb.from('training_sessions').delete().eq('id',id).eq('team_id',team.id);$('deleteSession').disabled=false;if(error){$('status').textContent=error.message;$('status').className='status bad';return}sessions=sessions.filter(x=>x.id!==id);attendance=attendance.filter(x=>x.session_id!==id);$('status').textContent='Training session deleted.';$('status').className='status ok';render();renderRegister()};
$('regBody').onchange=async e=>{if(e.target.type!=='checkbox')return;const s=e.target.dataset.session,p=e.target.dataset.player;if(!s||!p)return;const checked=e.target.checked;e.target.disabled=true;if(!checked){const {error}=await sb.from('training_attendance').delete().eq('session_id',s).eq('player_id',p);if(error){e.target.checked=true;$('status').textContent=error.message;$('status').className='status bad'}else attendance=attendance.filter(a=>!(a.session_id===s&&a.player_id===p))}else{const {data:{user}}=await sb.auth.getUser();const {data,error}=await sb.from('training_attendance').upsert({session_id:s,player_id:p,status:'present',updated_by:user.id}).select().single();if(error){e.target.checked=false;$('status').textContent=error.message;$('status').className='status bad'}else{attendance=attendance.filter(a=>!(a.session_id===s&&a.player_id===p));attendance.push(data)}}render();renderRegister()};boot().catch(e=>{console.error('Players boot failed',e);$('status').textContent='Could not load the squad: '+e.message;$('status').className='status bad'});
</script><script>window.addEventListener('DOMContentLoaded',()=>FootballPANav.mount());</script></body></html>

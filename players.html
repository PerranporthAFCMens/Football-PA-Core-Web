<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f8">
<title>Players & Training · Football PA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/core-context.js"></script><script src="/core-nav.js"></script><link rel="stylesheet" href="/core-ui.css">
<style>
.page{display:grid;gap:12px}.hero{padding:17px}.hero h1{margin:0;font-size:25px}.hero .sub{margin-top:5px;color:var(--muted);font-size:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:14px;background:#e8eef4;border-radius:12px;padding:4px}.tabs button{border:0;border-radius:9px;background:transparent;padding:10px;font-weight:900;color:#657587;cursor:pointer}.tabs button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #10203314}
.card{padding:15px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionHead h2{margin:0;font-size:18px}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:#b42318}.btn:disabled{opacity:.55;cursor:not-allowed}
.addForm{display:grid;grid-template-columns:1fr 1fr 1fr 90px auto;gap:8px;margin-top:12px}.addForm input,.sessionTools input,.sessionSelect{min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;font:inherit}
.roster{margin-top:12px;border-top:1px solid #edf1f5}.playerRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f5}.playerName{font-weight:900}.playerMeta{font-size:11px;color:var(--muted);margin-top:2px}.rowActions{display:flex;gap:6px}
.sessionTools{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}.review{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-top:14px}.review label{display:grid;gap:6px;font-size:11px;font-weight:900;color:var(--muted);min-width:0;flex:1}.reviewActions{display:flex;gap:7px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px -15px 0;padding:12px 15px;background:#f8fafc;border-top:1px solid #edf1f5;border-bottom:1px solid #edf1f5}.summary div{text-align:center}.summary b{display:block;font-size:20px}.summary span{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.06em}
.register{width:100%;border-collapse:collapse}.register th,.register td{padding:12px 7px;border-bottom:1px solid #edf1f5}.register th{text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase}.register th:last-child,.register td:last-child{text-align:center;width:90px}.shirt{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#eef4fb;color:var(--blue);font-weight:900;margin-right:9px}.att{display:inline-flex;position:relative;width:40px;height:40px;align-items:center;justify-content:center}.att input{position:absolute;inset:0;width:40px;height:40px;opacity:0;z-index:2;cursor:pointer}.att span{display:flex;width:34px;height:34px;align-items:center;justify-content:center;border:2px solid #9aabba;border-radius:9px;background:#fff;color:transparent;font-size:20px;font-weight:900}.att input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}.att input:disabled+span{opacity:.55}.status{font-size:12px;padding:0 2px}.status.ok{color:#187747}.status.bad{color:#b42318}.empty{padding:22px 0;text-align:center;color:var(--muted)}.hidden{display:none!important}
@media(max-width:680px){.addForm{grid-template-columns:1fr 1fr}.addForm button{grid-column:1/-1}.sessionTools{grid-template-columns:1fr 1fr}.sessionTools button{grid-column:1/-1}.review{align-items:stretch;flex-direction:column}.reviewActions{width:100%}.reviewActions .btn{flex:1}.playerRow{grid-template-columns:1fr}.rowActions .btn{flex:1}.hero h1{font-size:23px}}
</style>
</head>
<body>
<main class="fpa-page">
<div id="loading" class="fpa-card" style="padding:28px;text-align:center">Loading players & training…</div>
<div id="app" class="page hidden">
<section class="fpa-card hero"><h1>Players & Training</h1><div id="teamLabel" class="sub"></div><div class="tabs"><button id="playersTab" class="active" type="button">Players</button><button id="trainingTab" type="button">Training log</button></div></section>
<div id="status" class="status"></div>
<section id="playersPanel" class="fpa-card card">
<div class="sectionHead"><div><h2>Manage squad</h2><div class="muted">Add, edit or remove players from this team.</div></div><button id="toggleAdd" class="btn primary">+ Add player</button></div>
<div id="addForm" class="addForm hidden"><input id="firstName" placeholder="First name" autocomplete="off"><input id="lastName" placeholder="Surname" autocomplete="off"><input id="position" placeholder="Position" autocomplete="off"><input id="shirtNumber" type="number" min="0" max="99" placeholder="No."><button id="savePlayer" class="btn primary">Add to squad</button></div>
<div id="roster" class="roster"></div>
</section>
<section id="trainingPanel" class="fpa-card card hidden">
<div class="sectionHead"><div><h2>Training log</h2><div class="muted">Create a session and mark attendance.</div></div></div>
<div id="sessionCreate" class="sessionTools"><input id="sessionDate" type="date" aria-label="Training date"><input id="sessionTitle" value="Training" aria-label="Session title"><button id="addSession" class="btn primary">+ Add session</button></div>
<div id="noSessions" class="empty hidden"></div>
<div id="sessionContent" class="hidden"><div class="review"><label>SESSION<select id="reviewSession" class="sessionSelect"></select></label><div id="reviewActions" class="reviewActions"><button id="selectAll" class="btn primary">Select all</button><button id="deleteSession" class="btn danger">Delete session</button></div></div><div id="summary" class="summary"></div><table class="register"><thead><tr><th>Player</th><th>Attended</th></tr></thead><tbody id="regBody"></tbody></table></div>
</section>
</div>
</main>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ctx,players=[],sessions=[],attendance=[],editingPlayerId=null;
const byShirt=(a,b)=>{const an=a.shirt_number,bn=b.shirt_number;if(an==null&&bn==null)return a.display_name.localeCompare(b.display_name);if(an==null)return 1;if(bn==null)return-1;return an-bn||a.display_name.localeCompare(b.display_name)};
const fmt=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
function status(t,type=''){const e=$('status');e.textContent=t;e.className='status '+type}
function setTab(tab){const training=tab==='training';$('playersTab').classList.toggle('active',!training);$('trainingTab').classList.toggle('active',training);$('playersPanel').classList.toggle('hidden',training);$('trainingPanel').classList.toggle('hidden',!training);if(training)renderTraining()}
function clearPlayerForm(){editingPlayerId=null;$('firstName').value='';$('lastName').value='';$('position').value='';$('shirtNumber').value='';$('savePlayer').textContent='Add to squad';$('addForm').classList.add('hidden')}
function renderRoster(){const rows=[...players].sort(byShirt);$('roster').innerHTML=rows.length?rows.map(p=>'<div class="playerRow"><div><div class="playerName">'+esc(p.display_name)+'</div><div class="playerMeta">#'+esc(p.shirt_number??'–')+(p.preferred_position?' · '+esc(p.preferred_position):'')+'</div></div><div class="rowActions">'+(ctx.canManage?'<button class="btn" data-edit="'+p.id+'">Edit</button><button class="btn danger" data-remove="'+p.id+'">Remove</button>':'')+'</div></div>').join(''):'<div class="empty">No players in this squad yet.</div>'}
function selectedSession(){return sessions.find(s=>s.id===$('reviewSession').value)||sessions[0]||null}
function renderTraining(){if(!sessions.length){$('sessionContent').classList.add('hidden');$('noSessions').textContent='No training sessions yet. Add one above to start the attendance log.';$('noSessions').classList.remove('hidden');return}$('noSessions').classList.add('hidden');$('sessionContent').classList.remove('hidden');const previous=$('reviewSession').value;$('reviewSession').innerHTML=sessions.map(s=>'<option value="'+s.id+'">'+fmt(s.session_date)+' · '+esc(s.title||'Training')+'</option>').join('');if(previous&&sessions.some(s=>s.id===previous))$('reviewSession').value=previous;const session=selectedSession();$('reviewSession').value=session.id;const rows=[...players].sort(byShirt),present=new Set(attendance.filter(a=>a.session_id===session.id&&a.status==='present').map(a=>a.player_id));$('summary').innerHTML='<div><b>'+rows.length+'</b><span>SQUAD</span></div><div><b>'+present.size+'</b><span>PRESENT</span></div><div><b>'+Math.max(0,rows.length-present.size)+'</b><span>NOT MARKED</span></div>';$('regBody').innerHTML=rows.map(p=>'<tr><td><span class="shirt">#'+esc(p.shirt_number??'–')+'</span><b>'+esc(p.display_name)+'</b></td><td><label class="att"><input type="checkbox" data-session="'+session.id+'" data-player="'+p.id+'" '+(present.has(p.id)?'checked':'')+' '+(!ctx.canManage?'disabled':'')+'><span>✓</span></label></td></tr>').join('');$('reviewActions').classList.toggle('hidden',!ctx.canManage);const all=rows.length>0&&present.size===rows.length;$('selectAll').disabled=all;$('selectAll').textContent=all?'All selected ✓':'Select all'}
async function load(){ctx=await FootballPAContext.resolve();FootballPANav.mount({teamId:ctx.team.id});$('teamLabel').textContent=ctx.club.name+' · '+ctx.team.name+' · '+(ctx.season?.label||ctx.team.season_label||'Current season');$('toggleAdd').classList.toggle('hidden',!ctx.canManage);$('sessionCreate').classList.toggle('hidden',!ctx.canManage);let pq=sb.from('team_players').select('players(id,display_name,first_name,last_name,preferred_position,shirt_number)').eq('team_id',ctx.team.id).eq('active',true);if(ctx.season?.id)pq=pq.eq('season_id',ctx.season.id);const [pr,sr]=await Promise.all([pq,sb.from('training_sessions').select('*').eq('team_id',ctx.team.id).order('session_date',{ascending:false})]);if(pr.error)throw pr.error;if(sr.error)throw sr.error;players=(pr.data||[]).map(x=>x.players).filter(Boolean);sessions=sr.data||[];const ids=sessions.map(s=>s.id);if(ids.length){const ar=await sb.from('training_attendance').select('*').in('session_id',ids);if(ar.error)throw ar.error;attendance=ar.data||[]}renderRoster();renderTraining();$('loading').classList.add('hidden');$('app').classList.remove('hidden');if(new URLSearchParams(location.search).get('view')==='training')setTab('training')}
$('playersTab').onclick=()=>setTab('players');$('trainingTab').onclick=()=>setTab('training');
$('toggleAdd').onclick=()=>{$('addForm').classList.toggle('hidden');if(!$('addForm').classList.contains('hidden'))$('firstName').focus()};
$('savePlayer').onclick=async()=>{if(!ctx.canManage)return;const first=$('firstName').value.trim(),last=$('lastName').value.trim();if(!first||!last){status('Enter the player’s first name and surname.','bad');return}const btn=$('savePlayer'),name=(first+' '+last).trim(),position=$('position').value.trim()||null,number=$('shirtNumber').value===''?null:Number($('shirtNumber').value);btn.disabled=true;btn.textContent='Saving…';try{if(editingPlayerId){const {data,error}=await sb.from('players').update({first_name:first,last_name:last,display_name:name,preferred_position:position,shirt_number:number,updated_at:new Date().toISOString()}).eq('id',editingPlayerId).select('id,display_name,first_name,last_name,preferred_position,shirt_number').single();if(error)throw error;players=players.map(p=>p.id===data.id?data:p);status(data.display_name+' updated.','ok')}else{let ex=await sb.from('players').select('id,display_name,first_name,last_name,preferred_position,shirt_number,active').eq('club_id',ctx.team.club_id).ilike('first_name',first).ilike('last_name',last).limit(1).maybeSingle();if(ex.error)throw ex.error;let p=ex.data;if(!p){const r=await sb.from('players').insert({club_id:ctx.team.club_id,first_name:first,last_name:last,display_name:name,preferred_position:position,shirt_number:number,active:true}).select('id,display_name,first_name,last_name,preferred_position,shirt_number,active').single();if(r.error)throw r.error;p=r.data}else if(!p.active){const r=await sb.from('players').update({active:true,first_name:first,last_name:last,display_name:name,preferred_position:position||p.preferred_position,shirt_number:number??p.shirt_number}).eq('id',p.id).select('id,display_name,first_name,last_name,preferred_position,shirt_number,active').single();if(r.error)throw r.error;p=r.data}let mq=sb.from('team_players').select('id,active').eq('team_id',ctx.team.id).eq('player_id',p.id);if(ctx.season?.id)mq=mq.eq('season_id',ctx.season.id);const membership=await mq.maybeSingle();if(membership.error)throw membership.error;if(membership.data){if(membership.data.active)throw new Error(p.display_name+' is already in this squad.');const r=await sb.from('team_players').update({active:true,updated_at:new Date().toISOString()}).eq('id',membership.data.id);if(r.error)throw r.error}else{const r=await sb.from('team_players').insert({team_id:ctx.team.id,player_id:p.id,season_id:ctx.season?.id||null,active:true});if(r.error)throw r.error}if(!players.some(x=>x.id===p.id))players.push(p);status(p.display_name+' added to the squad.','ok')}clearPlayerForm();renderRoster();renderTraining()}catch(e){status('Could not save player: '+e.message,'bad')}finally{btn.disabled=false;btn.textContent=editingPlayerId?'Save changes':'Add to squad'}};
$('roster').onclick=async e=>{const edit=e.target.closest('[data-edit]'),remove=e.target.closest('[data-remove]');if(edit){const p=players.find(x=>x.id===edit.dataset.edit);if(!p)return;editingPlayerId=p.id;$('firstName').value=p.first_name||'';$('lastName').value=p.last_name||'';$('position').value=p.preferred_position||'';$('shirtNumber').value=p.shirt_number??'';$('savePlayer').textContent='Save changes';$('addForm').classList.remove('hidden');$('firstName').focus();return}if(remove){const p=players.find(x=>x.id===remove.dataset.remove);if(!p||!confirm('Remove '+p.display_name+' from this squad?'))return;remove.disabled=true;let q=sb.from('team_players').update({active:false,updated_at:new Date().toISOString()}).eq('team_id',ctx.team.id).eq('player_id',p.id);if(ctx.season?.id)q=q.eq('season_id',ctx.season.id);const {error}=await q;if(error){status(error.message,'bad');remove.disabled=false;return}players=players.filter(x=>x.id!==p.id);status(p.display_name+' removed from this squad.','ok');renderRoster();renderTraining()}};
$('addSession').onclick=async()=>{if(!ctx.canManage)return;const d=$('sessionDate').value,t=$('sessionTitle').value.trim()||'Training';if(!d){status('Choose a training date first.','bad');return}const {data:{user}}=await sb.auth.getUser(),b=$('addSession');b.disabled=true;b.textContent='Adding…';const {data,error}=await sb.from('training_sessions').insert({team_id:ctx.team.id,session_date:d,title:t,created_by:user.id}).select().single();b.disabled=false;b.textContent='+ Add session';if(error){status(error.message,'bad');return}sessions.unshift(data);status('Training session added.','ok');renderTraining()};
$('reviewSession').onchange=renderTraining;
$('selectAll').onclick=async()=>{if(!ctx.canManage)return;const s=selectedSession();if(!s||!players.length)return;const b=$('selectAll');b.disabled=true;b.textContent='Saving…';const {data:{user}}=await sb.auth.getUser(),payload=players.map(p=>({session_id:s.id,player_id:p.id,status:'present',updated_by:user.id}));const {data,error}=await sb.from('training_attendance').upsert(payload).select();if(error){status(error.message,'bad');b.disabled=false;b.textContent='Select all';return}attendance=attendance.filter(a=>a.session_id!==s.id).concat(data||payload);status('Everyone marked present.','ok');renderTraining()};
$('deleteSession').onclick=async()=>{if(!ctx.canManage)return;const s=selectedSession();if(!s||!confirm('Delete '+fmt(s.session_date)+' · '+(s.title||'Training')+'? This also removes its attendance records.'))return;const b=$('deleteSession');b.disabled=true;let r=await sb.from('training_attendance').delete().eq('session_id',s.id);if(!r.error)r=await sb.from('training_sessions').delete().eq('id',s.id).eq('team_id',ctx.team.id);b.disabled=false;if(r.error){status(r.error.message,'bad');return}sessions=sessions.filter(x=>x.id!==s.id);attendance=attendance.filter(x=>x.session_id!==s.id);status('Training session deleted.','ok');renderTraining()};
$('regBody').onchange=async e=>{if(e.target.type!=='checkbox'||!ctx.canManage)return;const s=e.target.dataset.session,p=e.target.dataset.player,checked=e.target.checked;e.target.disabled=true;if(checked){const {data:{user}}=await sb.auth.getUser();const {data,error}=await sb.from('training_attendance').upsert({session_id:s,player_id:p,status:'present',updated_by:user.id}).select().single();if(error){e.target.checked=false;status(error.message,'bad')}else{attendance=attendance.filter(a=>!(a.session_id===s&&a.player_id===p));attendance.push(data)}}else{const {error}=await sb.from('training_attendance').delete().eq('session_id',s).eq('player_id',p);if(error){e.target.checked=true;status(error.message,'bad')}else attendance=attendance.filter(a=>!(a.session_id===s&&a.player_id===p))}e.target.disabled=false;renderTraining()};
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('/login.html')});load().catch(e=>{$('loading').innerHTML='<b>Could not load Players & Training.</b><br><span class="fpa-muted">'+esc(e.message)+'</span>'});
</script>
</body></html>

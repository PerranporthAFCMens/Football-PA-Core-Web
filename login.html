<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football PA Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1357A6;--ink:#102033;--muted:#6d7b8a;--line:#d9e3ec;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#e7eef6,#f8fafc 45%,#edf2f7);color:var(--ink)}.wrap{max-width:500px;margin:auto;padding:38px 16px 60px}.club-head{text-align:center;margin-bottom:20px}.club-badge{width:88px;height:88px;margin:0 auto 11px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:900;box-shadow:0 10px 26px #1357a630;object-fit:contain;padding:7px}.club-name{font-size:21px;font-weight:900}.club-sub{font-size:12px;color:var(--muted);margin-top:4px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 34px #173d6818}.card h1{margin:0 0 6px;font-size:25px}.muted{font-size:12px;color:var(--muted);line-height:1.45}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid #cfd9e3;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3f8;color:var(--ink)}.status{margin-top:14px;padding:11px 12px;border-radius:12px;background:#f5f8fb;font-size:12px;line-height:1.45}.bad{color:var(--bad)}.fpa-footer{text-align:center;margin-top:22px}.fpa-logo{width:88px;height:88px;object-fit:contain;display:block;margin:0 auto 5px}.tagline{font-size:11px;color:#768596}@media(max-width:520px){.wrap{padding-top:22px}.club-badge{width:78px;height:78px}.card{padding:18px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="club-head">
    <img id="clubBadge" class="club-badge" alt="Football PA">
    <div id="clubName" class="club-name">Football PA</div>
    <div id="clubSub" class="club-sub">Sign in to your team workspace</div>
  </div>
  <div class="card">
    <h1>Sign in</h1>
    <div class="muted">Use your Football PA account.</div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <div class="row"><button class="btn primary" id="signIn">Sign in</button><button class="btn secondary" id="signUp">Create account</button></div>
    <div id="status" class="status">Enter your details to continue.</div>
  </div>
  <div class="fpa-footer"><img class="fpa-logo" src="https://raw.githubusercontent.com/PerranporthAFCMens/Football-PA/main/football-pa-logo-dark.svg" alt="Football PA"><div class="tagline">Your digital football assistant</div></div>
</div>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);
const target=q.get('return')||'./index.html';
function msg(t,bad=false){$('status').textContent=t;$('status').className='status'+(bad?' bad':'')}
async function loadBrand(){
  const host=String(location.hostname||'').toLowerCase();
  const {data}=await sb.from('team_domains').select('team_name,club_name,badge_url,primary_colour').eq('hostname',host).eq('active',true).maybeSingle();
  if(!data){$('clubBadge').style.display='none';return}
  if(data.primary_colour)document.documentElement.style.setProperty('--blue',data.primary_colour);
  $('clubName').textContent=data.club_name||data.team_name||'Football PA';
  $('clubSub').textContent=data.team_name||'Team workspace';
  if(data.badge_url){$('clubBadge').src=data.badge_url;$('clubBadge').style.background='#fff'}else{$('clubBadge').style.display='none'}
}
async function existing(){const {data:{session}}=await sb.auth.getSession();if(session)location.replace(target)}
$('signIn').onclick=async()=>{const b=$('signIn');b.disabled=true;b.textContent='Signing in…';msg('Checking your account…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});b.disabled=false;b.textContent='Sign in';if(error)return msg('Login failed. Check your email and password.',true);location.replace(target)};
$('signUp').onclick=async()=>{const b=$('signUp');b.disabled=true;b.textContent='Creating…';const returnUrl=new URL('./login.html',location.href).href+'?return='+encodeURIComponent(target);const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:returnUrl}});b.disabled=false;b.textContent='Create account';if(error)return msg(error.message,true);if(data.session)location.replace(target);else msg('Account created. Check your email to confirm it, then return here and sign in.')};
loadBrand();existing();
</script></body></html>

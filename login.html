<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football PA Core Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1357A6;--ink:#102033;--muted:#6d7b8a;--line:#d9e3ec;--ok:#1f8f54;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#e7eef6,#f8fafc 45%,#edf2f7);color:var(--ink)}.wrap{max-width:560px;margin:auto;padding:28px 16px 60px}.club-head{text-align:center;margin-bottom:18px}.club-badge{width:86px;height:86px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(145deg,#1357A6,#2d89e4);color:#fff;display:grid;place-items:center;font-size:38px;font-weight:900;box-shadow:0 10px 26px #1357a630}.club-name{font-size:18px;font-weight:900}.club-sub{font-size:12px;color:var(--muted);margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 34px #173d6818}.card h1{margin:0 0 6px;font-size:25px}.muted{font-size:12px;color:var(--muted);line-height:1.45}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid #cfd9e3;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3f8;color:var(--ink)}.status{margin-top:14px;padding:11px 12px;border-radius:12px;background:#f5f8fb;font-size:12px;line-height:1.45}.ok{color:var(--ok)}.bad{color:var(--bad)}.hidden{display:none!important}.data{margin-top:16px;display:grid;gap:10px}.item{padding:12px;border:1px solid var(--line);border-radius:13px;background:#f9fbfd}.item b{display:block}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.tiny{font-size:11px;color:var(--muted)}.fpa-footer{text-align:center;margin-top:20px}.fpa-logo{width:116px;height:116px;object-fit:contain;display:block;margin:0 auto 6px}.tagline{font-size:11px;color:#768596}.dev-note{font-size:10px;color:#9aa6b2;margin-top:5px}@media(max-width:520px){.wrap{padding-top:18px}.club-badge{width:74px;height:74px;font-size:32px}.card{padding:18px}.fpa-logo{width:96px;height:96px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="club-head">
    <div class="club-badge" aria-label="Football PA">PA</div>
    <div class="club-name">Football PA</div>
    <div class="club-sub">Core development preview</div>
  </div>

  <div class="card" id="authCard">
    <h1>Sign in</h1>
    <div class="muted">Access your club's Football PA workspace.</div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Minimum 6 characters"></div>
    <div class="row"><button class="btn primary" id="signIn">Sign in</button><button class="btn secondary" id="signUp">Create account</button></div>
    <div id="status" class="status">Sign in with your Football PA account.</div>
  </div>

  <div class="card hidden" id="sessionCard">
    <div class="topline"><div><div class="tiny"><b>SIGNED IN</b></div><div id="who" class="muted"></div></div><button class="btn secondary" id="signOut">Sign out</button></div>
    <h1>You're in</h1>
    <div class="muted">You are signed in to Football PA Core.</div>
    <div class="row" style="grid-template-columns:1fr"><a id="openCore" class="btn primary" style="text-decoration:none;text-align:center" href="/">Open Core app</a></div>
  </div>

  <div class="fpa-footer">
    <img class="fpa-logo" src="https://raw.githubusercontent.com/PerranporthAFCMens/Football-PA/main/football-pa-logo-dark.svg" alt="Football PA">
    <div class="tagline">Less admin. More football.</div>
    <div class="dev-note">Core development environment</div>
  </div>
</div>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id);
function msg(t,bad=false){$('status').textContent=t;$('status').className='status '+(bad?'bad':'ok')}
async function loadData(){
  const {data:clubs,error:e1}=await sb.from('clubs').select('id,name,short_name,primary_colour').limit(5);if(e1)throw e1;
  const {data:teams,error:e2}=await sb.from('teams').select('id,name,season_label,club_id').limit(5);if(e2)throw e2;
  const {data:players,error:e3}=await sb.from('players').select('display_name').limit(30);if(e3)throw e3;
  const {data:fixtures,error:e4}=await sb.from('fixtures').select('opponent').limit(20);if(e4)throw e4;
  $('data').innerHTML=`<div class="item"><b>${clubs?.[0]?.name||'No club visible'}</b><span class="tiny">Club</span></div><div class="item"><b>${teams?.[0]?.name||'No team visible'}</b><span class="tiny">${teams?.[0]?.season_label||''}</span></div><div class="item"><b>${players.length} players visible</b><span class="tiny">Authenticated through Supabase</span></div><div class="item"><b>${fixtures.length} fixtures visible</b><span class="tiny">Core database</span></div>`;
}
async function renderSession(){const {data:{session}}=await sb.auth.getSession();if(session){$('authCard').classList.add('hidden');$('sessionCard').classList.remove('hidden');$('who').textContent=session.user.email;try{await loadData()}catch(err){$('data').innerHTML=`<div class="item bad"><b>Signed in, but data could not load.</b><span class="tiny">${err.message}</span></div>`}}else{$('authCard').classList.remove('hidden');$('sessionCard').classList.add('hidden')}}
$('signIn').onclick=async()=>{msg('Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message,true);await renderSession()};
$('signUp').onclick=async()=>{msg('Creating account…');const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return msg(error.message,true);if(data.session){await renderSession()}else msg('Account created. Check your email to confirm it, then return here and sign in.')};
$('signOut').onclick=async()=>{await sb.auth.signOut();await renderSession()};sb.auth.onAuthStateChange(()=>setTimeout(renderSession,0));renderSession();
</script>
</body></html>

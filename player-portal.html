<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1357A6">
<title>Football PA Player Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#15314a;--muted:#6d7d8d;--line:#dce5ed;--blue:#1357A6;--purple:#7142cf;--green:#218b22;--red:#b42318}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--ink)}button{font:inherit}.wrap{max-width:860px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px calc(40px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:11px;box-shadow:0 4px 14px #173a5010}.hero{display:flex;align-items:center;gap:11px}.badge{width:58px;height:58px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--line);padding:4px}.heroActions{margin-left:auto;display:flex;gap:7px}.iconBtn{min-width:41px;height:41px;border:1px solid var(--line);border-radius:50%;background:#e8eef3;color:var(--ink);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px;cursor:pointer}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}h1{font-size:22px;margin:0 0 3px}h2{font-size:18px;margin:0 0 11px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:11px}.tab{border:0;border-radius:10px;padding:11px 5px;background:#dce6ed;font-weight:800;color:var(--ink);cursor:pointer}.tab.active{background:var(--blue);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#f3f7fa;border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:10px;text-transform:uppercase;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f4}.row:last-child{border:0}.btn{border:0;border-radius:11px;min-height:47px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.btn.full{width:100%}.btn.purple{background:var(--purple)}.pay{background:#f4f0ff;border:1px solid #d8cdf7;border-radius:11px;padding:12px;margin:8px 0}.good{background:#e8f8ee;border:1px solid #b7e3c6;color:#176338;border-radius:10px;padding:11px}.due{background:#fff3e0;border:1px solid #f0d7ac;color:#8a5a00;border-radius:10px;padding:11px}.empty{background:#f4f6f7;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:11px}.fixture{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf1f4}.fixture:last-child{border:0}.score{font-weight:900;text-align:right}.status{padding:13px 14px}.loading{max-width:420px;margin:10vh auto}.identity{display:inline-flex;gap:6px;align-items:center;background:#eef4fb;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;color:var(--blue);margin-top:5px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.tabs{font-size:12px}.card{padding:13px}.heroActions{gap:4px}.badge{width:52px;height:52px}}
</style><script src="/core-nav.js"></script><link rel="stylesheet" href="/core-ui.css">
</head>
<body><div class="wrap fpa-page">
<div id="loading" class="card loading"><h2>Player Portal</h2><div class="muted">Logging in…</div></div>
<div id="app" class="hidden">
<div class="card hero"><img id="badge" class="badge" alt="Team"><div><h1 id="name">Player Portal</h1><div id="season" class="muted"></div><div id="identity" class="identity"></div></div><div class="heroActions"><button class="iconBtn" onclick="location.reload()" aria-label="Refresh">↻</button><button class="iconBtn" id="logout" aria-label="Sign out">⎋</button></div></div>
<div class="tabs"><button class="tab active" data-tab="stats">My Stats</button><button class="tab" data-tab="team">Team</button><button class="tab" data-tab="vote">Vote</button><button class="tab" data-tab="subs">Subs</button></div>
<section id="stats"><div class="card"><h2>My season</h2><div id="myStats"></div></div><div class="card"><h2>Recent team fixtures</h2><div id="recent"></div></div></section>
<section id="team" class="hidden"><div class="card"><h2>Team snapshot</h2><div id="teamStats"></div></div><div class="card"><h2>Fixtures</h2><div id="teamFixtures"></div></div></section>
<section id="vote" class="hidden"><div class="card"><h2>Match voting</h2><div id="voteBody"></div></div></section>
<section id="subs" class="hidden"><div class="card"><h2>My subs</h2><div id="subsBody"></div></div></section>
</div></div>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id);let D=null;
const money=p=>'£'+((Number(p)||0)/100).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isFinal(f){return ['ft','full_time','completed','complete','finished'].includes(String(f.status||'').toLowerCase())}
function fmtDate(v){return v?new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):''}
function statsHtml(x){return `<div class="stats"><div class="stat"><b>${x.appearances||0}</b><span>Apps</span></div><div class="stat"><b>${x.starts||0}</b><span>Starts</span></div><div class="stat"><b>${x.minutes||0}</b><span>Minutes</span></div><div class="stat"><b>${x.goals||0}</b><span>Goals</span></div><div class="stat"><b>${x.assists||0}</b><span>Assists</span></div><div class="stat"><b>${(x.goals||0)+(x.assists||0)}</b><span>G+A</span></div><div class="stat"><b>${x.yellows||0}</b><span>Yellows</span></div><div class="stat"><b>${x.reds||0}</b><span>Reds</span></div></div>`}
function fixtureHtml(f){const fin=isFinal(f),away=['away','a'].includes(String(f.venue||'').toLowerCase()),venue=away?'Away':['home','h'].includes(String(f.venue||'').toLowerCase())?'Home':'Neutral',ours=away?f.away_score:f.home_score,theirs=away?f.home_score:f.away_score;return `<div class="fixture"><div><b>${esc(f.opponent)}</b><div class="muted">${fmtDate(f.kick_off)} · ${esc(f.competition||'Fixture')} · ${venue}</div></div><div class="score">${fin&&ours!=null?esc(ours+'–'+theirs):'—'}<div class="muted">${fin?'FT':esc(f.status||'')}</div></div></div>`}
function render(){const p=D.player||{},t=D.team||{},c=D.club||{},s=D.season||{},st=D.stats||{},sub=D.subs||{},ts=D.team_stats||{},fix=D.recent_fixtures||[];if(t.badge_url)$('badge').src=t.badge_url;$('name').textContent=p.name||'Player Portal';$('season').textContent=(c.name||'Club')+' · '+(s.label||'');$('identity').textContent=(p.shirt_number?'#'+p.shirt_number+' · ':'')+(p.position||t.name||'Player');if(c.primary_colour)document.documentElement.style.setProperty('--blue',c.primary_colour);$('myStats').innerHTML=statsHtml(st);$('recent').innerHTML=fix.slice(0,4).map(fixtureHtml).join('')||'<div class="empty">No fixtures yet.</div>';$('teamStats').innerHTML=`<div class="stats"><div class="stat"><b>${ts.games||0}</b><span>Games</span></div><div class="stat"><b>${ts.wins||0}</b><span>Wins</span></div><div class="stat"><b>${ts.draws||0}</b><span>Draws</span></div><div class="stat"><b>${ts.losses||0}</b><span>Losses</span></div><div class="stat"><b>${ts.goals_for||0}</b><span>GF</span></div><div class="stat"><b>${ts.goals_against||0}</b><span>GA</span></div></div>`;$('teamFixtures').innerHTML=fix.map(fixtureHtml).join('')||'<div class="empty">No fixtures yet.</div>';renderVote();renderSubs(sub,st)}
function renderVote(){const v=D.vote;if(!v){$('voteBody').innerHTML='<div class="empty">There is no open vote at the moment.</div>';return}if(v.already_voted){$('voteBody').innerHTML=`<div class="good"><b>Vote submitted</b><div class="muted" style="margin-top:4px">${esc(v.title)}</div></div>`;return}$('voteBody').innerHTML=`<div class="pay"><b>${esc(v.title)}</b><div class="muted" style="margin-top:4px">Voting is open now.</div></div><button class="btn purple full" onclick="location.href='/voting.html'">Open voting</button>`}
function renderSubs(s,st){const clear=Number(s.outstanding_pence)<=0;const label=s.charge_model==='annual'?money(s.charge_amount_pence)+' annual':money(s.charge_amount_pence)+' per game';$('subsBody').innerHTML=`<div class="muted" style="margin-bottom:9px">${esc(label)}</div><div class="row"><span>Games charged</span><b>${s.charge_model==='annual'?'Annual':st.appearances||0}</b></div><div class="row"><span>Amount due</span><b>${money(s.amount_due_pence)}</b></div><div class="row"><span>Paid</span><b>${money(s.amount_paid_pence)}</b></div><div class="row"><span>Outstanding</span><b>${money(s.outstanding_pence)}</b></div><div class="${clear?'good':'due'}" style="margin-top:11px"><b>${clear?'All clear':'Payment outstanding'}</b><div class="muted" style="margin-top:4px">${clear?'You have no outstanding subs for this season.':'You currently owe '+money(s.outstanding_pence)+'.'}</div></div>`}
function tab(name){['stats','team','vote','subs'].forEach(x=>{$(x).classList.toggle('hidden',x!==name);document.querySelector(`[data-tab="${x}"]`).classList.toggle('active',x===name)})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('logout').onclick=async()=>{await sb.auth.signOut();location.replace('/login.html')};
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html');return}const {data,error}=await sb.rpc('get_my_player_portal');if(error){$('loading').innerHTML='<h2>Player Portal</h2><div class="muted">'+esc(error.message)+'</div><button class="btn full" style="margin-top:12px" onclick="location.href=\'/\'">Back to team</button>';return}D=data;FootballPANav.mount({teamId:D.team?.id});render();$('loading').classList.add('hidden');$('app').classList.remove('hidden')}
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('/login.html')});boot();
</script>
</body></html>

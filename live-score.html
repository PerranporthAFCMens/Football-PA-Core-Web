<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Live Score · Football PA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/core-nav.js"></script>
<style>
:root{--primary:#1357A6;--secondary:#fff;--navy:#102033;--muted:#667789;--line:#dce5ec;--green:#187747;--amber:#9a6700}*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 3px 16px #1020330d;margin-bottom:12px;overflow:hidden}.top{display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 78%,#08131f));color:#fff;border-bottom:4px solid var(--secondary)}.badge{width:56px;height:56px;border-radius:15px;background:#fff;object-fit:contain;padding:4px}.club{font-size:20px;font-weight:900}.small{font-size:12px;opacity:.85;margin-top:3px}.topActions{margin-left:auto;display:flex;align-items:center;gap:8px}.pill,.share{border-radius:999px;padding:8px 11px;font-weight:900;font-size:12px}.pill{background:#dff6e8;color:#12652f}.pill.ht{background:#fff1c7;color:#795800}.pill.ft,.pill.upcoming{background:#edf2f5;color:#42515c}.share{border:2px solid #fff;background:#ffffff18;color:#fff;cursor:pointer}.scoreHead{padding:11px 16px;text-align:center;background:color-mix(in srgb,var(--primary) 8%,#fff);border-bottom:1px solid var(--line);font-size:12px;font-weight:900;color:var(--primary);text-transform:uppercase;letter-spacing:.05em}.scoreBody{padding:22px 14px 17px}.scoreGrid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;text-align:center}.team{font-size:18px;font-weight:900;overflow-wrap:anywhere}.score{font-size:46px;line-height:1;font-weight:950;background:color-mix(in srgb,var(--primary) 8%,#fff);border:1px solid color-mix(in srgb,var(--primary) 20%,#fff);border-radius:16px;padding:10px 15px;white-space:nowrap}.minute{text-align:center;margin-top:10px;font-weight:900;color:var(--green)}.scorers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.scorer{padding:5px 0;border-bottom:1px solid #edf1f4;font-size:13px}.right{text-align:right}.updated{text-align:center;color:var(--muted);font-size:11px}.empty{padding:34px 18px;text-align:center}.empty b{display:block;font-size:20px;margin-bottom:6px}.error{color:#b42318}.hidden{display:none!important}@media(max-width:520px){.app{padding-left:7px;padding-right:7px}.card{border-radius:15px}.top{align-items:flex-start;flex-wrap:wrap}.badge{width:48px;height:48px}.club{font-size:18px}.topActions{width:100%;margin-left:0;justify-content:space-between}.scoreGrid{gap:6px}.team{font-size:15px}.score{font-size:38px;padding:9px 11px}.scoreBody{padding:18px 10px 14px}}
</style></head><body>
<main class="app">
<section id="top" class="card top hidden"><img id="badge" class="badge" alt=""><div><div id="club" class="club"></div><div id="team" class="small"></div></div><div class="topActions"><div id="statusPill" class="pill">LIVE</div><button id="shareBtn" class="share" type="button">↗ Share</button></div></section>
<section id="scoreCard" class="card hidden"><div id="competition" class="scoreHead"></div><div class="scoreBody"><div class="scoreGrid"><div id="homeTeam" class="team"></div><div id="score" class="score">0–0</div><div id="awayTeam" class="team"></div></div><div id="minute" class="minute"></div><div class="scorers"><div id="homeScorers"></div><div id="awayScorers" class="right"></div></div></div></section>
<section id="empty" class="card empty"><b>Loading live score…</b><span>Please wait.</span></section>
<div id="updated" class="updated"></div>
</main>
<script>
const ENDPOINT='https://hennzggqaquevqgiucqn.supabase.co/functions/v1/team-scoreboard',q=new URLSearchParams(location.search),token=q.get('token')||'',teamId=q.get('team')||'';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=null,tickTimer=null,pollTimer=null;
function phaseLabel(){const phase=String(data?.state?.phase||''),status=String(data?.fixture?.status||'').toLowerCase();if(status==='completed'||phase==='FULL-TIME')return'FULL TIME';if(phase==='HALF-TIME')return'HALF TIME';if(/^BREAK /.test(phase))return phase;if(status==='live')return phase||'LIVE';return'UPCOMING'}
function elapsed(){if(!data?.state)return 0;let sec=Number(data.state.elapsed_seconds||0);if(data.state.running&&data.state.updated_at)sec+=Math.max(0,Math.floor((Date.now()-new Date(data.state.updated_at).getTime())/1000));return sec}
function minuteText(){const status=String(data?.fixture?.status||'').toLowerCase();if(status==='completed'||data?.state?.phase==='FULL-TIME')return'Full time';if(status!=='live'){const ko=data?.fixture?.kick_off?new Date(data.fixture.kick_off):null;return ko?'Kick-off '+ko.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):''}const sec=elapsed();return Math.max(1,Math.floor(sec/60)+1)+"' · "+phaseLabel()}
function applyTheme(){const p=data?.club?.primary_colour||'#1357A6',s=data?.club?.secondary_colour||'#FFFFFF';document.documentElement.style.setProperty('--primary',p);document.documentElement.style.setProperty('--secondary',s);document.querySelector('meta[name="theme-color"]').setAttribute('content',p)}
function scorerRows(side){return(data?.scorers||[]).filter(x=>x.side===side&&x.name).map(x=>'<div class="scorer">'+esc(x.name)+' '+esc((x.minute??'')+(x.minute!=null?"'":''))+'</div>').join('')}
function render(){if(!data)return;if(!data.fixture){$('top').classList.remove('hidden');$('scoreCard').classList.add('hidden');$('empty').classList.remove('hidden');$('empty').innerHTML='<b>No match to show yet</b><span>The next fixture will appear here when available.</span>';return}applyTheme();$('top').classList.remove('hidden');$('scoreCard').classList.remove('hidden');$('empty').classList.add('hidden');$('club').textContent=data.club?.name||'Football PA';$('team').textContent=(data.team?.name||'Team')+' · Live Score';const badge=data.team?.badge_url||data.club?.badge_url||'';$('badge').src=badge;$('badge').style.visibility=badge?'visible':'hidden';$('competition').textContent=data.fixture.competition||'Match';$('homeTeam').textContent=data.fixture.home_name;$('awayTeam').textContent=data.fixture.away_name;$('score').textContent=(data.fixture.home_score??0)+'–'+(data.fixture.away_score??0);$('minute').textContent=minuteText();$('homeScorers').innerHTML=scorerRows('home');$('awayScorers').innerHTML=scorerRows('away');const phase=phaseLabel(),pill=$('statusPill');pill.textContent=phase;pill.className='pill '+(phase==='FULL TIME'?'ft':phase.includes('HALF')||phase.startsWith('BREAK')?'ht':String(data.fixture.status).toLowerCase()==='live'?'':'upcoming');$('updated').textContent='Updates automatically from Match Centre';}
async function load(){if(!token){$('empty').innerHTML='<b>Live score link unavailable</b><span>This link is missing its team scoreboard token.</span>';return}try{const r=await fetch(ENDPOINT+'?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Unable to load live score');data=j;render();if(teamId&&window.supabase&&window.FootballPANav){const sb=window.sb||supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');window.sb=sb;FootballPANav.mount({teamId})}}catch(e){$('empty').classList.remove('hidden');$('empty').innerHTML='<b class="error">Could not load live score</b><span>'+esc(e.message)+'</span>'}}
$('shareBtn').onclick=async()=>{const u=new URL(location.href);u.searchParams.delete('team');const payload={title:(data?.team?.name||'Football PA')+' Live Score',text:'Follow the live score',url:u.toString()};try{if(navigator.share)await navigator.share(payload);else{await navigator.clipboard.writeText(payload.url);const b=$('shareBtn'),t=b.textContent;b.textContent='✓ Link copied';setTimeout(()=>b.textContent=t,1600)}}catch(e){}};
tickTimer=setInterval(()=>{if(data)render()},1000);pollTimer=setInterval(load,5000);load();
</script></body></html>

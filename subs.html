<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football PA Subs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1357A6;--dark:#123b5d;--danger:#c62828;--green:#23811c;--bg:#f3f6f8;--line:#d8e0e6;--text:#17212b;--muted:#71808e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}button,input,select{font:inherit}.app{width:100%;max-width:720px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px max(24px,env(safe-area-inset-bottom))}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 5px #00000010;border:1px solid #e9eef2}.hero{display:flex;align-items:center;gap:12px}.badge{width:54px;height:54px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid #e3eaf0;padding:3px}h1{font-size:22px;margin:0;color:var(--dark)}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.btn{border:0;border-radius:12px;min-height:46px;padding:10px 13px;font-size:15px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}.btn.secondary{background:#e7edf2;color:#263746}.btn.green{background:var(--green)}.btn.danger{background:var(--danger)}.heroActions{margin-left:auto;display:flex;gap:6px}.homeBtn,.settingsBtn{min-height:38px;padding:7px 10px;font-size:12px}.subsSummary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.subsSummaryBox{background:#f5f8fa;border:1px solid #dfe7ed;border-radius:12px;padding:12px;text-align:center}.subsSummaryBox b{display:block;font-size:24px;color:var(--dark)}.subsViewTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.subsViewTabs .btn{min-height:42px;padding:8px;font-size:13px}.subsViewTabs .btn.active{background:var(--blue);color:#fff}.subsPlayer{border:1px solid #e0e7ed;border-radius:12px;margin:9px 0;background:#fff;overflow:hidden}.subsPlayer summary{padding:12px;cursor:pointer;font-weight:800;list-style:none}.subsPlayer summary::-webkit-details-marker{display:none}.subsPlayerBody{padding:0 12px 12px}.subsStatus{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.subsStatus.paid{background:#e5f6e8;color:#19752b}.subsStatus.owed{background:#fdeaea;color:#a42121}.subsDebtorRow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f4}.subsDebtorRow:last-child{border-bottom:0}.subsOwedAmt{font-size:20px;font-weight:800;white-space:nowrap}.subsMini{font-size:12px;color:#6b7b89;margin-top:3px}.matchRow{padding:11px 0;border-bottom:1px solid #edf1f4}.matchRow:last-child{border-bottom:0}.matchPlayers{font-size:12px;color:#6b7b89;margin-top:5px;line-height:1.45}.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}.loadingInline{padding:14px 0;color:var(--muted);font-size:13px}.empty{background:#f6f9fb;border:1px solid #e4ebf0;border-radius:12px;padding:14px;color:var(--muted);font-size:13px}.status{padding:12px;font-size:13px}.status.bad{color:var(--danger)}.modal{position:fixed;inset:0;background:#071a2d99;display:grid;place-items:center;padding:16px;z-index:30}.modalCard{background:#fff;border-radius:16px;padding:16px;width:min(100%,430px);box-shadow:0 16px 50px #0003}.modalCard h2{margin-bottom:3px}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.history{margin-top:14px;border-top:1px solid #edf1f4;padding-top:10px}.historyRow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f0f3f5;font-size:12px}.historyRow:last-child{border-bottom:0}
@media(max-width:520px){.app{max-width:none;padding:max(7px,env(safe-area-inset-top)) 7px max(18px,env(safe-area-inset-bottom))}.card{border-radius:13px;padding:11px}.hero{gap:9px}.badge{width:46px;height:46px}h1{font-size:20px}.btn{min-height:45px;padding:9px 10px;font-size:14px}.subsViewTabs{grid-template-columns:1fr 1fr}.homeBtn,.settingsBtn{font-size:11px;padding:7px 8px}}
</style>
<script src="/core-nav.js"></script></head>
<body>
<div class="app">
  <div class="card hero">
    <img class="badge" src="/Club_Logo.png" alt="Club logo">
    <div><h1 id="title">Subs Tracker</h1><div id="seasonLine" class="muted">Loading…</div></div>
    <div class="heroActions"><button class="btn secondary homeBtn" onclick="location.href='/'">Home</button><button class="btn secondary settingsBtn" onclick="location.href='/admin-console.html'">⚙</button></div>
  </div>
  <div id="loading" class="card status">Loading subs tracker…</div>
  <div id="appBody" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h2>Subs Tracker</h2><div id="configText" class="muted"></div></div></div>
      <div id="subsSummary" style="margin:12px 0"></div>
      <div class="subsViewTabs">
        <button class="btn active" data-tab="confirm">Confirm</button>
        <button class="btn secondary" data-tab="player">By Player</button>
        <button class="btn secondary" data-tab="match">By Match</button>
        <button class="btn secondary" data-tab="owed">Amounts Owed</button>
      </div>
      <div id="confirmView"></div>
      <div id="playerView" class="hidden"></div>
      <div id="matchView" class="hidden"></div>
      <div id="owedView" class="hidden"></div>
    </div>
  </div>
</div>
<div id="modal" class="modal hidden"><div class="modalCard"><h2>Record payment</h2><div id="payPlayer" class="muted"></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal"></div><div class="field"><label>Method</label><select id="method"><option value="">Not specified</option><option>Bank transfer</option><option>Cash</option><option>Card</option><option>Other</option></select></div><div class="field"><label>Note (optional)</label><input id="note" placeholder="Reference or note"></div><div class="grid2"><button id="cancelPay" class="btn secondary">Cancel</button><button id="savePay" class="btn green">Save payment</button></div><div id="payStatus" class="muted" style="margin-top:9px"></div><div class="history"><b style="font-size:12px">Recent payments</b><div id="historyRows" class="muted" style="margin-top:5px">Loading…</div></div></div></div>
<script>
const sb=supabase.createClient('https://hennzggqaquevqgiucqn.supabase.co','sb_publishable_3ibkYwM0fFdHgKdGFIN5cQ_BT_WudUW');
const $=id=>document.getElementById(id);let club,team,season,rows=[],fixtures=[],lineups=[],payments=[],selected=null,currentTab='confirm';
const money=p=>'£'+((Number(p)||0)/100).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(t,bad=false){$('loading').textContent=t;$('loading').className='card status'+(bad?' bad':'')}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html');return}try{let r=await sb.from('clubs').select('id,name,primary_colour').limit(1);if(r.error)throw r.error;club=r.data?.[0];r=await sb.from('teams').select('id,name,club_id').eq('club_id',club.id).order('name').limit(1);if(r.error)throw r.error;team=r.data?.[0];r=await sb.from('seasons').select('id,label,active').eq('club_id',club.id).eq('active',true).limit(1);if(r.error)throw r.error;season=r.data?.[0];if(club?.primary_colour)document.documentElement.style.setProperty('--blue',club.primary_colour);await reloadAll();$('title').textContent=(team?.name||'Team')+' Subs';$('seasonLine').textContent=(club?.name||'Club')+' · '+(season?.label||'');$('loading').classList.add('hidden');$('appBody').classList.remove('hidden')}catch(e){status(e.message,true)}}
async function reloadAll(){let r=await sb.rpc('get_subs_dashboard',{p_team_id:team.id,p_season_id:season.id});if(r.error)throw r.error;rows=r.data||[];const cfg=rows[0];$('configText').textContent=cfg?(cfg.charge_model==='annual'?money(cfg.charge_amount_pence)+' annual':money(cfg.charge_amount_pence)+' per game · based on matches played'):'No subs configuration';r=await sb.from('fixtures').select('id,opponent,kick_off,status').eq('team_id',team.id).eq('season_id',season.id).order('kick_off',{ascending:false});if(!r.error)fixtures=r.data||[];r=await sb.from('match_lineups').select('fixture_id,player_id,starter').in('fixture_id',fixtures.map(f=>f.id));if(!r.error)lineups=r.data||[];r=await sb.from('subs_payments').select('player_id,amount_pence,paid_at,method,note').eq('team_id',team.id).eq('season_id',season.id).order('paid_at',{ascending:false});if(!r.error)payments=r.data||[];renderAll()}
function renderAll(){const totalDue=rows.reduce((s,r)=>s+Number(r.amount_due_pence),0),totalPaid=rows.reduce((s,r)=>s+Number(r.amount_paid_pence),0),out=rows.reduce((s,r)=>s+Number(r.outstanding_pence),0);$('subsSummary').innerHTML=`<div class="subsSummary"><div class="subsSummaryBox"><b>${money(out)}</b><span class="muted">currently due to pay</span></div><div class="subsSummaryBox"><b>${money(totalPaid)}</b><span class="muted">payments received</span></div></div>`;renderConfirm();renderPlayers();renderMatches();renderOwed();setTab(currentTab)}
function renderConfirm(){const due=rows.filter(r=>Number(r.outstanding_pence)>0).sort((a,b)=>Number(b.outstanding_pence)-Number(a.outstanding_pence));$('confirmView').innerHTML=due.length?due.map(r=>`<div class="subsPlayer" style="padding:12px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><b>${esc(r.display_name)}</b><div class="subsMini">${r.charge_model==='annual'?'Annual charge':r.appearances+' match'+(Number(r.appearances)===1?'':'es')} · paid ${money(r.amount_paid_pence)}</div></div><span class="subsStatus owed">Owes ${money(r.outstanding_pence)}</span></div><button class="btn green" style="width:100%;margin-top:10px" data-pay="${r.player_id}">Record payment</button></div>`).join(''):'<div class="empty">Everything is paid up.</div>'}
function renderPlayers(){const q='';$('playerView').innerHTML='<input id="playerSearch" class="search" placeholder="Search players…">'+rows.map(r=>{const ps=payments.filter(p=>p.player_id===r.player_id);const clear=Number(r.outstanding_pence)<=0;return `<details class="subsPlayer" data-name="${esc(r.display_name.toLowerCase())}"><summary><div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(r.display_name)}</span><span class="subsStatus ${clear?'paid':'owed'}">${clear?'Paid':money(r.outstanding_pence)+' due'}</span></div><div class="subsMini">${r.charge_model==='annual'?'Annual':r.appearances+' games'} · Due ${money(r.amount_due_pence)} · Paid ${money(r.amount_paid_pence)}</div></summary><div class="subsPlayerBody">${ps.length?ps.map(p=>`<div class="historyRow"><div>${new Date(p.paid_at).toLocaleDateString('en-GB')}<div class="subsMini">${esc(p.method||'Payment')}${p.note?' · '+esc(p.note):''}</div></div><b>${money(p.amount_pence)}</b></div>`).join(''):'<div class="empty">No payments recorded yet.</div>'}${!clear?`<button class="btn green" style="width:100%;margin-top:9px" data-pay="${r.player_id}">Record payment</button>`:''}</div></details>`}).join('');setTimeout(()=>{const s=$('playerSearch');if(s)s.oninput=()=>document.querySelectorAll('#playerView details').forEach(d=>d.classList.toggle('hidden',!d.dataset.name.includes(s.value.toLowerCase())))},0)}
function renderMatches(){const complete=fixtures.filter(f=>['ft','full_time','completed','complete','finished'].includes(String(f.status||'').toLowerCase()));$('matchView').innerHTML=complete.length?complete.map(f=>{const ids=[...new Set(lineups.filter(l=>l.fixture_id===f.id&&l.starter).map(l=>l.player_id))];const names=ids.map(id=>rows.find(r=>r.player_id===id)?.display_name).filter(Boolean);return `<div class="matchRow"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(f.opponent)}</b><span class="subsStatus paid">${new Date(f.kick_off).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></div><div class="subsMini">${names.length} charged player${names.length===1?'':'s'}</div><div class="matchPlayers">${names.length?esc(names.join(', ')):'No recorded starters.'}</div></div>`}).join(''):'<div class="empty">No completed matches yet.</div>'}
function renderOwed(){const due=rows.filter(r=>Number(r.outstanding_pence)>0).sort((a,b)=>Number(b.outstanding_pence)-Number(a.outstanding_pence));$('owedView').innerHTML=due.length?due.map(r=>`<div class="subsDebtorRow"><div><b>${esc(r.display_name)}</b><div class="subsMini">Due ${money(r.amount_due_pence)} · Paid ${money(r.amount_paid_pence)}</div></div><div class="subsOwedAmt">${money(r.outstanding_pence)}</div></div>`).join(''):'<div class="empty">No outstanding balances.</div>'}
function setTab(tab){currentTab=tab;['confirm','player','match','owed'].forEach(v=>{const pane=$(v+'View');pane.classList.toggle('hidden',v!==tab);document.querySelectorAll(`[data-tab="${v}"]`).forEach(b=>{b.classList.toggle('active',v===tab);b.classList.toggle('secondary',v!==tab)})})}
document.addEventListener('click',async e=>{const tab=e.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return}const b=e.target.closest('[data-pay]');if(!b)return;selected=rows.find(r=>r.player_id===b.dataset.pay);if(!selected)return;$('payPlayer').textContent=selected.display_name+' · outstanding '+money(selected.outstanding_pence);$('amount').value=(Number(selected.outstanding_pence)/100).toFixed(2);$('method').value='';$('note').value='';$('payStatus').textContent='';$('modal').classList.remove('hidden');renderHistory()});
function renderHistory(){const ps=payments.filter(p=>p.player_id===selected.player_id).slice(0,5);$('historyRows').innerHTML=ps.length?ps.map(p=>`<div class="historyRow"><div>${new Date(p.paid_at).toLocaleDateString('en-GB')}<div class="subsMini">${esc(p.method||'Payment')}${p.note?' · '+esc(p.note):''}</div></div><b>${money(p.amount_pence)}</b></div>`).join(''):'No payments recorded yet.'}
$('cancelPay').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};$('savePay').onclick=async()=>{if(!selected)return;const pounds=Number($('amount').value);if(!Number.isFinite(pounds)||pounds<=0){$('payStatus').textContent='Enter a valid payment amount.';return}const pence=Math.round(pounds*100);$('savePay').disabled=true;$('savePay').textContent='Saving…';const {error}=await sb.rpc('record_subs_payment',{p_team_id:team.id,p_season_id:season.id,p_player_id:selected.player_id,p_amount_pence:pence,p_method:$('method').value,p_note:$('note').value.trim()});$('savePay').disabled=false;$('savePay').textContent='Save payment';if(error){$('payStatus').textContent=error.message;return}$('modal').classList.add('hidden');await reloadAll()};sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('/login.html')});boot();
</script>
<script>window.addEventListener('DOMContentLoaded',()=>FootballPANav.mount());</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football PA Subs Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./core-client.js"></script>
<style>
:root{--blue:#1357A6;--green:#218a35;--red:#b42318;--purple:#6f42c1;--ink:#17212b;--muted:#708090;--line:#dce5ec;--bg:#eef3f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--ink)}
button,select,input{font:inherit}.app{width:min(780px,100%);margin:auto;padding:12px 10px 38px}.hidden{display:none!important}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 5px 16px #173a5010}
h2,h3{margin:0}h2{font-size:20px}.muted{color:var(--muted);font-size:12px;line-height:1.4}.status{padding:14px}.bad{color:var(--red)}
.summaryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.summaryBox{background:#f5f8fb;border:1px solid #dce5ec;border-radius:14px;padding:13px;text-align:center}
.summaryBox b{display:block;font-size:25px;color:#173b5a}.summaryBox span{display:block;margin-top:3px;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.04em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 14px}.tab{min-height:44px;border:0;border-radius:12px;background:#e8eef3;color:#2b3d4c;font-weight:850;cursor:pointer;padding:8px}.tab.active{background:var(--blue);color:#fff}
.picker{width:100%;min-height:49px;border:1px solid #ccd9e3;border-radius:12px;background:#fff;padding:10px 12px;font-size:16px}
.file{margin-top:11px;border:1px solid #dce5ec;border-radius:15px;background:#fff;overflow:hidden}.fileHead{padding:14px;background:linear-gradient(145deg,#f9fbfd,#f2f7fb);border-bottom:1px solid #e4ebf0}
.fileHeadTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.fileHead h3{font-size:18px}.bigMoney{font-size:24px;font-weight:900;white-space:nowrap}.fileBody{padding:0 13px 13px}
.row{padding:12px 0;border-bottom:1px solid #edf1f4}.row:last-child{border-bottom:0}.rowTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.matchName{font-weight:850}.mini{font-size:11px;color:#71808e;margin-top:3px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850;white-space:nowrap}.paid{background:#e7f7eb;color:#176b2f}.owed{background:#fdeaea;color:#a42121}.claim{background:#fff3d5;color:#8b6300}.na{background:#edf1f4;color:#61717f}.unknown{background:#eef4fb;color:#315d84}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:11px;min-height:39px;padding:8px 11px;font-weight:850;cursor:pointer;background:var(--blue);color:#fff}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.secondary{background:#e8eef3;color:#2f4252}.btn.purple{background:var(--purple)}.btn.full{width:100%}.btn:disabled{opacity:.55}
.payBox{margin:12px 0;padding:12px;border-radius:13px;background:#f5efff;border:1px solid #dfd1f4}.payBoxTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.payBox b{font-size:16px}
.debtor{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #edf1f4;cursor:pointer}.debtor:last-child{border-bottom:0}.debtorAmount{font-size:18px;font-weight:900}
.empty{padding:13px;border:1px solid #e3e9ee;border-radius:12px;background:#f7f9fb;color:var(--muted);font-size:12px}.success{padding:13px;border:1px solid #bfe2c8;border-radius:12px;background:#eaf8ee;color:#1f6b33}
.sectionTitle{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:9px}.sectionTitle h3{font-size:15px}.sectionTitle span{font-size:11px;color:var(--muted)}
.monzo{margin-bottom:14px}.monzoRow{padding:12px 0;border-bottom:1px solid #edf1f4}.monzoRow:last-child{border-bottom:0}.monzoRow select{min-height:42px;margin-top:8px}.remember{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12px;color:#40515f}.monzo details{margin-top:10px;font-size:12px}.monzo summary{cursor:pointer;color:#315d84;font-weight:800}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#152433;color:#fff;padding:10px 14px;border-radius:999px;font-weight:800;font-size:12px;z-index:100;display:none;box-shadow:0 8px 25px #0003}
@media(max-width:560px){.app{padding:8px 7px 30px}.card{padding:13px;border-radius:15px}.summaryGrid{gap:5px}.summaryBox{padding:11px 5px}.summaryBox b{font-size:21px}.summaryBox span{font-size:8px}.tabs{gap:5px}.tab{font-size:12px}.actions .btn{flex:1;min-width:86px;font-size:12px}.fileHead{padding:12px}}
</style>
<script src="./core-context.js"></script>
<script src="./core-nav.js"></script>
<link rel="stylesheet" href="./core-ui.css">
</head>
<body>
<div class="app fpa-page">
  <div id="loading" class="card status">Loading Subs Tracker…</div>
  <div id="appBody" class="hidden">
    <div class="card">
      <div><h2>Subs Tracker</h2><div id="configText" class="muted" style="margin-top:4px"></div></div>
      <div id="summary" class="summaryGrid"></div>
      <div class="tabs">
        <button class="tab active" data-tab="summary">Summary</button>
        <button class="tab" data-tab="player">By Player</button>
        <button class="tab" data-tab="match">By Match</button>
      </div>
      <section id="summaryView">
        <div id="monzoBlock" class="monzo"></div>
        <div class="sectionTitle"><h3>Outstanding</h3><span>Tap a player to open their file</span></div>
        <div id="nextSubsMatch" style="margin-bottom:14px"></div>
        <div id="outstandingList"></div>
        <div id="claimBlock" style="margin-top:12px"></div>
      </section>
      <section id="playerView" class="hidden">
        <select id="playerPicker" class="picker"><option value="">Select player…</option></select>
        <div id="playerFile"></div>
      </section>
      <section id="matchView" class="hidden">
        <select id="matchPicker" class="picker"><option value="">Select match…</option></select>
        <div id="matchFile"></div>
      </section>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const sb=FootballPAClient;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=p=>'£'+((Number(p)||0)/100).toFixed(2);
const fmt=v=>v?new Date(v).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'Date TBC';
const pageQuery=new URLSearchParams(location.search),requestedFixture=pageQuery.get('fixture')||'';
let club,team,season,M={pending:[],recent:[],aliases:[]},D={players:[],matches:[],roster:[],summary:{}},tab=requestedFixture?'match':'summary',selectedPlayer='',selectedMatch=requestedFixture,busy=false;

function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2200)}
function pillClass(s){if(s==='Confirmed Paid')return'paid';if(s==='Claims Paid')return'claim';if(s==='Not Paid'||s==='Unconfirmed')return'owed';if(s==='N/A')return'na';return'unknown'}
function fixtureLabel(m){return fmt(m.kick_off)+' · '+m.opponent+(m.venue?' · '+String(m.venue).toUpperCase():'')}
function statusButtons(fixtureId,playerId,status){
  const f=esc(fixtureId),p=esc(playerId);
  if(status==='Confirmed Paid')return '<button class="btn secondary" data-status="reset" data-fixture="'+f+'" data-player="'+p+'">Undo paid</button>';
  return '<button class="btn green" data-status="confirmed_paid" data-fixture="'+f+'" data-player="'+p+'">Received</button><button class="btn red" data-status="not_paid" data-fixture="'+f+'" data-player="'+p+'">Not received</button><button class="btn secondary" data-status="na" data-fixture="'+f+'" data-player="'+p+'">N/A</button>';
}
async function boot(){
  try{
    const ctx=await FootballPAContext.resolve();club=ctx.club;team=ctx.team;FootballPANav.mount({teamId:team.id});
    if(club?.primary_colour)document.documentElement.style.setProperty('--blue',club.primary_colour);
    let r=await sb.from('seasons').select('id,label,active').eq('club_id',club.id).eq('label',team.season_label).maybeSingle();
    if(r.error)throw r.error;season=r.data;
    if(!season){r=await sb.from('seasons').select('id,label,active').eq('club_id',club.id).eq('active',true).limit(1).maybeSingle();if(r.error)throw r.error;season=r.data}
    if(!season)throw new Error('No active season is configured for this team.');
    await reload();$('loading').classList.add('hidden');$('appBody').classList.remove('hidden');
  }catch(e){$('loading').textContent=e.message;$('loading').classList.add('bad')}
}
async function reload(){
  const r=await sb.rpc('get_subs_tracker_v2',{p_team_id:team.id,p_season_id:season.id});
  if(r.error)throw r.error;D=r.data||{players:[],matches:[],roster:[],summary:{}};
  // Monzo payments are optional: if the feature is not set up, the block stays empty.
  const mr=await sb.rpc('list_monzo_payments',{p_team_id:team.id});M=mr.error?{pending:[],recent:[],aliases:[]}:(mr.data||{pending:[],recent:[],aliases:[]});
  $('configText').textContent=money(D.charge_amount_pence)+' per game · payments tracked against each fixture';
  renderAll();
}
function renderAll(){renderMonzo();renderSummary();renderPickers();renderPlayer();renderMatch();setTab(tab)}
const OWED=['Not Paid','Unconfirmed','Claims Paid'];
function teamPlayers(){
  const map=new Map();(D.roster||[]).forEach(r=>map.set(r.player_id,r.name));(D.players||[]).forEach(p=>{if(!map.has(p.player_id))map.set(p.player_id,p.name)});
  return [...map].map(([player_id,name])=>({player_id,name})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
}
// Which games a Monzo payment pays for: the player's oldest unpaid games first, then upcoming games.
function monzoPlan(pay){
  const charge=Number(D.charge_amount_pence)||0;
  if(!charge||!pay.player_id)return{fixtures:[],leftover:Number(pay.amount_pence)||0};
  let games=Math.floor(Number(pay.amount_pence)/charge);
  const p=(D.players||[]).find(x=>x.player_id===pay.player_id);
  const owed=(p?.matches||[]).filter(m=>OWED.includes(m.status)).sort((a,b)=>new Date(a.kick_off)-new Date(b.kick_off));
  const picked=owed.slice(0,games).map(m=>({id:m.fixture_id,label:fmt(m.kick_off)+' '+m.opponent}));
  if(picked.length<games){
    const have=new Set(picked.map(x=>x.id));
    const upcoming=(D.matches||[]).filter(m=>new Date(m.kick_off).getTime()>=Date.now()&&!have.has(m.fixture_id)).sort((a,b)=>new Date(a.kick_off)-new Date(b.kick_off));
    for(const m of upcoming){if(picked.length>=games)break;const st=(m.players||[]).find(x=>x.player_id===pay.player_id)?.status;if(st==='Confirmed Paid'||st==='N/A')continue;picked.push({id:m.fixture_id,label:fmt(m.kick_off)+' '+m.opponent+' (upcoming)'})}
  }
  return{fixtures:picked,leftover:Number(pay.amount_pence)-picked.length*charge};
}
function monzoWho(pay){return money(pay.amount_pence)+' from '+(pay.payer_name||'unknown payer')+' · '+fmt(pay.received_at)+(pay.reference?' · “'+pay.reference+'”':'')}
function renderMonzo(){
  const host=$('monzoBlock');
  if(!M.connected&&!(M.pending||[]).length){host.innerHTML='';return}
  const pending=M.pending||[],matched=pending.filter(p=>p.status==='matched');
  const options=teamPlayers().map(p=>'<option value="'+esc(p.player_id)+'">'+esc(p.name)+'</option>').join('');
  const rows=pending.map(pay=>{
    const id=esc(pay.id);
    if(pay.status==='matched'){
      const plan=monzoPlan(pay);
      const covers=plan.fixtures.length?'Pays for '+plan.fixtures.map(f=>f.label).join(', '):'No unpaid games to put this against';
      return '<div class="monzoRow"><div class="rowTop"><div><div class="matchName">'+esc(pay.player_name||'Player')+'</div><div class="mini">'+esc(monzoWho(pay))+'</div><div class="mini">'+esc(covers)+(plan.leftover>0?' · '+money(plan.leftover)+' left over':'')+'</div></div><span class="pill paid">'+(pay.match_method==='manual'||pay.match_method==='alias'?'Known payer':'Name match')+'</span></div><div class="actions"><button class="btn green" data-monzo-apply="'+id+'">Apply</button><button class="btn secondary" data-monzo-change="'+id+'">Wrong player</button><button class="btn secondary" data-monzo-ignore="'+id+'">Not subs</button></div></div>';
    }
    return '<div class="monzoRow"><div class="rowTop"><div><div class="matchName">Who is this from?</div><div class="mini">'+esc(monzoWho(pay))+'</div></div><span class="pill claim">Needs a player</span></div><select class="picker" id="monzoPick_'+id+'"><option value="">Choose player…</option>'+options+'</select><label class="remember"><input type="checkbox" id="monzoRemember_'+id+'" checked> Remember this payer for next time</label><div class="actions"><button class="btn" data-monzo-assign="'+id+'">Save</button><button class="btn secondary" data-monzo-ignore="'+id+'">Not subs</button></div></div>';
  }).join('');
  const recent=(M.recent||[]).slice(0,8).map(r=>'<div class="mini">'+esc(fmt(r.handled_at)+' · '+money(r.amount_pence)+' · '+(r.status==='ignored'?(r.payer_name||'Unknown')+' · not subs':(r.player_name||'')+' · '+r.games+' game'+(r.games===1?'':'s')+(r.leftover_pence>0?' · '+money(r.leftover_pence)+' left over':'')))+'</div>').join('');
  const aliases=(M.aliases||[]).map(a=>'<div class="mini" style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0">'+esc(a.label+' → '+a.player_name)+'<button class="btn secondary" style="min-height:30px;padding:4px 9px" data-monzo-forget="'+esc(a.id)+'">Forget</button></div>').join('');
  host.innerHTML='<div class="sectionTitle"><h3>Monzo payments</h3><span>'+(pending.length?pending.length+' to check':'All caught up')+'</span></div><div class="file"><div class="fileBody">'+(rows||'<div class="mini" style="padding:12px 0">New payments into Monzo will appear here.</div>')+(matched.length>1?'<button class="btn green full" style="margin-top:6px" data-monzo-apply-all="1">Apply all '+matched.length+' matched payments</button>':'')+(recent?'<details><summary>Recently handled</summary>'+recent+'</details>':'')+(aliases?'<details><summary>Remembered payers ('+(M.aliases||[]).length+')</summary>'+aliases+'</details>':'')+'</div></div>';
}
async function applyMonzo(pay){
  const plan=monzoPlan(pay),done=[];
  for(const f of plan.fixtures){
    const r=await sb.rpc('set_subs_match_status',{p_team_id:team.id,p_season_id:season.id,p_fixture_id:f.id,p_player_id:pay.player_id,p_status:'confirmed_paid'});
    if(r.error){
      // Record what did get marked so the payment is not applied twice.
      await sb.rpc('finish_monzo_payment',{p_payment_id:pay.id,p_status:'applied',p_fixture_ids:done,p_leftover_pence:Number(pay.amount_pence)-done.length*(Number(D.charge_amount_pence)||0)});
      throw new Error(done.length+' of '+plan.fixtures.length+' games marked for '+(pay.player_name||'player')+'. Mark the rest by hand: '+r.error.message);
    }
    done.push(f.id);
  }
  const r=await sb.rpc('finish_monzo_payment',{p_payment_id:pay.id,p_status:'applied',p_fixture_ids:done,p_leftover_pence:plan.leftover});
  if(r.error)throw r.error;
}
async function monzoAction(btn,fn){
  if(busy)return;busy=true;const old=btn.textContent;btn.disabled=true;btn.textContent='Saving…';
  try{const msg=await fn();await reload();toast(msg||'Saved')}catch(e){btn.disabled=false;btn.textContent=old;toast(e.message||String(e));await reload().catch(()=>{})}finally{busy=false}
}
function renderSummary(){
  const s=D.summary||{};
  $('summary').innerHTML='<div class="summaryBox"><b>'+money(s.outstanding_pence)+'</b><span>Outstanding</span></div><div class="summaryBox"><b>'+money(s.received_pence)+'</b><span>Received</span></div><div class="summaryBox"><b>'+(s.players_owing||0)+'</b><span>Players owing</span></div>';
  const due=(D.players||[]).filter(p=>Number(p.amount_due_pence)>0).sort((a,b)=>Number(b.amount_due_pence)-Number(a.amount_due_pence)||a.name.localeCompare(b.name));
  $('outstandingList').innerHTML=due.length?due.map(p=>'<div class="debtor" data-open-player="'+esc(p.player_id)+'"><div><b>'+esc(p.name)+'</b><div class="mini">'+p.payment_due_games+' game'+(p.payment_due_games===1?'':'s')+' to pay</div></div><div class="debtorAmount">'+money(p.amount_due_pence)+' ›</div></div>').join(''):'<div class="success">Nobody currently owes subs.</div>';
  const claims=(D.players||[]).filter(p=>Number(p.claims_paid)>0);
  $('claimBlock').innerHTML=claims.length?'<div class="sectionTitle"><h3>Awaiting confirmation</h3><span>'+claims.reduce((n,p)=>n+Number(p.claims_paid||0),0)+' claim(s)</span></div>'+claims.map(p=>'<div class="debtor" data-open-player="'+esc(p.player_id)+'"><div><b>'+esc(p.name)+'</b><div class="mini">'+p.claims_paid+' payment claim'+(p.claims_paid===1?'':'s')+' to check</div></div><span class="pill claim">Check</span></div>').join(''):'';
  const next=orderedMatches().find(m=>new Date(m.kick_off).getTime()>=Date.now());
  $('nextSubsMatch').innerHTML=next?'<div class="sectionTitle"><h3>Next match</h3><span>Subs collection</span></div><div class="file"><div class="fileHead"><div class="fileHeadTop"><div><h3>'+esc(next.opponent)+'</h3><div class="mini">'+esc(fixtureLabel(next))+' · '+esc(next.competition||'Fixture')+'</div></div><span class="pill '+(next.has_saved_squad?'paid':'claim')+'">'+(next.has_saved_squad?'Squad saved':'No squad yet')+'</span></div></div><div class="fileBody"><button class="btn primary full" data-open-match="'+esc(next.fixture_id)+'">Open this match</button>'+(next.payment_link?'<button class="btn green full" style="margin-top:7px" data-share-link="'+esc(next.fixture_id)+'">Share £'+(Number(D.charge_amount_pence||0)/100).toFixed(2)+' payment link</button>':'')+'</div></div>':'';
}
function orderedMatches(){
  const now=Date.now(),all=(D.matches||[]).slice();
  const future=all.filter(m=>new Date(m.kick_off).getTime()>=now).sort((a,b)=>new Date(a.kick_off)-new Date(b.kick_off));
  const past=all.filter(m=>new Date(m.kick_off).getTime()<now).sort((a,b)=>new Date(b.kick_off)-new Date(a.kick_off));
  return [...future,...past];
}
function chooseDefaultMatch(){
  const all=orderedMatches();
  if(requestedFixture&&all.some(m=>m.fixture_id===requestedFixture))return requestedFixture;
  if(selectedMatch&&all.some(m=>m.fixture_id===selectedMatch))return selectedMatch;
  const nextSaved=all.find(m=>new Date(m.kick_off).getTime()>=Date.now()&&m.has_saved_squad);
  const next=all.find(m=>new Date(m.kick_off).getTime()>=Date.now());
  return (nextSaved||next||all[0]||{}).fixture_id||'';
}
function renderPickers(){
  selectedMatch=chooseDefaultMatch();
  $('playerPicker').innerHTML='<option value="">Select player…</option>'+(D.players||[]).slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>'<option value="'+esc(p.player_id)+'" '+(p.player_id===selectedPlayer?'selected':'')+'>'+esc(p.name)+'</option>').join('');
  $('matchPicker').innerHTML='<option value="">Select match…</option>'+orderedMatches().map(m=>'<option value="'+esc(m.fixture_id)+'" '+(m.fixture_id===selectedMatch?'selected':'')+'>'+esc(fixtureLabel(m))+'</option>').join('');
}
function playerMessage(p){
  const unpaid=(p.matches||[]).filter(m=>m.status==='Not Paid'||m.status==='Unconfirmed');
  return p.name+' – subs outstanding\n\n'+unpaid.map(m=>fmt(m.kick_off)+' – '+m.opponent).join('\n')+'\n\nTotal: '+money(p.amount_due_pence)+(p.payment_link?'\n'+p.payment_link:'');
}
function renderPlayer(){
  const host=$('playerFile');if(!selectedPlayer){host.innerHTML='';return}
  const p=(D.players||[]).find(x=>x.player_id===selectedPlayer);if(!p){host.innerHTML='';return}
  const matches=p.matches||[];
  const pay=Number(p.amount_due_pence)>0?'<div class="payBox"><div class="payBoxTop"><div><b>Outstanding subs</b><div class="mini">'+p.payment_due_games+' game'+(p.payment_due_games===1?'':'s')+'</div></div><div class="bigMoney">'+money(p.amount_due_pence)+'</div></div>'+(p.payment_link?'<a class="btn purple full" style="display:block;text-align:center;text-decoration:none;margin-top:10px" target="_blank" rel="noopener" href="'+esc(p.payment_link)+'">Pay '+money(p.amount_due_pence)+' in one payment</a>':'')+'<button class="btn secondary full" style="margin-top:7px" data-copy-player="'+esc(p.player_id)+'">Copy matches + payment link</button></div>':'<div class="success" style="margin:12px 0">Nothing currently due to pay.</div>';
  const rows=matches.length?matches.map(m=>'<div class="row"><div class="rowTop"><div><div class="matchName">'+esc(fmt(m.kick_off)+' · '+m.opponent)+'</div><div class="mini">'+esc(m.competition||'Fixture')+' · '+esc(m.venue||'')+'</div></div><span class="pill '+pillClass(m.status)+'">'+esc(m.status)+'</span></div><div class="actions">'+statusButtons(m.fixture_id,p.player_id,m.status)+'</div></div>').join(''):'<div class="empty">No chargeable matches recorded for this player yet.</div>';
  host.innerHTML='<div class="file"><div class="fileHead"><div class="fileHeadTop"><div><h3>'+esc(p.name)+'</h3><div class="mini">'+p.confirmed_paid+' paid · '+p.payment_due_games+' owing'+(p.claims_paid?' · '+p.claims_paid+' claim(s) to check':'')+'</div></div><div class="bigMoney">'+money(p.amount_due_pence)+'</div></div></div><div class="fileBody">'+pay+'<div class="sectionTitle"><h3>Match history</h3><span>'+matches.length+' match'+(matches.length===1?'':'es')+'</span></div>'+rows+'</div></div>';
}
function matchPlayers(m){
  const arr=[...(m.players||[])];
  if(!m.is_final&&!m.has_saved_squad){
    const have=new Set(arr.map(p=>p.player_id));
    for(const r of (D.roster||[]))if(!have.has(r.player_id))arr.push({player_id:r.player_id,name:r.name,shirt_number:r.shirt_number,status:'Not selected yet',fallback:true});
  }
  const rank=s=>({'Not Paid':0,'Unconfirmed':0,'Claims Paid':1,'Not selected yet':2,'Confirmed Paid':3,'N/A':4}[s]??5);
  return arr.sort((a,b)=>rank(a.status)-rank(b.status)||String(a.name).localeCompare(String(b.name)));
}
function renderMatch(){
  const host=$('matchFile');if(!selectedMatch){host.innerHTML='';return}
  const m=(D.matches||[]).find(x=>x.fixture_id===selectedMatch);if(!m){host.innerHTML='';return}
  const players=matchPlayers(m),due=players.filter(p=>p.status==='Not Paid'||p.status==='Unconfirmed'),paid=players.filter(p=>p.status==='Confirmed Paid');
  const pay=m.payment_link?'<div class="payBox" style="margin:10px 0"><div class="payBoxTop"><div><b>Collect match subs</b><div class="mini">'+money(D.charge_amount_pence)+' each · '+esc(m.opponent)+'</div></div><div class="bigMoney">'+money(D.charge_amount_pence)+'</div></div><a class="btn purple full" style="display:block;text-align:center;text-decoration:none;margin-top:10px" target="_blank" rel="noopener" href="'+esc(m.payment_link)+'">Open payment link</a><div class="actions" style="margin-top:7px"><button class="btn secondary" data-copy-link="'+esc(m.fixture_id)+'">Copy payment link</button><button class="btn green" data-share-link="'+esc(m.fixture_id)+'">Share payment link</button></div></div>':'<div class="empty" style="margin:10px 0">No payment link is configured for this match.</div>';
  const copy=due.length?'<button class="btn secondary full" style="margin:10px 0 2px" data-copy-match="'+esc(m.fixture_id)+'">Copy outstanding list + payment link</button>':'';
  const note=!m.is_final&&!m.has_saved_squad?'<div class="empty" style="margin:10px 0">No squad has been saved for this fixture yet, so all active players are shown. You can still mark payments received before matchday.</div>':'';
  const rows=players.length?players.map(p=>'<div class="row"><div class="rowTop"><div><div class="matchName">'+esc(p.name)+'</div><div class="mini">'+(p.fallback?'Not yet in saved squad':(p.played?'Played':'Match squad'))+'</div></div><span class="pill '+pillClass(p.status)+'">'+esc(p.status)+'</span></div><div class="actions">'+statusButtons(m.fixture_id,p.player_id,p.status)+'</div></div>').join(''):'<div class="empty">No players are attached to this match yet.</div>';
  host.innerHTML='<div class="file"><div class="fileHead"><div class="fileHeadTop"><div><h3>'+esc(m.opponent)+'</h3><div class="mini">'+esc(fixtureLabel(m))+' · '+esc(m.competition||'Fixture')+'</div></div><span class="pill paid">'+paid.length+' paid</span></div></div><div class="fileBody">'+pay+note+'<div class="summaryGrid" style="grid-template-columns:1fr 1fr;margin:12px 0"><div class="summaryBox"><b>'+paid.length+'</b><span>Paid</span></div><div class="summaryBox"><b>'+due.length+'</b><span>Outstanding</span></div></div>'+copy+rows+'</div></div>';
}
function setTab(name){tab=name;['summary','player','match'].forEach(v=>{$(v+'View').classList.toggle('hidden',v!==name);document.querySelectorAll('[data-tab="'+v+'"]').forEach(b=>b.classList.toggle('active',v===name))})}
async function setStatus(btn){
  if(busy)return;busy=true;const old=btn.textContent;btn.disabled=true;btn.textContent='Saving…';
  const r=await sb.rpc('set_subs_match_status',{p_team_id:team.id,p_season_id:season.id,p_fixture_id:btn.dataset.fixture,p_player_id:btn.dataset.player,p_status:btn.dataset.status});
  busy=false;if(r.error){btn.disabled=false;btn.textContent=old;toast(r.error.message);return}
  await reload();toast('Subs updated');
}
function showCopyFallback(text){
  const existing=document.getElementById('subsCopyFallback');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.id='subsCopyFallback';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  const panel=document.createElement('div');
  panel.style.cssText='background:#fff;color:#17212b;width:min(100%,560px);max-height:90vh;overflow:auto;border-radius:16px;padding:18px;box-shadow:0 12px 45px #0004';
  const title=document.createElement('h3');
  title.textContent='Copy matches and payment link';
  title.style.margin='0 0 8px';
  const help=document.createElement('p');
  help.textContent='Your browser blocked automatic copying. Tap and hold the text below, then choose Select All and Copy.';
  help.style.cssText='font-size:14px;line-height:1.5;margin:0 0 12px';
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.readOnly=true;
  ta.setAttribute('aria-label','Matches and payment link to copy');
  ta.style.cssText='display:block;width:100%;height:220px;max-height:40vh;padding:12px;border:1px solid #b6cbd9;border-radius:8px;font:16px/1.5 system-ui;resize:vertical;user-select:text;-webkit-user-select:text';
  const close=document.createElement('button');
  close.type='button';
  close.textContent='Close';
  close.className='btn secondary full';
  close.style.marginTop='12px';
  close.addEventListener('click',()=>overlay.remove());
  panel.append(title,help,ta,close);
  overlay.appendChild(panel);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});
  document.body.appendChild(overlay);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0,ta.value.length);
}
function copyText(text,msg){
  // Call the Clipboard API directly in the tap handler (iOS Safari requires
  // the user's gesture). Never rely on hidden textarea execCommand('copy').
  if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){
    try{
      navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>showCopyFallback(text));
      return;
    }catch(e){}
  }
  showCopyFallback(text);
}
function copyMatch(id){
  const m=(D.matches||[]).find(x=>x.fixture_id===id);if(!m)return;
  const due=matchPlayers(m).filter(p=>p.status==='Not Paid'||p.status==='Unconfirmed');
  if(!due.length)return toast('Nobody is outstanding for this match');
  const text=m.opponent+' – subs outstanding\n\n'+due.map(p=>p.name).join('\n')+'\n\n'+money(D.charge_amount_pence)+' each'+(m.payment_link?'\n'+m.payment_link:'');
  copyText(text,'Match payment list copied');
}
function paymentShareText(m){
  return '*💷 Match Subs - '+m.opponent+'*\n\n'+money(D.charge_amount_pence)+' each\n\n'+(m.payment_link||'');
}
function copyPaymentLink(id){
  const m=(D.matches||[]).find(x=>x.fixture_id===id);if(!m?.payment_link)return toast('No payment link available');
  copyText(m.payment_link,'Payment link copied');
}
async function sharePaymentLink(id){
  const m=(D.matches||[]).find(x=>x.fixture_id===id);if(!m?.payment_link)return toast('No payment link available');
  const text=paymentShareText(m);
  if(navigator.share){try{await navigator.share({text});return}catch(e){if(e?.name==='AbortError')return}}
  await copyText(text,'Payment message copied');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){setTab(t.dataset.tab);return}
  const op=e.target.closest('[data-open-player]');if(op){selectedPlayer=op.dataset.openPlayer;setTab('player');renderPickers();renderPlayer();return}
  const om=e.target.closest('[data-open-match]');if(om){selectedMatch=om.dataset.openMatch;setTab('match');renderPickers();renderMatch();return}
  const st=e.target.closest('[data-status]');if(st){setStatus(st);return}
  const findPay=id=>(M.pending||[]).find(x=>x.id===id);
  const ma=e.target.closest('[data-monzo-apply]');if(ma){const pay=findPay(ma.dataset.monzoApply);if(pay)monzoAction(ma,async()=>{await applyMonzo(pay);return 'Payment applied'});return}
  const mall=e.target.closest('[data-monzo-apply-all]');if(mall){monzoAction(mall,async()=>{const list=(M.pending||[]).filter(p=>p.status==='matched');for(const pay of list){await applyMonzo(pay);await reload()}return list.length+' payments applied'});return}
  const mg=e.target.closest('[data-monzo-assign]');if(mg){const id=mg.dataset.monzoAssign,player=$('monzoPick_'+id)?.value;if(!player)return toast('Choose a player first');monzoAction(mg,async()=>{const r=await sb.rpc('assign_monzo_payment',{p_payment_id:id,p_player_id:player,p_remember:!!$('monzoRemember_'+id)?.checked});if(r.error)throw r.error;return 'Player saved'});return}
  const mc=e.target.closest('[data-monzo-change]');if(mc){const pay=findPay(mc.dataset.monzoChange);if(pay){pay.status='unmatched';renderMonzo()}return}
  const mi=e.target.closest('[data-monzo-ignore]');if(mi){monzoAction(mi,async()=>{const r=await sb.rpc('finish_monzo_payment',{p_payment_id:mi.dataset.monzoIgnore,p_status:'ignored'});if(r.error)throw r.error;return 'Marked as not subs'});return}
  const mf=e.target.closest('[data-monzo-forget]');if(mf){monzoAction(mf,async()=>{const r=await sb.rpc('remove_monzo_payer_alias',{p_alias_id:mf.dataset.monzoForget});if(r.error)throw r.error;return 'Payer forgotten'});return}
  const cp=e.target.closest('[data-copy-player]');if(cp){const p=(D.players||[]).find(x=>x.player_id===cp.dataset.copyPlayer);if(p)copyText(playerMessage(p),'Player payment details copied');return}
  const cm=e.target.closest('[data-copy-match]');if(cm){copyMatch(cm.dataset.copyMatch);return}
  const cl=e.target.closest('[data-copy-link]');if(cl){copyPaymentLink(cl.dataset.copyLink);return}
  const sl=e.target.closest('[data-share-link]');if(sl){sharePaymentLink(sl.dataset.shareLink);return}
});
$('playerPicker').onchange=()=>{selectedPlayer=$('playerPicker').value;renderPlayer()};
$('matchPicker').onchange=()=>{selectedMatch=$('matchPicker').value;renderMatch()};
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('./login.html')});
boot();
</script>
</body>
